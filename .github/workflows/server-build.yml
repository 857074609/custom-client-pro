name: Server Build (hbbs/hbbr musl)
run-name: Server Build (hbbs/hbbr musl)
on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: 'rustdesk-server ref (tag/branch/commit)'
        required: false
        default: 'v1.2.2'
      patches_ref:
        description: 'patches ref to apply server patches from'
        required: false
        default: 'main'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout rustdesk-server (alonginwind fork)
        uses: actions/checkout@v5
        with:
          repository: alonginwind/rustdesk-server
          ref: ${{ inputs.server_ref }}
          path: server
          submodules: recursive
          token: ${{ secrets.REPO }}

      - name: Checkout patches scripts
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          path: patches
          token: ${{ secrets.REPO }}
          ref: ${{ inputs.patches_ref }}

      - name: Apply server patches (super-p2p v187b)
        run: |
          python3 patches/server/patch_hbbs_v187b.py server
          grep -q "additional_candidates = 9" server/libs/hbb_common/protos/rendezvous.proto || { echo "[FAIL] proto PunchHoleSent field missing"; exit 1; }
          grep -q "additional_candidates = 13" server/libs/hbb_common/protos/rendezvous.proto || { echo "[FAIL] proto PunchHoleResponse field missing"; exit 1; }
          grep -q "SUPER_P2P_V187B" server/src/rendezvous_server.rs || { echo "[FAIL] handle_hole_sent pass-through missing"; exit 1; }

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make
          rustup target add x86_64-unknown-linux-musl

      - name: Build hbbs and hbbr (musl static)
        working-directory: server
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/hbbs target/x86_64-unknown-linux-musl/release/hbbr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-hbbr-musl-${{ inputs.server_ref }}
          path: |
            server/target/x86_64-unknown-linux-musl/release/hbbs
            server/target/x86_64-unknown-linux-musl/release/hbbr
          if-no-files-found: error
