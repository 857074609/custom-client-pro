# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:
    inputs:
      version:
        description: 'Rustdesk Version'
        required: true
        default: '1.3.1'
        type: string
      patches_sha:
        description: '857074609/patches commit SHA (MUST track the generator pins)'
        required: true
        type: string
    secrets:
      REPO:
        description: 'token to checkout the private patches repo'
        required: true

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-24.04,
              extra-build-args: "",
            }
    steps:
      - name: Resolve checkout ref
        id: resolve_ref
        shell: bash
        run: |
          VERSION="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]')"
          
          if [[ "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            echo "ref=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ steps.resolve_ref.outputs.ref }}
          submodules: recursive
          # No step here needs history (no git describe/rev-parse).
          fetch-depth: 1

      - name: Checkout patches (for bridge binding)
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          ref: ${{ inputs.patches_sha }}
          path: patches
          token: ${{ secrets.REPO }}

      - name: Apply cursor-prediction patch so the Dart binding includes mainGetCursorPrediction
        run: |
          # [LnDesk v269] The windows/linux/macos/portable/win7/android builds inject a
          # new flutter_ffi function main_get_cursor_prediction via patch_cursor_prediction.py.
          # This bridge job generates generated_bridge.dart from the checked-out
          # flutter_ffi.rs, so we must apply the SAME patch here -- otherwise the Dart
          # side (cursor_overlay.dart -> bind.mainGetCursorPrediction()) fails to compile
          # with "The method 'mainGetCursorPrediction' isn't defined". The patch is
          # idempotent (SKIPs if already applied).
          python3 patches/patch_cursor_prediction.py .
          grep -qF 'main_get_cursor_prediction' ./src/flutter_ffi.rs || { echo "[FAIL] bridge: flutter_ffi.rs not patched"; exit 1; }
          echo "[OK] bridge: flutter_ffi.rs patched for cursor prediction"

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      # `cargo install` compiles both tools from source on every single run, which
      # is pure waste because their versions are pinned here. Cache the two
      # binaries (not the whole ~/.cargo/bin, which holds the rustup shims).
      - name: Cache bridge codegen binaries
        id: cache-frb
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-bin-${{ matrix.job.os }}-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Cache Dart/Flutter pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-bridge-${{ matrix.job.os }}-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            pub-bridge-${{ matrix.job.os }}-

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        if: steps.cache-frb.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # [LnDesk] --force is REQUIRED: the ubuntu-24.04 runner image can ship a
          # prebuilt cargo-expand in ~/.cargo/bin. Without it cargo aborts with
          # "error: binary `cargo-expand` already exists in destination" (exit 101)
          # and the whole bridge job fails. --force keeps the pinned version
          # authoritative (overwrites whatever the image/cache left behind) and is
          # idempotent, so a cache hit + re-run is still safe.
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked --force
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked --force

      - name: Verify bridge codegen binaries
        shell: bash
        run: |
          # Guard against a cache entry that restored an empty/truncated binary.
          test -x ~/.cargo/bin/cargo-expand || { echo "::error::cargo-expand missing after restore"; exit 1; }
          test -x ~/.cargo/bin/flutter_rust_bridge_codegen || { echo "::error::flutter_rust_bridge_codegen missing after restore"; exit 1; }
          # --version is informational only: not every codegen build accepts it.
          ~/.cargo/bin/cargo-expand --version || true
          ~/.cargo/bin/flutter_rust_bridge_codegen --version || true

      - name: Fetch flutter pub dependencies
        shell: bash
        run: |
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
