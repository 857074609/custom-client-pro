          grep -q "kBrandAppName" ./flutter/lib/common/brand.dart || { echo "[FAIL] v150: brand.dart not injected"; exit 1; }
          grep -q "kBrandAppName" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: brand name not used by the toast"; exit 1; }
          grep -q "main_write_log" ./src/flutter_ffi.rs || { echo "[FAIL] v150: dart log bridge missing"; exit 1; }
