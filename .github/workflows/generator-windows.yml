          grep -qF '("cpu", &status.cpu.map_or(NULL, |it| format!("{:.1}%", it)))' src/flutter.rs || { echo "[FAIL] v338: flutter cpu key missing"; exit 1; }
          grep -qF "String? cpu;" flutter/lib/models/model.dart || { echo "[FAIL] v338: model cpu field missing"; exit 1; }
          grep -qF "evt.containsKey('gpu')" flutter/lib/models/model.dart || { echo "[FAIL] v338: model gpu parser missing"; exit 1; }
          grep -qF '_row("色彩"' flutter/lib/common/widgets/overlay.dart || { echo "[FAIL] v338: overlay 色彩 label missing"; exit 1; }
          grep -qF '_row("处理器"' flutter/lib/common/widgets/overlay.dart || { echo "[FAIL] v338: overlay 处理器 row missing"; exit 1; }
          grep -qF '_row("显卡"' flutter/lib/common/widgets/overlay.dart || { echo "[FAIL] v338: overlay 显卡 row missing"; exit 1; }
          [ "$(grep -c '_sysColor(' flutter/lib/common/widgets/overlay.dart)" -ge 5 ] || { echo "[FAIL] v338: _sysColor not wired to 5 rows"; exit 1; }
          if grep -qF '_row("Chroma"' flutter/lib/common/widgets/overlay.dart; then echo "[FAIL] v338: old Chroma label still present"; exit 1; fi
          if grep -qF '_row("Speed"' flutter/lib/common/widgets/overlay.dart; then echo "[FAIL] v338: old Speed label still present"; exit 1; fi
          # row order must be label-length ascending (shortest first)
          python3 - <<'PY'
          import re, sys
          o = open('flutter/lib/common/widgets/overlay.dart', encoding='utf-8').read()
          labels = re.findall(r'_row\(\s*"([^"]+)"', o)
          exp = ["速度", "帧率", "延迟", "色彩", "内存", "硬盘", "网络", "显卡", "通道",
                 "处理器",
                 "编解码器", "编码模式", "理论码率", "理论帧率", "解码模式",
                 "目标比特率",
                 "被控端编码器", "主控端解码器",
                 "Surface直显"]
          if labels != exp:
              print("[FAIL] v338 row order mismatch"); print("  got:", labels); sys.exit(1)
          print("[OK] v338 row order (label length ascending)")
          PY
          echo "[OK] v338 controlled-end system-load rows applied"
          grep -qF "[LnDesk v227c settings outline]" flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] v227c: settings outline marker missing"; exit 1; }
          grep -q "elevation: 0," flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] v227c: settings card elevation 0 missing"; exit 1; }
          echo "[OK] settings section outlines applied"

      - name: Relax upstream lint noise for analyze gate
        shell: bash
        run: |
          # [LnDesk v160] Upstream rustdesk ships many cosmetic lint issues
          # (constant_identifier_names / camel_case_types / unnecessary_import /
          # unused_import / unnecessary_this / unused_element) in web-platform
          # files we never patch (lib/web/**, lib/models/web_model.dart,
          # lib/utils/multi_window_manager.dart). They are infos/warnings, but
          # to keep the analyze gate focused on REAL compile errors only, drop a
          # scoped analysis_options that silences exactly those rules while
          # inheriting the repo's own settings. Compile errors (undefined names,
          # type mismatches) are NOT in this set and remain fatal.
          cat > flutter/analysis_options.yaml <<'YAML'
          include: ../analysis_options.yaml
          linter:
            rules:
              constant_identifier_names: false
              camel_case_types: false
              unnecessary_import: false
              unused_import: false
              unnecessary_this: false
              unused_element: false
          YAML
          echo "[OK] suppressed upstream cosmetic lint rules for analyze gate"

      - name: Guard - IconFont FA glyph references must be defined (v225)
        shell: bash
        run: |
          # [v225] both 模板（connection_page_both / desktop_home_page_both）引用 IconFont.faXxx，
          # 这些常量由 patch_font_awesome_icons.py 注入 flutter/lib/common.dart。若某工作流只 cp
          # 模板、没跑 FA 步骤（win7 曾缺该步骤 -> undefined_getter），analyze 只会在 200+ 条
          # info/warning 里冒出 4 行 error，定位成本很高。这里做一次廉价的符号对账，
          # 直接在步骤日志里点名缺失的字形。
          cd ./flutter
          missing=0
          for sym in $(grep -rhoE 'IconFont\.fa[A-Za-z0-9]+' lib | sed 's/IconFont\.//' | sort -u); do
            if ! grep -q "static const IconData ${sym} " lib/common.dart; then
              echo "[FAIL] v225-guard: IconFont.${sym} 未在 flutter/lib/common.dart 定义（FA 图标步骤未执行？）"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "[OK] v225-guard: 所有 IconFont FA 字形引用均已在 common.dart 定义"
          cd ..

      - name: Gate - flutter analyze (fail fast on Dart compile errors)
        shell: bash
        run: |
          # Catch Dart semantic/compile errors (e.g. non-constant expression,
          # int passed where double is required) HERE with file:line, instead of
          # burying them inside MSB8066 during 'flutter build'.
          # Only ERRORS are fatal: upstream carries many lint infos/warnings
          # that must not block the build. 'lib' only (test/ often noisy).
          # [LnDesk v160] cosmetic rules already silenced via flutter/analysis_options.yaml.
          cd ./flutter
          flutter pub get
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### flutter analyze: Dart errors (fatal)"
              echo '```'
              grep -iE 'error' analyze.log | head -40 || echo '(no error line matched)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "[FAIL] flutter analyze reported Dart errors - see the job summary"
            exit 1
          fi
          echo "[OK] flutter analyze clean (no Dart errors)"
          cd ..

      - name: Snapshot scrubbed source (v319)
        if: ${{ fromJson(inputs.extras || '{}').generate_source == 'true' }}
        shell: bash
        env:
          SUPER_P2P_REFLECTORS: ${{ fromJson(inputs.extras || '{}').custom_p2p_reflector || '' }}
        run: |
          # [LnDesk v319] Copy the fully-patched source tree BEFORE compilation
          # and scrub every server secret, so a safe snapshot can ship next to
          # the binaries. Gated by the docker checkbox "generate source"
          # (generate_source); unchecked builds skip this step entirely.
          # v317: also neutralizes REFLECTORS / preset-password XOR pair /
          # custom STUN IPs / LnDesk branding, and ships rustdesk/custom_.txt.
          # v319: the workspace HEAD is the pristine upstream tag commit and
          # every patch edits the working tree, so `git diff` (after
          # `git add -N` to register patch-created files) is the exact set of
          # patch-injected lines - the scrubber uses it to strip ALL
          # patch-injected comments, marked or not, leaving upstream
          # comments untouched. No usable diff -> marker-only fallback.
          set -e
          SNAP="./_release_src"
          rm -rf "$SNAP"
          mkdir -p "$SNAP"
          # Patch-injected line set (worktree vs index; intent-to-add makes
          # patch-created files show up as new-file diffs). Build artifacts
          # are excluded by pathspec - .gitignore only covers /target.
          # Failures here are non-fatal: the scrubber falls back to
          # marker-only comment stripping.
          git add -N -- . 2>/dev/null || true
          git diff -U0 --no-renames \
            -- . \
            ':(exclude)windows-x64-release' \
            ':(exclude)windows-x64-release.zip' \
            ':(exclude)_release_src' \
            ':(exclude)_patchdiff.txt' \
            ':(exclude)exe' \
            ':(exclude)SignOutput' \
            ':(exclude)rustdesk' \
            > _patchdiff.txt 2>/dev/null || true
          # Whole repo minus VCS / build caches / patch backups. patches/ and
          # .github/ are dropped by the scrubber (customization traces).
          tar -c \
            --exclude=./.git \
            --exclude=./target \
            --exclude=./_release_src \
            --exclude=./_patchdiff.txt \
            --exclude=./exe \
            --exclude=./rustdesk \
            --exclude=./SignOutput \
            --exclude='*/build' \
            --exclude='*/.dart_tool' \
            --exclude='*.bak*' \
            --exclude=./windows-x64-release \
            --exclude=./windows-x64-release.zip \
            --exclude=./patches \
            --exclude=./.github \
            -f - . | tar -x -f - -C "$SNAP"
          # custom_.txt: docker frontend payload (base64 JSON). ./rustdesk is
          # tar-excluded and the real file is only written later during
          # packaging, so rebuild it here from the same dispatch input
          # (server fields were retired in favour of the compile-time lock,
          # so it carries no server secrets).
          if [ -n "${{ inputs.custom }}" ]; then
            mkdir -p "$SNAP/rustdesk"
            printf '%s' '${{ inputs.custom }}' > "$SNAP/rustdesk/custom_.txt"
          fi
          # Replace server/key/relay/iroh/PIN/password/REFLECTORS/STUN/brand
          # with placeholders and strip patch-injected comments per the diff.
          # Hard gate inside: any residual real value fails this step (exit 1).
          python3 patches/tooling/scrub_source_for_release.py "$SNAP" ./_patchdiff.txt
          # README: placeholder legend + this build's key switches. Switch
          # states are presence/boolean only - never the secret values.
          IROH_SW=关
          if [ "${{ fromJson(inputs.extras || '{}').enable_iroh_direct }}" = "true" ]; then IROH_SW=开; fi
          QUALITY_SW=关
          if [ "${{ fromJson(inputs.extras || '{}').image_quality_opt }}" = "true" ]; then QUALITY_SW=开; fi
          OTP_SW=关
          if [ "${{ fromJson(inputs.extras || '{}').enable_otp }}" = "true" ]; then OTP_SW=开; fi
          WALL_SW=关
          if [ "${{ inputs.screen_wall }}" = "true" ]; then WALL_SW=开; fi
          PW_STATE=未注入
          if [ -n "${PERMANENT_PASSWORD:-}" ]; then PW_STATE=已注入; fi
          PIN_STATE=未注入
          if [ -n "${UNLOCK_PIN:-}" ]; then PIN_STATE=已注入; fi
          cat > "$SNAP/README-RELEASE-SOURCE.md" <<EOF
          # 源码说明

          本目录是编译前的完整源码。所有服务器信息与密码均已替换为占位符或
          还原为上游默认状态，可安全查看、存档与二次编译。

          ## 一、占位符说明

          | 占位符 | 含义 | 恢复方法 |
          | --- | --- | --- |
          | __CUSTOM_SERVER__ | ID / rendezvous 服务器 | 设置环境变量 CUSTOM_SERVER，重跑 set_server.py 与 patch_server_lock_compiletime.py |
          | __CUSTOM_RELAYSERVER__ | 中继服务器（relay） | CUSTOM_RELAYSERVER（留空则按 ID 服务器端口 +1 自动推导） |
          | __CUSTOM_APISERVER__ | API 服务器 | CUSTOM_APISERVER |
          | __CUSTOM_KEY__ | 连接密钥（RS 公钥） | CUSTOM_KEY |
          | __SUPER_P2P_REFLECTORS__ | 反射节点（REFLECTORS，super_p2p NAT 观测用） | 环境变量 SUPER_P2P_REFLECTORS（生成器 extras custom_p2p_reflector，patch_super_p2p.py 烘焙） |
          | __CUSTOM_STUN__ | 国内 STUN 服务器地址（V196/V298 补充） | 修改 src/common.rs 的 STUNS_V4 与 src/super_p2p/mod.rs 的 STUN_TARGETS |
          | __IROH_RELAY_URL__ / _2 / _3 | iroh 主 / 备 / 三备中继 | IROH_RELAY_URL / _2 / _3（iroh_transport.py 编译期烘焙） |
          | __IROH_DNS_URL__ / _2 / _3 | iroh pkarr / DNS 发现地址 | IROH_DNS_URL / _2 / _3 |
          | @@UNLOCK_PIN@@ | 主界面解锁 PIN | UNLOCK_PIN（patch_unlock_pin.py 注入） |

          以下各项不设占位符，均已整块还原为上游默认行，均位于
          libs/hbb_common/src/config.rs：
          - 预设固定密码：原值是由 patch_permanent_password_new.py 写入的
            XOR 混淆字节对（可逆），故已清空为空数组（即未配置预设密码）；
            需要时设置 PERMANENT_PASSWORD 环境变量并重跑该脚本注入。
          - 编译期服务器锁（OVERWRITE_SETTINGS）：原值为 XOR 混淆（可逆），
            故整块还原；需要时重跑 patch_server_lock_compiletime.py。

          ## 二、其他说明

          - rustdesk/custom_.txt：构建前端生成的外观与开关配置（base64 编码的
            JSON）。服务器字段已废弃（改由编译期服务器锁注入），文件内不含
            服务器机密；运营者手工覆盖项中如含敏感值，已同样替换为占位符。
          - src/super_p2p 与 src/common.rs 中测试夹具的公网 IP 已替换为
            RFC 5737 文档段地址（192.0.2.0/24 等），不影响测试逻辑。

          ## 三、本次构建的关键开关

          | 开关 | 值 |
          | --- | --- |
          | 构建工作流 | Custom Windows Client Generator |
          | Rust 工具链 | ${RUST_VERSION:-unknown} |
          | UI 变体 / 连接方向 | ${UI_VARIANT:-unknown} |
          | iroh 直连 | $IROH_SW |
          | 图像质量优化 | $QUALITY_SW |
          | OTP 一次性密码 | $OTP_SW |
          | 屏幕墙 | $WALL_SW |
          | 预设固定密码 | $PW_STATE |
          | 解锁 PIN | $PIN_STATE |
          | 版本 / 构建号 | ${VERSION}.${RUSTDESK_BUILD_NUMBER:-0} |
          | 构建 UUID | ${{ inputs.uuid }} |

          表中「预设固定密码 / 解锁 PIN」的「已注入」仅表示本次构建启用了该
          功能；其敏感值已按第一节方式处理，源码中不含任何可用机密。

          ## 四、重新构建

          本目录即编译前的完整源码，可直接编译。定制补丁脚本与 CI 配置未随
          源码发布；如需重新注入服务器信息，请按第一节的方法设置对应环境变量。
          定制方注入的注释已全部清除，上游原有注释保留原样。
          EOF
          sed -i 's/^ \{10\}//' "$SNAP/README-RELEASE-SOURCE.md"
          echo "[OK] v315: scrubbed source snapshot ready at $SNAP"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk — 对齐官方 build-for-windows 参数（--portable --skip-portable-pack）
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
 
          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk   

          # Download printer driver files and extract them to ./rustdesk
           try {
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

             # Check and move the files
             $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
             $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
             $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
             $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
             if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                 Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                 Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                 mkdir ./rustdesk/drivers
                 mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                 Expand-Archive printer_driver_adapter.zip -DestinationPath .
                 mv -Force .\printer_driver_adapter.dll ./rustdesk
             } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                 Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
             } else {
                 Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
             }
           } catch {
               Write-Host "Ingore the printer driver error."
           }
          
      - name: icon stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png not found"
            exit 1
          fi
          ASSET_DIR="./rustdesk/data/flutter_assets/assets"
          ICON_SVG="$ASSET_DIR/icon.svg"
          [ -f "$ICON_SVG" ] && mv "$ICON_SVG" "$ICON_SVG.bak"
          magick ./res/icon.png "$ICON_SVG"
      
      - name: Download logo.png
        if: ${{ inputs.logolink == 'true' }}
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        shell: pwsh
        run: |
          $outDir = "./rustdesk/data/flutter_assets/assets"
          if (!(Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }
          $uri = "${env:GENURL}/png/${env:UUID}/logo.png"
          Invoke-WebRequest -Uri $uri -OutFile "$outDir/logo.png" -TimeoutSec 30

      # [LnDesk v336] 卡片标识（both 标题前小图标）：与 logo.png 同一投递链
      # （docker 前端上传 -> MEDIA_ROOT/png/{uuid}/card_mark.png -> GET /png/
      # {uuid}/card_mark.png -> 运行期 bundle）。门控取自 extras 的
      # card_mark_link；未上传时本步骤与标题区注入一并跳过（D1）。
      - name: Download card_mark.png
        if: ${{ fromJson(inputs.extras || '{}').card_mark_link == 'true' }}
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        shell: pwsh
        run: |
          $outDir = "./rustdesk/data/flutter_assets/assets"
          if (!(Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }
          $uri = "${env:GENURL}/png/${env:UUID}/card_mark.png"
          Invoke-WebRequest -Uri $uri -OutFile "$outDir/card_mark.png" -TimeoutSec 30
      
      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"
                      
      
      - name: Create custom_.txt file
        shell: bash
        run: |
          echo -n "${{ inputs.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Stage code-signing public cert into package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          cp -f patches/CodeSignCert_Public.cer ./rustdesk/CodeSignCert_Public.cer
          echo "✅ public cert staged into ./rustdesk/ (imported at install time)"

      - name: Pack payload binaries with UPX (before packaging & signing)
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          # [v227c] 签名前对负载二进制加壳：压缩主程序与核心 DLL（体积约省 50-60%）。
          # 顺序必须保证：先加壳、后自解压打包与签名（加壳会使既有签名失效）。
          # 只压 rustdesk.exe + librustdesk.dll；flutter_windows.dll（引擎）与
          # WindowInjection.dll（注入 DLL）不压，规避加载兼容与杀软误报放大。
          # [LnDesk v316] UPX fail-soft：UPX 是可选体积优化，社区源 504 / 网络抽风时重试一次；
          # 仍不可用则打 warning 并跳过加壳（出未加壳包），绝不让 127 带崩整个构建。
          if ! command -v upx >/dev/null 2>&1; then
            choco install upx -y --no-progress || choco install upx -y --no-progress || echo "::warning::choco install upx failed (feed down?)"
          fi
          if ! command -v upx >/dev/null 2>&1; then
            echo "::warning::[v227c] UPX unavailable, skipping payload packing (build ships unpacked)"
            exit 0
          fi
          upx --version
          upx -9 --lzma ./rustdesk/rustdesk.exe ./rustdesk/librustdesk.dll
          ls -l ./rustdesk/rustdesk.exe ./rustdesk/librustdesk.dll
          echo "[OK] payload packed with UPX"

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ inputs.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ inputs.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          PACKER=$(find ./target -name "rustdesk-portable-packer.exe" | head -1)
          if [ -z "$PACKER" ]; then echo "::error::rustdesk-portable-packer.exe not found"; exit 1; fi
          mv "$PACKER" "./SignOutput/rustdesk.exe"

      # [V53] MSI build disabled (distribution relies on -install.exe).
      # - name: Add MSBuild to PATH
      #   uses: microsoft/setup-msbuild@v2

      # - name: Build msi

      #   if: env.UPLOAD_ARTIFACT == 'true'
      #   # MSI 是附带产物（分发主力是 -install.exe）：MSI 编译失败仅告警跳过，不阻断工作流
      #   continue-on-error: true
      #   run: |
      #     $myappname = "${{ inputs.appname }}" -replace '\s','_'
      #     cp "rustdesk/${{ inputs.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
      #     pushd ./res/msi
      #     python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
      #     nuget restore msi.sln
      #     msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
      #     cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
      #     mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
      #     sha256sum ../../SignOutput/rustdesk.msi

      - name: Sign Windows binaries (EXE and MSI)
        if: env.UPLOAD_ARTIFACT == 'true' && (success() || failure())
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PASS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "Skipping signing: CODE_SIGN_PFX_BASE64 secret is not set."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "Skipping signing: CODE_SIGN_PASS_PASSWORD secret is not set."
            exit 0
          }
          Write-Host "Creating certificate file from CODE_SIGN_PFX_BASE64"
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          $certBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("certificate\certificate.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.Directory.FullName -like "*x64*" } |
                      Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                      Select-Object -First 1
      
          if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                        Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                        Select-Object -First 1
          }
      
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows SDK paths."
            exit 1
          }
          Write-Host "Using signtool: $($signtool.FullName)"
      
          $exePath = ".\SignOutput\rustdesk.exe"
          $msiPath = ".\SignOutput\rustdesk.msi"
      
          if (Test-Path $exePath) {
            Write-Host "Signing EXE: $exePath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $exePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "EXE not found at $exePath, skipping."
          }
      
          if (Test-Path $msiPath) {
            Write-Host "Signing MSI: $msiPath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $msiPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "MSI not found at $msiPath, skipping."
          }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Extract first 4 chars of UUID
        id: tag
        shell: bash
        run: |
          RAW_UUID="${{ github.event.inputs.uuid }}"
          CLEAN_UUID=$(echo "$RAW_UUID" | tr -d '-')
          SHORT_UUID=${CLEAN_UUID:0:4}
          echo "tag=$SHORT_UUID" >> "$GITHUB_OUTPUT"
          
      - name: Set build filename
        id: build_name
        shell: bash
        run: |
          VER="${{ env.VERSION }}"
          W="${{ env.RUSTDESK_BUILD_NUMBER }}"
          # 始终带第4段构建号（W，即使 0 -> .0）：保证构建文件名与下载链接一致，且始终显示4段版本号
          VER_SUFFIX=".${W:-0}"
          NAME="${{ inputs.filename }}-${VER}${VER_SUFFIX}-win-${{ steps.conn.outputs.conn }}-x86_64-${{ steps.tag.outputs.tag }}"
          echo "BUILD_FILENAME=$NAME" >> "$GITHUB_ENV"
          echo "value=$NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Build filename set to: $NAME"
      
      - name: Rename EXE
        shell: bash
        run: |
          mv "./SignOutput/rustdesk.exe" "./SignOutput/${BUILD_FILENAME}-install.exe"
          echo "✅ EXE renamed to ${BUILD_FILENAME}-install.exe (double-click = silent install)"
      
      - name: Rename MSI (optional)
        shell: bash
        run: |
          test -f "./SignOutput/rustdesk.msi" && \
            mv "./SignOutput/rustdesk.msi" "./SignOutput/${BUILD_FILENAME}.msi" && \
            echo "✅ MSI renamed to ${BUILD_FILENAME}.msi" || \
            echo "⚠️ MSI not found, skipping rename."

      - name: Package scrubbed source (v315)
        if: ${{ fromJson(inputs.extras || '{}').generate_source == 'true' }}
        shell: bash
        run: |
          # [LnDesk v315] Zip the pre-build snapshot into SignOutput so the
          # upload step below ships it next to the exe/msi. bsdtar (Git Bash)
          # writes a real zip via -a; fall back to tar.gz if that ever fails.
          set -e
          if [ ! -d "./_release_src" ]; then
            echo "[FAIL] v315: ./_release_src missing (snapshot step did not run?)"
            exit 1
          fi
          # [v315-fix] Structure gate: a real snapshot must contain the
          # source roots plus the placeholder README. Catches a wrong
          # packaging target before anything is zipped.
          for d in src libs flutter; do
            test -d "./_release_src/$d" || { echo "[FAIL] v315: snapshot missing $d (wrong content?)"; exit 1; }
          done
          test -f "./_release_src/README-RELEASE-SOURCE.md" || { echo "[FAIL] v315: README-RELEASE-SOURCE.md missing in snapshot"; exit 1; }
          # [v317] custom_.txt must ship whenever the dispatch carried one.
          if [ -n "${{ inputs.custom }}" ]; then
            test -f "./_release_src/rustdesk/custom_.txt" || { echo "[FAIL] v317: custom_.txt missing in snapshot"; exit 1; }
          fi
          # [v315-fix] Binary-leak gate: the upstream git tree tracks zero
          # binaries, so any dll/exe/pdb/lib/exp/zip inside the snapshot is
          # a CI intermediate artifact (e.g. windows-x64-release from the
          # flutter engine swap step, which unpacks into the repo root).
          LEAK="$(find ./_release_src -type f \( -iname '*.pdb' -o -iname '*.dll' -o -iname '*.exe' -o -iname '*.lib' -o -iname '*.exp' -o -iname '*.zip' \) -print 2>/dev/null | head -20 || true)"
          if [ -n "$LEAK" ]; then
            echo "[FAIL] v315: binary artifacts leaked into source snapshot:"
            echo "$LEAK"
            exit 1
          fi
          ZIP="./SignOutput/${BUILD_FILENAME}-source.zip"
          if tar -a -c -f "$ZIP" -C . _release_src 2>/dev/null; then
            echo "[OK] v315: source snapshot packed as $ZIP"
          else
            rm -f "$ZIP"
            ZIP="./SignOutput/${BUILD_FILENAME}-source.tar.gz"
            tar -c -z -f "$ZIP" -C . _release_src
            echo "[OK] v315: source snapshot packed as $ZIP (tar.gz fallback)"
          fi
          # [v315-fix] Size gate: a clean patched tree is ~20-40MB; the
          # 219MB engine pdb alone would blow past this, so anything above
          # 60MB means something leaked in.
          SZ="$(du -m "$ZIP" | cut -f1)"
          if [ "$SZ" -gt 60 ]; then
            echo "[FAIL] v315: source zip is ${SZ}MB (>60MB), likely a leak"
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          ls -lh "$ZIP"

      - name: Create GitHub Release and Upload Assets
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_name.outputs.value }}
          name: Release ${{ steps.build_name.outputs.value }}
          prerelease: true
          files: |
            ./SignOutput/${{ steps.build_name.outputs.value }}-install.exe
      
      - name: Send to file server
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        shell: bash
        run: |
          EXE="./SignOutput/${BUILD_FILENAME}-install.exe"
          MSI="./SignOutput/${BUILD_FILENAME}.msi"
          URL="${{ secrets.GENURL }}/save_custom_client"
          TOKEN="${{ fromJson(inputs.extras).token }}"
          UUID="${{ inputs.uuid }}"
          # [LnDesk v169] Cross-border upload resilience.
          # Healthy link: 9-18s (~2.4MB/s). Degraded: 8-40KB/s and then the
          # connection is reset (curl 55/56) - run 35582468723 died at 30%
          # after 11m48s, while run 35583260254 crawled the same way for 626s
          # and only happened to finish.
          # --retry alone does NOT retry 55/56; --retry-all-errors is required.
          # --retry-delay is deliberately unset so curl keeps its built-in
          # exponential backoff (1s,2s,4s,8s), which suits a congested link
          # better than a fixed delay.
          # --speed-limit is a conservative STALL guard only: the observed
          # "slow" (8-47KB/s) and "dead" (4-15KB/s) ranges overlap, so a more
          # aggressive valve would abort transfers that do finish.
          # -f turns an HTTP error (401/413/500) into a real failure. Without
          # it curl exits 0 and the step silently passes with no file saved.
          # EXE and MSI are attempted independently: under `set -e` the old
          # `&&` chain stopped at the first failure and never tried the MSI.
          CURL_OPTS=(
            -X POST
            -H "Content-Type: multipart/form-data"
            -H "Authorization: Bearer $TOKEN"
            --connect-timeout 30
            --retry 4
            --retry-all-errors
            --max-time 1800
            --speed-limit 1024
            --speed-time 180
          )
          STAT='\n[upload] http=%{http_code} sent=%{size_upload}B in %{time_total}s\n'
          rc_exe=0
          rc_msi=0
          rc_zip=0
          echo "== [1/2] EXE =="
          if curl -f "${CURL_OPTS[@]}" -w "$STAT" \
              -F "file=@$EXE" -F "uuid=$UUID" "$URL"; then
            echo "[OK] EXE uploaded"
          else
            rc_exe=$?
            echo "[FAIL] EXE upload rc=$rc_exe"
          fi
          echo "== [2/2] MSI =="
          if [ ! -f "$MSI" ]; then
            echo "[SKIP] MSI not found, skipping upload."
          elif curl -f "${CURL_OPTS[@]}" -w "$STAT" \
              -F "file=@$MSI" -F "uuid=$UUID" "$URL"; then
            echo "[OK] MSI uploaded"
          else
            rc_msi=$?
            echo "[FAIL] MSI upload rc=$rc_msi"
          fi
          echo "== [3/3] source snapshot (non-fatal) =="
          if [ -z "${SOURCE_ZIP:-}" ] || [ ! -f "${SOURCE_ZIP:-/nonexistent}" ]; then
            echo "[SKIP] source snapshot not generated (checkbox off or snapshot step skipped)"
          elif curl -f "${CURL_OPTS[@]}" -w "$STAT" \
              -F "file=@$SOURCE_ZIP" -F "uuid=$UUID" "$URL"; then
            echo "[OK] source snapshot uploaded"
          else
            rc_zip=$?
            echo "[FAIL] source snapshot upload rc=$rc_zip (non-fatal: binaries stay the primary artifacts)"
          fi
          if [ "$rc_exe" -ne 0 ] || [ "$rc_msi" -ne 0 ]; then
            echo "[FAIL] file server upload failed (EXE rc=$rc_exe, MSI rc=$rc_msi)"
            exit 1
          fi
          echo "[OK] both artifacts uploaded to file server"
           
      - name: Report Status
        continue-on-error: true
        shell: bash
        timeout-minutes: 60
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Success"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      - name: failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: failed
        if: cancelled()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

  # [build-fallback v135] Never leave the builder page polling forever.
  # The terminal "Success" report lives in the last job of this graph, so when an
  # upstream job fails that job is skipped and NOTHING is reported - the waiting
  # page used to spin until the browser was closed. This job depends on the
  # reporting job with `always()` and files a failure only when that job did not
  # succeed (failure / cancelled / skipped).
  notify-final-status:
    name: Notify final status
    needs: [build-for-windows-flutter]
    if: ${{ always() && needs.build-for-windows-flutter.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "Failed" is the canonical terminal string the builder maps to its failure
      # page, so this also works against a builder that predates the v135 fix.
      - name: Report failed status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras || '{}').token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Failed"}' \
            "${{ secrets.GENURL }}/updategh" || echo "Report status ping failed (non-fatal)"
