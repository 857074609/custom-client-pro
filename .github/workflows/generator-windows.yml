      - name: server_otp (v86)
        shell: bash
        run: |
          python3 patches/patch_server_otp.py .
          python3 patches/patch_otp_autoretry.py .
          # [v131] Reconcile the duplicate 'as http' alias. patch_online_devices.py
          # binds '../../utils/http_service.dart' as http and patch_server_otp.py
          # binds 'package:http/http.dart' as http -- one prefix, two libraries, so
          # every http.post() in peer_card.dart is ambiguous and the Dart front end
          # aborts (run #1745: ambiguous_import at peer_card.dart:728 / 1779).
          # The helper is named *_linux_* because Linux hit this first (v127); its
          # logic is platform independent. It drops the package:http import --
          # http_service.dart exposes post/get/put/delete and re-exports Response,
          # so _requestOtp() compiles unchanged. Gate here, not 40 min into the build.
          python3 patches/patch_linux_otp_http_alias.py .
          # [v177] Stop a spurious right-click being sent to the controlled side
          # right after connect in control mode (some platforms report a non-zero
          # buttons mask on the first hover). Edits flutter/lib/models/input_model.dart.
          python3 patches/patch_input_hover_fix.py .
          if grep -q "utils/http_service.dart' as http;" ./flutter/lib/common/widgets/peer_card.dart \
             && grep -q "package:http/http.dart' as http;" ./flutter/lib/common/widgets/peer_card.dart; then
            echo "[FAIL] v131: peer_card.dart still binds two libraries to 'http' (ambiguous)"; exit 1
          fi
          grep -q "http.post(" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v131: no http.post() left in peer_card.dart"; exit 1; }
          grep -q "_requestOtp" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v131: OTP helper (_requestOtp) missing"; exit 1; }
          echo "[OK] v131: single 'as http' alias in peer_card.dart"
          # Gates. patch_server_otp.py skips an edit whose anchor is absent
          # (SKIP-ABSENT) instead of failing, so a drifted anchor silently
          # drops the OTP fix while CI stays green. Assert the pieces that
          # must survive.
          grep -q "looks_like_otp" ./src/server/connection.rs || { echo "[FAIL] controlled-side OTP wait window missing (v113)"; exit 1; }
          grep -q "from_secs(20)" ./src/server/connection.rs || { echo "[FAIL] OTP wait deadline is not 20s (cold-start fix)"; exit 1; }
          # [v117-revert] Device cards connect OTP-first again (no
          # saved-password-first). Assert the OTP helper is present and the
          # removed logic is GONE, otherwise a stale saved password silently
          # wins and the connect feels frozen.
          grep -q "_requestOtp" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v117-revert: OTP helper (_requestOtp) missing in peer_card.dart"; exit 1; }
          # [v118] After the API mints the code, wait kOtpDeliverySettleMs
          # (1000ms) before dialing, so the controlled side's 500ms poll has
          # already picked the code up and the first attempt authenticates.
          # patch_server_otp.py skips an absent anchor silently, so assert both
          # the constant and its value.
          grep -q "kOtpDeliverySettleMs" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v118: OTP delivery settle (kOtpDeliverySettleMs) missing in peer_card.dart"; exit 1; }
          grep -q "kOtpDeliverySettleMs = 3000" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v177: OTP delivery settle is not 3000ms"; exit 1; }
          # [v177] Hover must only move the remote cursor, never synthesize a
          # down/up from a stale button mask. The hover handler used to route
          # through _getMouseEvent (which infers a press from evt.buttons), so
          # assert the marker is present and that exactly ONE _getMouseEvent
          # move call survives (the onPointMoveImage one) -- the hover one must
          # be gone, otherwise a spurious right-click is sent on first hover.
          grep -q "LnDesk v177] Hover must only move the remote cursor" ./flutter/lib/models/input_model.dart || { echo "[FAIL] v177: input hover fix marker missing in input_model.dart"; exit 1; }
          _hover_count=$(grep -c "_getMouseEvent(e, _kMouseEventMove)" ./flutter/lib/models/input_model.dart)
          [ "$_hover_count" = "1" ] || { echo "[FAIL] v177: _getMouseEvent move count is $_hover_count (expect 1: only onPointMoveImage)"; exit 1; }
          grep -n "kOtpDeliverySettleMs" ./flutter/lib/common/widgets/peer_card.dart
          if grep -q "only filled above for SHARED address-book peers" ./flutter/lib/common/widgets/peer_card.dart; then
            echo "[FAIL] v117-revert: saved-password-first must be removed from peer_card.dart"
            exit 1
          fi
          # [v120] OTP auto-retry wiring. The control-side re-dials once on a
          # wrong-password OTP session (cold-start race). Assert the armed/fired
          # helpers are present in model.dart, otherwise the retry silently no-ops.
          grep -q "armOtpRetry" ./flutter/lib/models/model.dart || { echo "[FAIL] v120: armOtpRetry missing in model.dart"; exit 1; }
          grep -q "fireOtpRetry" ./flutter/lib/models/model.dart || { echo "[FAIL] v120: fireOtpRetry missing in model.dart"; exit 1; }
          # [v120] peer_card.dart must import model.dart so the OTP auto-retry
          # helpers (armOtpRetry/fireOtpRetry, defined in model.dart) resolve.
          # Without it, flutter analyze fails with "armOtpRetry isn't defined".
          grep -q "import '../../models/model.dart'" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v120: peer_card.dart must import model.dart (armOtpRetry undefined)"; exit 1; }
          # [v117] The controlled side polls the server-issued OTP on its own
          # interval (TIME_OTP_POLL). No other gate covers it, so a drifted
          # anchor would silently keep the old interval while CI stays green.
          # Assert the constant and echo the real line for searchable proof.
          grep -q "TIME_OTP_POLL" ./src/hbbs_http/sync.rs || { echo "[FAIL] OTP poll constant missing in sync.rs"; exit 1; }
          grep -q "from_millis(500)" ./src/hbbs_http/sync.rs || { echo "[FAIL] OTP poll interval is not 500ms"; exit 1; }
          grep -n "TIME_OTP_POLL" ./src/hbbs_http/sync.rs
