      - name: Patch flutter
        shell: bash
        run: |
          set -u
          if [[ "3.24.5" != "${{ env.FLUTTER_VERSION }}" ]]; then
            echo "flutter version is not 3.24.5, no SDK patch needed"
            exit 0
          fi
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          # The SDK may be restored from the actions cache with this patch
          # already applied, so never apply it blindly twice.
          if git apply --check --reverse flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "flutter SDK already patched (restored from cache), skipping"
          elif git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "flutter SDK patched"
          else
            echo "::error::cannot determine flutter SDK patch state"
            exit 1
          fi

