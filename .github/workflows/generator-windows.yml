        run: |
          # [v227c] 默认安装目录 C:\Program Files\<app> 改为
          # C:\Users\<用户名>\AppData\Roaming\<app>（单点：get_default_install_path，
          # 注册表/托盘/防火墙/安装页默认显示全部派生）。仅影响全新安装：
          # 已部署机器走注册表 InstallLocation，升级原地不动。APPDATA 缺失时
          # 回退上游 Program Files 逻辑。
          python3 patches/patch_install_path.py .
          grep -qF "[LnDesk v227c appdata-install]" src/platform/windows.rs || { echo "[FAIL] v227c: appdata install path marker missing"; exit 1; }
          grep -q 'std::env::var("APPDATA")' src/platform/windows.rs || { echo "[FAIL] v227c: APPDATA lookup missing"; exit 1; }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}



      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Cache the Flutter SDK itself (~1GB download+unzip) keyed by version.
          cache: true

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          set -u
          if [[ "3.24.5" != "${{ env.FLUTTER_VERSION }}" ]]; then
            echo "flutter version is not 3.24.5, no SDK patch needed"
            exit 0
          fi
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          # The SDK may be restored from the actions cache with this patch
          # already applied, so never apply it blindly twice.
          if git apply --check --reverse flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "flutter SDK already patched (restored from cache), skipping"
          elif git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "flutter SDK patched"
          else
            echo "::error::cannot determine flutter SDK patch state"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"


      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}
          # [v232-perf] 默认 false：构建失败的运行不保存缓存 -> 依赖变化后
          # 若紧跟一次失败构建，下一次（即使代码已修好）仍要全量重编
          # （实测 #2009 失败未存缓存，#2010 又冷启动 33m50s）。
          # 打开后失败运行的缓存也会续命，避免连续双倍冷启动。
          cache-on-failure: true
       
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
          
      - name: magick stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: pwsh
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        run: |
          $url = "${env:GENURL}/png/${env:UUID}/icon.png"
          Write-Host "Downloading icon from: $url"
          Invoke-WebRequest -Uri $url -OutFile ./res/icon.png -ErrorAction Stop
          
          magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
          Copy-Item ./res/icon.ico ./res/tray-icon.ico
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          magick ./res/128x128.png -resize 200% ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png missing after magick step"
            exit 1
          fi
          b64=$(base64 -w0 ./res/icon.png)
          perl -i.bak -pe '
            BEGIN { $b64 = shift @ARGV }
            s/iVBORw0KGgo[A-Za-z0-9+\/=]{100,}/$b64/g;
          ' "$b64" ./src/ui.rs

# === 用户附加功能（Custom Enhancements）===
      
      - name: fix connection delay  
        if: ${{ fromJson(inputs.extras).delayFix == 'true' }}
        shell: bash
        run: |
          python3 patches/patch_delay_fix.py .
          grep -qF '// [LnDesk v162] delayFix' ./src/client.rs || { echo "[FAIL] delayFix patch not applied"; exit 1; }


      
      - name: Apply hide-ID and QR tip patch (v139)
        if: fromJson(inputs.extras).hideIdDisplay == 'true' && env.UI_VARIANT == 'incoming_custom'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
