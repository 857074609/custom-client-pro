          echo "// [LnDesk v150] brand name injected from the workflow input." > flutter/lib/common/brand.dart
          echo "const kBrandAppName = '$APPNAME';" >> flutter/lib/common/brand.dart
          # v150: the tray process owns the last-resort invitation poll and
          # wakes the connection manager; the main window must hide instead
          # of destroying its engine. Assert what must survive - a silent
          # skip leaves invitations dead while CI stays green.
          grep -q "pub mod invite_watch" ./src/lib.rs || { echo "[FAIL] v150: invite_watch module not declared"; exit 1; }
          test $(grep -c "start_invite_watch_blocking" ./src/tray.rs) -eq 2 || { echo "[FAIL] v150: tray watcher call sites != 2"; exit 1; }
          grep -q "get_option_from_file" ./src/invite_watch.rs || { echo "[FAIL] v150: fresh token read missing"; exit 1; }
          grep -q "/api/invitation/incoming" ./src/invite_watch.rs || { echo "[FAIL] v150: incoming poll missing"; exit 1; }
          grep -q "windowManager.hide()" ./flutter/lib/desktop/pages/server_page.dart || { echo "[FAIL] v150: main window must hide on close"; exit 1; }
          test $(grep -c "gFFI.close()" ./flutter/lib/desktop/pages/server_page.dart) -eq 1 || { echo "[FAIL] v150: engine teardown must remain macOS-only"; exit 1; }
          grep -q "_runWithInviteDialogWidth" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: invite dialog window widen helper missing"; exit 1; }
          grep -q "inviteDialogWindowLocked" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: invite dialog window lock missing"; exit 1; }
