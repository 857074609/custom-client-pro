      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}
          # [v232-perf] 默认 false：构建失败的运行不保存缓存 -> 依赖变化后
          # 若紧跟一次失败构建，下一次（即使代码已修好）仍要全量重编
          # （实测 #2009 失败未存缓存，#2010 又冷启动 33m50s）。
          # 打开后失败运行的缓存也会续命，避免连续双倍冷启动。
          cache-on-failure: true
       
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
          
      - name: magick stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: pwsh
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        run: |
          $url = "${env:GENURL}/png/${env:UUID}/icon.png"
          Write-Host "Downloading icon from: $url"
          Invoke-WebRequest -Uri $url -OutFile ./res/icon.png -ErrorAction Stop
          
          magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
          Copy-Item ./res/icon.ico ./res/tray-icon.ico
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          magick ./res/128x128.png -resize 200% ./res/128x128@2x.png


      - name: ui.rs icon
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png missing after magick step"
            exit 1
          fi
          b64=$(base64 -w0 ./res/icon.png)
          perl -i.bak -pe '
            BEGIN { $b64 = shift @ARGV }
            s/iVBORw0KGgo[A-Za-z0-9+\/=]{100,}/$b64/g;
          ' "$b64" ./src/ui.rs

