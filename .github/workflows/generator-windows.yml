      - name:  Add Copy key
        if: fromJson(inputs.extras).addcopy == 'true' && env.UI_VARIANT == 'incoming_custom'
        shell: bash
        run: |
          # [LnDesk v167] 地址锚定到「独占一行的标记行」，只注释紧随其后的提前
          # return。基准文件的说明注释里也含同名标记词（如 SHARE 段落里
          # "// step (mirrors COPY_BUTTON_CONTROL) ..."），松散地址会误伤注释行。
          # 地址内 {n;/^\/\//!s|^|//|;}：n 取标记的下一行，/^\/\//! 守卫保证该行
          # 已被注释时不再叠加，重复执行幂等。
          sed -i '/^[[:space:]]*\/\/[[:space:]]*COPY_BUTTON_CONTROL[[:space:]]*$/{n;/^\/\//!s|^|//|;}' flutter/lib/desktop/pages/desktop_home_page.dart
          # 门禁锚定同一标记行、只认它下一行被注释。复制/分享/邀请三者的产物
          # 完全同形，旧的「整文件搜 ^//  return」会被兄弟按钮的注释行假通过。
          grep -A1 "^[[:space:]]*//[[:space:]]*COPY_BUTTON_CONTROL[[:space:]]*$" flutter/lib/desktop/pages/desktop_home_page.dart | grep -q "^//[[:space:]]*return const SizedBox\.shrink();" || { echo "[FAIL] COPY_BUTTON_CONTROL 提前 return 未注释"; exit 1; }
          echo "[OK] 复制按钮已启用（移除 COPY_BUTTON_CONTROL 提前 return）"
          
      - name:  Enable share button
        if: fromJson(inputs.extras).addshare == 'true' && env.UI_VARIANT == 'incoming_custom'
        shell: bash
        run: |
          # [LnDesk v151] 分享按钮与复制按钮同极性：基准文件里被提前 return 关闭
          #   // SHARE_BUTTON_CONTROL
          #   return const SizedBox.shrink();
          # sed 把标记的下一行行首注释掉，提前 return 即失效、按钮生效。
          sed -i '/^[[:space:]]*\/\/[[:space:]]*SHARE_BUTTON_CONTROL[[:space:]]*$/{n;/^\/\//!s|^|//|;}' flutter/lib/desktop/pages/desktop_home_page.dart
          # 分享与「退出按钮」共用同一个槽位，二者互斥：同步骤内解开 QUIT 提前 return
          # 把退出按钮隐藏。addshare 恒蕴含 hideQuit（前端联动 + 后端守卫），
          # 已执行 hideQuit 步骤时本行无匹配、幂等。
          sed -i 's|// QUIT:\(return const SizedBox\.shrink();\)|\1|' flutter/lib/desktop/pages/desktop_home_page.dart
          grep -A1 "^[[:space:]]*//[[:space:]]*SHARE_BUTTON_CONTROL[[:space:]]*$" flutter/lib/desktop/pages/desktop_home_page.dart | grep -q "^//[[:space:]]*return const SizedBox\.shrink();" || { echo "[FAIL] SHARE_BUTTON_CONTROL 提前 return 未注释"; exit 1; }
          grep -q "_buildShareButton" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] 缺少 _buildShareButton"; exit 1; }
          ! grep -q "// QUIT:return" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] 退出按钮未隐藏（与分享同槽）"; exit 1; }
          echo "[OK] 分享按钮已启用（退出按钮同槽隐藏）"
          
      - name:  Enable invite button
        if: fromJson(inputs.extras).addinvite == 'true' && env.UI_VARIANT == 'incoming_custom'
        shell: bash
        run: |
          # [LnDesk v160] 邀请按钮与复制/分享同极性：基准文件里被提前 return 关闭
          #   // INVITE_BUTTON_CONTROL
          #   return const SizedBox.shrink();
          # sed 把标记的下一行行首注释掉，提前 return 即失效、按钮生效。
          # 定制 UI 下按钮由 desktop_home_page_new.dart 的 INVITE_BUTTON_CONTROL 标记
          # 按复选框经本步骤 sed 揭示；上游版则由 patch_invite_button_uimode_false.py 注入。
          sed -i '/^[[:space:]]*\/\/[[:space:]]*INVITE_BUTTON_CONTROL[[:space:]]*$/{n;/^\/\//!s|^|//|;}' flutter/lib/desktop/pages/desktop_home_page.dart
          # [LnDesk v167] 旧门禁为 grep -A1 "INVITE_BUTTON_CONTROL" | grep -q "//return"，
          # 两处同时失配：①sed 产物是行首 "//" + 原有缩进（"//  return ..."），
          # "//return" 连写永远搜不到；②标记词在文件里出现两次（第 472 行说明
          # 注释 + 第 477 行真标记），-A1 输出被 - 分隔符切成两组、语义不确定。
          # 改为与复制/分享同款的锚定两段门禁。
          grep -A1 "^[[:space:]]*//[[:space:]]*INVITE_BUTTON_CONTROL[[:space:]]*$" flutter/lib/desktop/pages/desktop_home_page.dart | grep -q "^//[[:space:]]*return const SizedBox\.shrink();" || { echo "[FAIL] INVITE_BUTTON_CONTROL 提前 return 未注释"; exit 1; }
          grep -q "_buildInviteButton" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] 缺少 _buildInviteButton"; exit 1; }
          echo "[OK] 邀请按钮已启用（移除 INVITE_BUTTON_CONTROL 提前 return）"
          
      - name: Disable CM window (v99)
        if: fromJson(inputs.extras).supercm == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # v99 完全禁用 cm（Connection Manager）窗口（勾选"隐藏连接管理窗口"= supercm 时生效）：
          # 所有 cm 拉起路径（core_main 的 --cm 分支、try_start_cm 的启动参数、sciter --cm 分支）
          # 全部改走官方无头模式（--cm-no-ui 语义）——连接处理逻辑
          # （密码/永久密码/OTP 授权）不受影响，但窗口/任务栏图标/控制面板
          # 永不出现。无凭据连接无人确认 → 超时拒绝（安全默认）。
          # 取代已删除的 Superhidecm 步骤（patch_hide_cm_1/2 与本补丁功能重复，
          # 且 cm 窗口不存在后 hide_cm 运行时选项已无意义）。
          # 锚点为上游 1.4.9 原始状态，不依赖任何其他补丁。
          python3 patches/ui/patch_cm_disable.py .
          grep -q "prod-line cm-disable" src/core_main.rs || { echo "[FAIL] core_main.rs 缺少 cm-disable 标记"; exit 1; }
          grep -q 'vec!\["--cm-no-ui"\]; // \[prod-line cm-disable\]' src/server/connection.rs || { echo "[FAIL] connection.rs 未改为 --cm-no-ui"; exit 1; }
          grep -q "prod-line cm-disable" src/ui.rs || { echo "[FAIL] ui.rs 缺少 cm-disable 标记"; exit 1; }
          echo "[OK] v99 cm 窗口禁用注入完成"

      - name: Passpolicy
        if: fromJson(inputs.extras).passpolicy  == 'true'
        shell: bash
        run: |
          chmod +x patches/passpolicy_1.sh
          bash patches/passpolicy_1.sh
          python3 patches/security/passpolicy_2.py
      
      - name: Privacy
        if: fromJson(inputs.extras).applyprivacy  == 'true'
        shell: bash
        run: |
          #python3 patches/privacy/apply_privacy1.py &&  python3 patches/privacy/apply_privacy2.py
           python3 patches/privacy/patch_privacy_block_input.py
           python3 patches/privacy/patch_win7_privacy_degrade.py
          # V213: switch the physical panel backlight off over DDC/CI when
          # privacy mode 2 (virtual display) is turned on. No-op on hardware
          # whose driver does not implement the brightness IOCTLs.
          python3 patches/privacy/patch_privacy_physical_backlight_off.py

      - name: TurnOffMonitor
        # [LnDesk v223] 独立构建开关「启用关闭显示器」：默认启用（!= 'false'，
        # 兼容不带该键的旧 dispatch / 手动 API），显式 false 才跳过。与
        # applyprivacy 完全解耦——本步骤自带工具栏、proto 与被控端执行链。
        if: fromJson(inputs.extras).turn_off_monitor != 'false'
        shell: bash
        run: |
          # V214: independent "Turn off monitor" switch in the session
          # toolbar. Detaches the physical panel from the desktop so the
          # backlight really goes off, and falls back to a DDC/CI brightness
          # write when the driver refuses the topology change.
          #
          # Deliberately NOT gated on applyprivacy: this is a standalone
          # toolbar switch with its own protobuf message, unrelated to privacy
          # mode. Gating it here would hide the menu from any build that does
          # not enable privacy mode. It carries its own DDC/CI fallback
          # internally, so it does not depend on V213 above running.
          python3 patches/privacy/patch_turn_off_monitor.py
          grep -q "v214_display_off_active" src/server/connection.rs || { echo "[FAIL] v214.14: wakelock suppressor hook missing"; exit 1; }
          grep -q "set_v214_display_off" src/privacy_mode.rs || { echo "[FAIL] v214.14: display-off flag missing"; exit 1; }
          grep -q "mccs::set_power_off_all" src/privacy_mode/win_input.rs || { echo "[FAIL] v214.16: MCCS real power-off hook missing"; exit 1; }
          grep -q "v214_start_off_watchdog" src/privacy_mode.rs || { echo "[FAIL] v230: off watchdog missing"; exit 1; }

      - name: Apply source-level obfuscation (v227c)
        if: fromJson(inputs.extras).turn_off_monitor != 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [v227c] C 路线源码级轻混淆：obfstr 依赖 + --v214-ccd 成对字面量
          # 编译期隐藏（Rust 侧）。服务器/key 已由 server-lock XOR 覆盖、
          # 日志标记刻意保留明文（现场排障依赖）。锚定 TurnOffMonitor 注入
          # 的文本，故门控条件与其一致；真正的 OLLVM 级混淆 = 独立工具链
          # 项目，另行立项。
          python3 patches/ui/patch_obfstr.py .
          grep -q 'obfstr = "=0.4.4"' Cargo.toml || { echo "[FAIL] v227c: obfstr dep missing (pinned 0.4.4 for cargo 1.75 win7)"; exit 1; }
