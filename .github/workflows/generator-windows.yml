      - name: Inject LAN IP direct access board
        if: fromJson(inputs.extras).ip_direct_board == 'true' && (env.UI_VARIANT != 'upstream' || env.CLIENT_TYPE == 'incoming')
        shell: bash
        env:
          # Windows runner 默认 cp1252，中文 print 会 UnicodeEncodeError；
          # 强制 UTF-8（脚本内也已 reconfigure，双保险）。
          PYTHONIOENCODING: utf-8
        run: |
          # 内网 IP 直连看板（左面板「临时密码」下方显示 本机内网IP:直连端口 + 状态灯 + 复制按钮）：
          # patch_direct_access.py 对上游 1.4.9 源码做锚点注入（新增 src/direct_access.rs，
          # 增强 rendezvous_mediator::direct_server 状态写入、flutter_ffi::main_check_connect_status
          # 强制启用 direct-server + LAN IP 发现、desktop_home_page 内网看板 + 双语 key）。
          # 任一锚点缺失/歧义即报错退出，构建显式失败。
          # 是否运行完全取决于是否勾选「内网 IP 直连看板」(ip_direct_board)，与 direction 无关。
          # 当 direction=both 且同时勾选本项时：desktop_home_page 此时已是 desktop_home_page_both.dart，
          # 脚本检测到 // UI_MODE_BOTH 标记后仅跑 Rust 侧（写入 lan-ip / lan-ipv6 / direct-access-port
          # 选项供上部本机信息卡片读取），并自动跳过 Dart 侧注入（避免重复 buildDirectAccessBoard）。
          python3 patches/patch_direct_access.py . "${{ inputs.ui_mode }}"
          # 不依赖 env.CLIENT_TYPE（其尚未设置），直接检测当前 desktop_home_page.dart 是否为
          # desktop_home_page_both.dart 变体（顶部含 // UI_MODE_BOTH 标记）。both 变体已在本机
          # 信息卡片自渲染网络信息，无需再注入 buildDirectAccessBoard。
          if grep -q "// UI_MODE_BOTH" flutter/lib/desktop/pages/desktop_home_page.dart; then
            echo "[OK] desktop_home_page_both.dart: 跳过 buildDirectAccessBoard 校验（网络信息已在上部本机信息卡片自渲染）"
          else
            grep -q "buildDirectAccessBoard" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart 缺少 buildDirectAccessBoard"; exit 1; }
          fi
          echo "[OK] 内网 IP 直连注入完成"

      - name: Report local IPv6 to API server (v70)
        if: fromJson(inputs.extras).ip_direct_board == 'true' || fromJson(inputs.extras).ip_direct_udp == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # v70: 把本机 lan-ipv6 上报到 API 服务器心跳，供设备菜单"IPv6 直连"使用。
          # 必须在 patch_direct_access.py 之后运行（它写入 lan-ipv6 选项）。
          python3 patches/patch_ipv6_heartbeat.py .
          grep -q 'v\["ipv6"\]' src/hbbs_http/sync.rs || { echo "[FAIL] sync.rs 缺少 ipv6 心跳上报"; exit 1; }

      - name: Inject direct connection E2EE (IPv4/IPv6)
        if: fromJson(inputs.extras).ip_direct_board == 'true' || fromJson(inputs.extras).ip_direct_e2ee == 'true'
        shell: bash
        env:
          # Windows runner 默认 cp1252，脚本内中文 print 会 UnicodeEncodeError；
          # 强制 UTF-8（脚本内已 reconfigure，双保险）。
          PYTHONIOENCODING: utf-8
        run: |
          # IP 直连端到端加密：服务端 direct_server 改以 secure=true 接受（复用上游
          # create_tcp_connection 的 SignedId+PublicKey+set_key 握手）；客户端新增
          # secure_direct_connection 并在 is_ip_str（含 IPv6）/is_domain_port_str
          # 直连分支调用。失败即断开，不回退明文。
          python3 patches/patch_direct_e2ee.py .
          grep -q "async fn secure_direct_connection" src/client.rs || { echo "[FAIL] client.rs 缺少 secure_direct_connection"; exit 1; }
          grep -q "direct-e2ee: send long-term pk" src/rendezvous_mediator.rs || { echo "[FAIL] rendezvous_mediator.rs 缺少 direct-e2ee 标记 (send_long_term_pk)"; exit 1; }
          grep -q "send_long_term_pk" src/server.rs || { echo "[FAIL] server.rs 缺少 direct-e2ee 标记 (send_long_term_pk)"; exit 1; }

      - name: Patch direct access UDP transport
        if: fromJson(inputs.extras).ip_direct_udp == 'true'
        shell: bash
        run: |
          # IP 直连 UDP(KCP) 传输：主控端 UDP 优先（2s 超时自动回退 TCP）；
          # 被控端 direct_server 同端口 UDP 监听（KcpStream::accept -> create_tcp_connection 同一入口）。
          python3 patches/patch_direct_udp.py .
          grep -q "fn direct_udp_server" src/rendezvous_mediator.rs || { echo "[FAIL] rendezvous_mediator.rs 缺少 direct_udp_server"; exit 1; }
          grep -q "via UDP(KCP)" src/client.rs || { echo "[FAIL] client.rs 缺少 direct udp 分支"; exit 1; }

