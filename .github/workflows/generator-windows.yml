name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: string
      serverinfo:
        description: 'serverinfo'
        required: true
        type: string
      custom:
        description: "Custom JSON"
        required: true
        default: ''
        type: string
      uuid:
        description: "uuid of request"
        required: true
        default: ''
        type: string
      ui_mode:
        description: "Custom User Interface"
        required: false
        type: string
      iconlink:
        description: "icon link"
        required: false
        default: 'false'
        type: string
      logolink:
        description: "logo link"
        required: false
        default: 'false'
        type: string
      appname:
        description: "app name"
        required: true
        default: 'rustdesk'
        type: string
      filename:
        description: "Filename"
        required: true
        default: 'rustdesk'
        type: string
      extras:
        description: "extra inputs in json"
        required: true
        default: '{}'
        type: string


env:
  SCITER_RUST_VERSION: "1.78.0" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # 对齐官方 1.4.9 Windows Flutter 构建（官方 Windows 用 1.75；1.78 的 std/codegen 在 Win7 上更易触发 0xc0000005）
  MAC_RUST_VERSION: "1.81.0" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ fromJson(inputs.extras || '{}').version || 'master' }}"
  RUSTDESK_BUILD_NUMBER: "${{ fromJson(inputs.extras || '{}').build_number || '0' }}"
  NDK_VERSION: "r27c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"
  GENURL: ${{ secrets.GENURL }}
  WS_PORT: "${{ fromJson(inputs.extras || '{}').ws_port || '' }}" 
  


jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    secrets: inherit
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10




  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
     
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set gdpro value
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> "$GITHUB_ENV"


      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ (env.VERSION != 'master' && env.VERSION != 'main') && format('refs/tags/{0}', env.VERSION) || env.VERSION }}
          submodules: recursive
          fetch-depth: 1
      

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout patches scripts
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          path: patches 
          token: ${{ secrets.REPO }}
          ref: main
      
      - name: Report Status
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "环境准备就绪，开始卖力工作"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      
      - name: Decrypt and mask secrets
        id: decrypt
        shell: bash
        env:
          SERVERINFO: ${{ github.event.inputs.serverinfo }}
          BUILD_SECRET_KEY: ${{ secrets.BUILD_SECRET_KEY }}
          EXTRAS_JSON: ${{ inputs.extras }}
        run: |
          set +x
          SI="${{ github.event.inputs.serverinfo }}"
          if [ -z "$SI" ] || [ "$SI" = "placeholder" ]; then
            echo "::warning::serverinfo empty/placeholder -> no custom server from serverinfo"
          else
            pip install cryptography
          fi
          python -c "
          import os, json, sys
          try:
              from cryptography.fernet import Fernet
          except Exception:
              Fernet = None
          data = {}
          SI = os.environ.get('SERVERINFO','')
          if SI and SI != 'placeholder' and Fernet is not None:
              try:
                  key = os.environ['BUILD_SECRET_KEY'].encode()
                  data = json.loads(Fernet(key).decrypt(SI.encode()).decode())
              except Exception as e:
                  print('::warning::serverinfo decrypt failed ('+str(e)+') -> ignoring')
          # extras fallback (non-secret; never overrides real serverinfo values)
          ex_raw = os.environ.get('EXTRAS_JSON','')
          if ex_raw:
              try:
                  ex = json.loads(ex_raw)
                  for k in ('updateLink','downloadLink'):
                      if ex.get(k) and not data.get(k):
                          data[k] = ex[k]
              except Exception:
                  pass
          for field in ['server','RS_PUB_KEY','apiServer','permanentPassword','unlockPin','urlLink','downloadLink','updateLink']:
              v = data.get(field)
              if v: print('::add-mask::' + v)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write(f\"CUSTOM_SERVER={data.get('server','')}\n\")
              e.write(f\"CUSTOM_KEY={data.get('RS_PUB_KEY','')}\n\")
              e.write(f\"CUSTOM_APISERVER={data.get('apiServer','')}\n\")
              e.write(f\"PERMANENT_PASSWORD={data.get('permanentPassword','')}\n\")
              e.write(f\"UNLOCK_PIN={data.get('unlockPin','')}\n\")
              e.write(f\"URL_LINK={data.get('urlLink','')}\n\")
              e.write(f\"DOWNLOAD_LINK={data.get('downloadLink','')}\n\")
              e.write(f\"UPDATE_LINK={data.get('updateLink','')}\n\")
          "

      - name: Display last
        shell: bash
        run: |
          echo "CUSTOM_SERVER suffix:  ${CUSTOM_SERVER: -5}"
          echo "CUSTOM_KEY suffix:  ${CUSTOM_KEY: -5}"
          echo "CUSTOM_APISERVER suffix:  ${CUSTOM_APISERVER: -5}"
          echo "UNLOCK_PIN suffix:  ${UNLOCK_PIN: -1}"
          echo "PERMANENT_PASSWORD suffix:  ${PERMANENT_PASSWORD: -2}"
      
      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      
      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: Replace custom patch files 
        if: inputs.ui_mode == 'true'
        shell: bash
        run: |
          mkdir -p src/lang/
          mkdir -p flutter/lib/desktop/pages/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs
       
         
          VER="${{ env.VERSION }}"
          echo "Building version: $VER"
          version_ge() {
            printf '%s\n%s\n' "$2" "$1" | sort -V -C
          }

          if version_ge "$VER" "1.4.7"; then
            echo ">>> Version $VER >= 1.4.7, using new patch"
            cp -f patches/desktop_home_page_new.dart flutter/lib/desktop/pages/desktop_home_page.dart
          else
            echo ">>> Version $VER < 1.4.7, using old patch"
            cp -f patches/desktop_home_page_old.dart flutter/lib/desktop/pages/desktop_home_page.dart
          fi


          python3 patches/hand_stun.py

      - name: skip custom client
        shell: bash
        run: |
          sed -i '/if (bind\.isCustomClient())/d' flutter/lib/desktop/pages/desktop_home_page.dart
    

      - name: enable websocket
        if: ${{ fromJson(inputs.extras).allow-websocket == 'true' }}
        shell: bash
        run: |
           python3 patches/patch_websocket_custom_port.py

      - name: disable_e2ee
        shell: bash
        run: |
           python3 patches/patch_common_client_disable_e2ee.py

      - name: change appname to custom
        if: inputs.appname != 'rustdesk'
        env:
          APP_NAME: ${{ inputs.appname }}
          FILE_NAME: ${{ inputs.filename }}
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|ProductName = \"RustDesk\"|ProductName = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"${APP_NAME}.exe\"|" ./Cargo.toml

          # ./libs/portable/Cargo.toml
          sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|ProductName = \"RustDesk\"|ProductName = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"${APP_NAME}.exe\"|" ./libs/portable/Cargo.toml

          # ./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"RustDesk Remote Desktop\"|\"${APP_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|VALUE \"InternalName\", \"rustdesk\" \"\\\\0\"|VALUE \"InternalName\", \"${APP_NAME}\" \"\\\\0\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"rustdesk.exe\"|\"${FILE_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"RustDesk\"|\"${APP_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e '/pub static ref APP_NAME/s/"RustDesk"/"'"${APP_NAME}"'"/' ./libs/hbb_common/src/config.rs

          # ./src/lang/en.rs
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ inputs.appname }}|' {} \;
          sed -i -e 's|RustDesk|${{ inputs.appname }}|' ./res/msi/Package/License.rtf
          

      - name: fix registry if appname has a space
        if: contains(inputs.appname, ' ')
        shell: bash
        run: |
          #./src/platform/windows.rs
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          
      - name: change company name
        if: fromJson(inputs.extras).compname != 'Purslane Ltd'
        shell: bash
        run: |
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|"Copyright © 2025 Purslane Ltd. All rights reserved."|"Copyright © 2025 ${{ fromJson(inputs.extras).compname }}. All rights reserved."|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/Package/License.rtf
     
      - name: change url to custom
        if: env.URL_LINK != 'https://rustdesk.com' 
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.URL_LINK }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.URL_LINK }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.URL_LINK }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.URL_LINK }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.URL_LINK }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.URL_LINK }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.URL_LINK }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|rustdesk.com|${{ env.URL_LINK }}|" ./res/msi/Package/License.rtf
      
      - name: change download link to custom
        if: env.DOWNLOAD_LINK != 'https://rustdesk.com/download'
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./src/ui/index.tis
          
      - name: change update link to custom
        if: env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest'
        shell: bash
        run: |
          sed -i -e 's|https://api.rustdesk.com/version/latest|${{ env.UPDATE_LINK }}|' ./libs/hbb_common/src/lib.rs     

      - name: change about text
        if: ${{ fromJson(inputs.extras).Slogan_tip != '' }}
        env:
          SLOGAN: ${{ fromJson(inputs.extras).Slogan_tip }}
        shell: bash
        run: |
          ESCAPED=$(printf '%s' "$SLOGAN" | sed "s/'/'\\\\''/g; s/[&/\]/\\&/g")
          sed -i "s|translate('Slogan_tip')|'${ESCAPED}'|g" flutter/lib/desktop/pages/desktop_setting_page.dart

      
      - name: Apply patches for custom update
        if:  env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download'
        run: |
          python3 patches/enable_custom_client_update.py
          python3 patches/disabled_custom_client.py
          python3 patches/patch_handle_update_url_1.py
          python3 patches/patch_redirect_update_url.py
          python3 patches/patch_accept_invalid_cert.py
          python3 patches/patch_filename_based_update.py
          python3 patches/patch_handle_update_url_2.py
          python3 patches/patch_custom_client_update_check.py
          python3 patches/patch_enable_auto_update.py
          python3 patches/fix_update_tip.py

      - name: Apply patch for auto silent update
        if: ${{ (env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download') }}
        run: |
          python3 patches/patch_auto_silent_update.py

      - name: Apply patches for fix__updateWindowSize
        if: ${{(env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download') && inputs.ui_mode == 'false' }}
        run: |
          python3 patches/fix__updateWindowSize.py
      
      
      #- name: custom Security Alert fontSize
      #  
       # shell: bash
       # run: |
        #  sed -i 's/^\([[:space:]]*\)color: Colors\.yellow,/\1\/\/ color: Colors.yellow,/' ./flutter/lib/common.dart
         # sed -i '/style: TextStyle(color: Colors\.red),/a\    textAlign: TextAlign.center,'  ./flutter/lib/common.dart
          #sed -i 's/\(style: TextStyle(color: Colors\.red\)\([),]\)/\1, fontSize: 18\2/g' ./flutter/lib/common.dart
          #sed -i '/if (bind\.mainGetBuildinOption(key: kOptionRemovePresetPasswordWarning) !=/,/^  }$/d' ./flutter/lib/common.dart
        #  sed -i '/fontSize:/ { N; s/18,/16,/; }' ./flutter/lib/common.dart
            
      - name: Set server
        shell: bash
        run: |
          python3 patches/set_server.py

      - name: Apply permanent password patch
        shell: bash
        run: |
          VER="${{ env.VERSION }}"

          version_ge() {
            printf '%s\n%s\n' "$2" "$1" | sort -V -C
          }

          if version_ge "$VER" "1.4.7"; then
            echo ">>> Version $VER >= 1.4.7, using new password patch"
            python3 patches/patch_permanent_password_new.py
          else
            echo ">>> Version $VER < 1.4.7, using old password patch"
            python3 patches/patch_permanent_password_old.py
          fi

      - name: Apply unlock PIN patch
        shell: bash
        run: |
          python3 patches/patch_unlock_pin.py
                      
      - name: allow custom_.txt
        run: |
          python3 patches/allowCustom.py
          git apply patches/removeSetupServerTip.diff
          python3 patches/patch_inject_build_number.py

      - name: Apply silent-install & cert patches (#0011)
        shell: bash
        run: |
          python3 patches/patch_silent_install.py .
          python3 patches/patch_install_cert.py .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}



      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"


      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}
       
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
          
      - name: Install vcpkg dependencies
        env:
