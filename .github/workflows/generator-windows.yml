      - name: iroh P2P transport suite (v88 transport + v215 prewarm + v88 heartbeat + v88 menu)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          # [V218] 合并 enable_iroh_direct 控制的 4 个 iroh 步骤。
          # 四者条件完全相同、均为 bash run、各改各文件互不依赖；
          # 夹在其间的 v116 quality 步骤与 iroh 无任何关联，保持原位不动。
          #
          # 执行顺序保持原样：transport -> prewarm -> heartbeat -> menu。
          #
          # auto iroh (v149) 故意不并入本步：patch_auto_iroh.py 的注入锚点是
          # patch_family_match_setting.py 写下的
          #   // [prod-line v100 family-match-ui] default-on IPv6 DNS probe toggle
          # 锚点缺失时 apply_one 直接失败，故它必须排在那一步之后。
          python3 patches/iroh/iroh_transport.py .
          grep -q "pub struct IrohEndpoint" ./src/iroh_transport.rs || { echo "[FAIL] iroh_transport.rs missing"; exit 1; }
          grep -q "iroh_public_key_for_ui" ./src/flutter_ffi.rs || { echo "[FAIL] flutter_ffi.rs missing iroh node id bridge (IP Direct panel would show no iroh row)"; exit 1; }
          grep -q 'iroh = "0.35"' ./Cargo.toml || { echo "[FAIL] Cargo.toml missing iroh dep"; exit 1; }
          grep -q "relay map: self-hosted only" ./src/iroh_transport.rs || { echo "[FAIL] iroh relay map not self-hosted-only"; exit 1; }
          ! grep -q "default_relay_map" ./src/iroh_transport.rs || { echo "[FAIL] n0 relay merge still present"; exit 1; }
          grep -q "self-hosted pkarr publish+resolve" ./src/iroh_transport.rs || { echo "[FAIL] iroh self-hosted pkarr discovery missing"; exit 1; }
          grep -q "PkarrResolver::new" ./src/iroh_transport.rs || { echo "[FAIL] iroh pkarr resolver missing"; exit 1; }
          grep -q "CLOSE_REASON_SEND_TIMEOUT_MS" ./src/client/io_loop.rs || { echo "[FAIL] v117 bounded close-reason send missing in io_loop.rs"; exit 1; }
          grep -q "close reason send timed out" ./src/client/io_loop.rs || { echo "[FAIL] v117 close-reason send is not bounded"; exit 1; }
          # [v117 bug1] An ESTABLISHED iroh session must break out of its read loop
          # immediately on cancel. A race branch (Notify) wakes io_loop.rs, and the
          # Notify lives in iroh_transport.rs; assert both landed.
          grep -q "iroh_cancel_notified_async" ./src/client/io_loop.rs || { echo "[FAIL] v117 iroh cancel race branch missing in io_loop.rs"; exit 1; }
          # [v118] iroh cancel state is now PER-SESSION (keyed by peer id) so closing
          # one session never freezes another. Assert the map landed and the old global is gone.
          grep -q "IROH_CANCELS" ./src/iroh_transport.rs || { echo "[FAIL] v118 iroh cancel must be per-session (IROH_CANCELS map missing)"; exit 1; }
          ! grep -q "static IROH_CANCEL_NOTIFY:" ./src/iroh_transport.rs || { echo "[FAIL] old global IROH_CANCEL_NOTIFY must be gone (per-session regression)"; exit 1; }
          ! grep -q "DnsDiscovery::new" ./src/iroh_transport.rs || { echo "[FAIL] stale DnsDiscovery still present"; exit 1; }
          grep -qF 'iroh-quinn = { git = "https://github.com/857074609/iroh-quinn"' ./Cargo.toml || { echo "[FAIL] iroh-quinn [patch] source missing"; exit 1; }
          ! grep -q "__IROH_N0_FALLBACK__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_N0_FALLBACK placeholder not substituted"; exit 1; }
          test $(grep -c "discovery_n0" ./src/iroh_transport.rs) -eq 2 || { echo "[FAIL] discovery_n0 count != 2 (compat+default; n0 fallback now uses PkarrDirectPreservingPublisher)"; exit 1; }
          grep -q "use_n0_fallback" ./src/iroh_transport.rs || { echo "[FAIL] v115 n0 fallback logic missing"; exit 1; }
          grep -q "PkarrResolver::n0_dns()" ./src/iroh_transport.rs || { echo "[FAIL] v115 n0 HTTPS resolve leg missing"; exit 1; }
          ! grep -q "__IROH_DNS_URL__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_DNS_URL placeholder not substituted"; exit 1; }
          ! grep -q "__IROH_RELAY_URL_2__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_RELAY_URL_2 placeholder not substituted"; exit 1; }
          ! grep -q "__IROH_DNS_URL_2__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_DNS_URL_2 placeholder not substituted"; exit 1; }
          grep -q "CUSTOM_IROH_RELAY_URL_2" ./src/iroh_transport.rs || { echo "[FAIL] iroh backup relay constant missing"; exit 1; }
          grep -q "backup self-hosted pkarr publish+resolve" ./src/iroh_transport.rs || { echo "[FAIL] iroh backup pkarr discovery missing"; exit 1; }
          ! grep -q "__IROH_RELAY_URL_3__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_RELAY_URL_3 placeholder not substituted"; exit 1; }
          ! grep -q "__IROH_DNS_URL_3__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_DNS_URL_3 placeholder not substituted"; exit 1; }
          grep -q "CUSTOM_IROH_RELAY_URL_3" ./src/iroh_transport.rs || { echo "[FAIL] iroh third backup relay constant missing"; exit 1; }
          # [LnDesk v290] pkarr publish size guard. Each published attribute
          # is its own DNS TXT record and pkarr hard-caps the compressed
          # packet at 1000 bytes; a multi-homed host used to overflow it
          # ("expected max 1000 bytes but got: 1083") so EVERY self-hosted
          # pkarr publish failed and auto-iroh burned its full 10s direct
          # dial timeout. Guarded by: addr prune+cap and a relay-only retry.
          grep -q "PKARR_MAX_DIRECT_ADDRS: usize = 12" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr direct-addr cap missing"; exit 1; }
          grep -q "fn pkarr_select_direct_addrs" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr addr prune helper missing"; exit 1; }
          grep -q "retrying relay-only" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr relay-only overflow fallback missing"; exit 1; }
          # [LnDesk v306] 私网地址降优先级。现场日志里对端发布的是
          # `udp: 192.168.98.117:62966` —— 私网地址被当作直连候选参与
          # send_addr() 的 choose()，选中时 best_addr 为空 -> Unconfirmed ->
          # conn_type 合成 Mixed，UI 显示"中继"。pkarr_addr_is_useful() 只排
          # loopback/unspecified/multicast/link-local/IPv6-ULA，**不过滤
          # RFC1918**（那是给 P2P 打洞用的，不能直接删）。这里只做**排序降级**：
          # 私网候选排到公网候选之后，容量上限不变，公网可用时优先用公网。
          grep -q "fn pkarr_addr_is_private" ./src/iroh_transport.rs || { echo "[FAIL] v306: private-addr classifier missing"; exit 1; }
          grep -q "pkarr_addr_is_private(a)" ./src/iroh_transport.rs || { echo "[FAIL] v306: private addrs not deprioritised in the pkarr sort key"; exit 1; }
          echo "[OK] v306: pkarr direct addrs deprioritise RFC1918 (public ranks first)"
          # ----------------------------------------------------------------------
          # v215 prewarm
          # ----------------------------------------------------------------------
          # [v215] After a long idle (>6.5s) iroh stops trusting the peer's
          # validated direct address (TRUST_UDP_ADDR_DURATION, best_addr.rs:10),
          # so the first dial degrades to MIXED and the relay usually wins the
          # race. This resolves the peer through the configured discovery
          # services and injects the direct addresses BEFORE the dial, widening
          # the candidate set. Non-blocking: the dial starts immediately, so
          # this can only add candidates, never delay the connection.
          python3 patches/iroh/iroh_direct_prewarm.py .
          grep -q "v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v215 prewarm helper missing"; exit 1; }
          grep -q 'futures-util' ./Cargo.toml || { echo "[FAIL] v215 needs futures-util for StreamExt"; exit 1; }
          # ------------------------------------------------------------------
          # v221: two-phase pre-warm (awaited head + detached tail)
          # ------------------------------------------------------------------
          # The pre-warm is only useful if it runs BEFORE the first QUIC flight.
          # `add_node_addr` fills the candidate pool but never sets `best_addr`
          # (iroh node_state.rs:663), and only a returned DISCO pong promotes one
          # (node_state.rs:976) -- while `best_addr == Empty` makes send_addr()
          # return Unconfirmed -> Mixed, i.e. direct merely RACES the relay
          # (udp_paths.rs:105). A detached pre-warm therefore cannot produce a
          # pure-direct dial. Hence the call must be AWAITED.
          grep -q "pub async fn v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v221 v215_prewarm_direct must be async (detached pre-warm is a known regression)"; exit 1; }
          ! grep -q "pub fn v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v221 old non-async v215_prewarm_direct still present"; exit 1; }
          grep -qF "v215_prewarm_direct(ep.endpoint.clone(), node_id, peer_node_id).await;" ./src/iroh_transport.rs || { echo "[FAIL] v221 prewarm call site is not awaited"; exit 1; }
          grep -q "const V221_PREWARM_HEAD_MS" ./src/iroh_transport.rs || { echo "[FAIL] v221 blocking head window missing"; exit 1; }
          grep -q "fn v215_inject_item" ./src/iroh_transport.rs || { echo "[FAIL] v221 shared injection helper missing"; exit 1; }
          grep -q "fn v215_prewarm_tail" ./src/iroh_transport.rs || { echo "[FAIL] v221 detached tail consumer missing"; exit 1; }
          # v221: path-type observability. Without these the log never says
          # whether a session was direct / mixed / relay, so the direct rate is
          # unmeasurable and every future tuning decision is guesswork.
          grep -q "connected to {} via {}" ./src/iroh_transport.rs || { echo "[FAIL] v221 connect-time conn_type log missing"; exit 1; }
          grep -q "v221] idle-gap" ./src/iroh_transport.rs || { echo "[FAIL] v221 idle-gap diagnosis missing"; exit 1; }
          grep -q "relay map: self-hosted only" ./src/iroh_transport.rs || { echo "[FAIL] iroh relay map not self-hosted-only"; exit 1; }
          ! grep -q "default_relay_map" ./src/iroh_transport.rs || { echo "[FAIL] n0 relay merge still present"; exit 1; }
          # ----------------------------------------------------------------------
          # v88 heartbeat
          # ----------------------------------------------------------------------
          python3 patches/iroh/iroh_heartbeat.py .
          grep -q 'v\["iroh_id"\]' ./src/hbbs_http/sync.rs || { echo "[FAIL] sync.rs missing iroh_id report"; exit 1; }
          # ----------------------------------------------------------------------
          # v88 menu
          # ----------------------------------------------------------------------
          python3 patches/iroh/iroh_menu.py .
          if grep -q 'String? ipv6;' ./flutter/lib/common/hbbs/hbbs.dart; then
            grep -q "_irohDirectAction" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] peer_card missing iroh menu"; exit 1; }
          fi
          # ----------------------------------------------------------------------
          # [LnDesk v301] mixed-ok: auto-iroh 的 8 秒白等
          # ----------------------------------------------------------------------
          # [v223] "Direct-first hold" 把 `mixed(udp+relay)` 也当作"还没直连"，
          # 于是握手成功（249ms）后仍钻进 10s 迁移等待，吃掉 client.rs 的
          # 8000ms auto-iroh 预算，白等 8 秒才回落。v301 把等待条件收紧为
          # 「纯 Relay」，mixed 直接放行；等待上限 10s -> 3s。
          python3 patches/iroh/patch_iroh_mixed_ok.py .
          grep -qF 'HOLD_MS_DIRECT_FIRST: u64 = 3_000' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: iroh hold not bounded to 3s"; exit 1; }
          grep -qF 'ConnectionType::Relay { .. }' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: iroh mixed-ok gate missing (mixed must not wait)"; exit 1; }
          ! grep -qF 'Some(iroh::endpoint::ConnectionType::Direct { .. })' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: v223 Direct-only hold condition still present"; exit 1; }
          echo "[OK] v301: auto-iroh treats mixed(udp+relay) as usable (hold only for relay-only, 3s)"
          # [v119] Iroh Direct is OTP-only and must NOT touch the locally saved
          # password: no destructive mainForgetPassword (v117-revert behaviour)
          # and no saved-password-first reversal either. The Rust fallback that
          # read PeerConfig::load(...).password on the iroh path is removed too
          # (see patch_iroh_transport.py).
          #
          # Scope note (a whole-file grep is a false positive here):
          #   * upstream peer_card.dart legitimately calls mainForgetPassword in
          #     its own "forget password" menu entries, so only the
          #     _irohDirectConnect body may be checked.
          #   * upstream src/client.rs legitimately calls PeerConfig::load in
          #     load_config(), so the patches-only marker
          #     iroh_node_id_to_rustdesk_password is the needle.
          # [v119] Guard: this marker lands inside _irohDirectConnect, which
          # iroh_menu.py builds on anchors that patch_online_devices.py injects
          # (hbbs.dart 'String? ipv6;', peer_card.dart _ipv6DirectAction method +
          # menu entry). That step runs when api_device_sync/ip_direct_menu is
          # 'true', while THIS iroh step runs on enable_iroh_direct -- so an
          # iroh-only dispatch gets here with no anchors, iroh_menu SKIP-ABSENTs
          # every edit, and an unguarded assertion failed the whole build
          # (run 37487389086: "[FAIL] v119: iroh OTP-only path not injected").
          # Mirror the guard 1972-1974 already uses for _irohDirectAction:
          # assert only when the iroh menu was actually injectable.
          if grep -q 'String? ipv6;' ./flutter/lib/common/hbbs/hbbs.dart; then
            grep -q "\[v119\] Passwordless iroh path" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v119: iroh OTP-only path not injected"; exit 1; }
          else
            echo "[SKIP] v119: iroh menu not injected (api_device_sync/ip_direct_menu not 'true' -> patch_online_devices.py skipped); skipping v119 marker assertion"
          fi
          if awk '/Future<void> _irohDirectConnect\(/{f=1} f{print} f&&/^  }$/{exit}' ./flutter/lib/common/widgets/peer_card.dart | grep -q "mainForgetPassword"; then
            echo "[FAIL] v119: _irohDirectConnect still deletes the saved password"
            exit 1
          fi
          if grep -q "iroh_node_id_to_rustdesk_password" src/client.rs; then
            echo "[FAIL] v119: iroh saved-password fallback must be removed from client.rs"
            exit 1
          fi
          if grep -q "Saved password FIRST" ./flutter/lib/common/widgets/peer_card.dart; then
            echo "[FAIL] v117-revert: iroh saved-password-first must be removed"
            exit 1
          fi

