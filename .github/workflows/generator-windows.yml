          grep -q "_accessibleDeviceTitle" flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v120: accessible-device address-book alias helper (_accessibleDeviceTitle) missing"; exit 1; }
          # UI_MODE_BOTH: "鏌ョ湅"鎸夐挳闇€杩滅▼妗岄潰绐楀彛鍒濆鍖栨椂寮哄埗缃负 view-only锛?
          # 閫氳繃涓存椂鍏ㄥ眬 option 浼犻€掞紝閬垮厤杞鏃跺簭涓嶅彲闈犮€?
          cp -f patches/remote_page_both.dart flutter/lib/desktop/pages/remote_page.dart
          mkdir -p src/lang/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs
          # [v117 bug2] "鎺у埗" must force view_only=N. The persisted read-only state is
          # PeerConfig.view_only (a TOP-LEVEL typed field), NOT PeerConfig.options
          # ["view_only"] -- mainSetPeerOption only writes the generic options table, so
          # writing it there is a silent no-op. The real reset has to happen inside the
          # session (sessionToggleOption('view-only') persists back to PeerConfig), so
          # onControl() only arms a one-shot flag that the remote window consumes.
          # Assert both halves landed, otherwise the button silently stays read-only.
          grep -q "kForceControlLaunch" flutter/lib/desktop/pages/connection_page.dart || { echo "[FAIL] v117 control button does not arm force-control-launch"; exit 1; }
