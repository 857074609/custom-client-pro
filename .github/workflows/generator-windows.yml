          # patch_direct_access.py 瀵逛笂娓?1.4.9 婧愮爜鍋氶敋鐐规敞鍏ワ紙鏂板 src/direct_access.rs锛?
          # 澧炲己 rendezvous_mediator::direct_server 鐘舵€佸啓鍏ャ€乫lutter_ffi::main_check_connect_status
          # 寮哄埗鍚敤 direct-server + LAN IP 鍙戠幇銆乨esktop_home_page 鍐呯綉鐪嬫澘 + 鍙岃 key锛夈€?
          # 浠讳竴閿氱偣缂哄け/姝т箟鍗虫姤閿欓€€鍑猴紝鏋勫缓鏄惧紡澶辫触銆?
          # 鏄惁杩愯瀹屽叏鍙栧喅浜庢槸鍚﹀嬀閫夈€屽唴缃?IP 鐩磋繛鐪嬫澘銆?ip_direct_board)锛屼笌 direction 鏃犲叧銆?
          # 褰?direction=both 涓斿悓鏃跺嬀閫夋湰椤规椂锛歞esktop_home_page 姝ゆ椂宸叉槸 desktop_home_page_both.dart锛?
          # 鑴氭湰妫€娴嬪埌 // UI_MODE_BOTH 鏍囪鍚庝粎璺?Rust 渚э紙鍐欏叆 lan-ip / lan-ipv6 / direct-access-port
          # 閫夐」渚涗笂閮ㄦ湰鏈轰俊鎭崱鐗囪鍙栵級锛屽苟鑷姩璺宠繃 Dart 渚ф敞鍏ワ紙閬垮厤閲嶅 buildDirectAccessBoard锛夈€?
          python3 patches/patch_direct_access.py . "${{ inputs.ui_mode }}"
          # 涓嶄緷璧?env.CLIENT_TYPE锛堝叾灏氭湭璁剧疆锛夛紝鐩存帴妫€娴嬪綋鍓?desktop_home_page.dart 鏄惁涓?
          # desktop_home_page_both.dart 鍙樹綋锛堥《閮ㄥ惈 // UI_MODE_BOTH 鏍囪锛夈€俠oth 鍙樹綋宸插湪鏈満
          # 淇℃伅鍗＄墖鑷覆鏌撶綉缁滀俊鎭紝鏃犻渶鍐嶆敞鍏?buildDirectAccessBoard銆?
          if grep -q "// UI_MODE_BOTH" flutter/lib/desktop/pages/desktop_home_page.dart; then
            echo "[OK] desktop_home_page_both.dart: 璺宠繃 buildDirectAccessBoard 鏍￠獙锛堢綉缁滀俊鎭凡鍦ㄤ笂閮ㄦ湰鏈轰俊鎭崱鐗囪嚜娓叉煋锛?
          else
