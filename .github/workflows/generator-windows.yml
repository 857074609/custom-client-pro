      - name: iroh menu (v88)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          python3 patches/patch_iroh_menu.py .
          if grep -q 'String? ipv6;' ./flutter/lib/common/hbbs/hbbs.dart; then
            grep -q "_irohDirectAction" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] peer_card missing iroh menu"; exit 1; }
          fi
          # [v119] Iroh Direct is OTP-only and must NOT touch the locally saved
          # password: no destructive mainForgetPassword (v117-revert behaviour)
          # and no saved-password-first reversal either. The Rust fallback that
          # read PeerConfig::load(...).password on the iroh path is removed too
          # (see patch_iroh_transport.py).
          #
          # Scope note (a whole-file grep is a false positive here):
          #   * upstream peer_card.dart legitimately calls mainForgetPassword in
          #     its own "forget password" menu entries, so only the
          #     _irohDirectConnect body may be checked.
          #   * upstream src/client.rs legitimately calls PeerConfig::load in
          #     load_config(), so the patches-only marker
          #     iroh_node_id_to_rustdesk_password is the needle.
          grep -q "\[v119\] Passwordless iroh path" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v119: iroh OTP-only path not injected"; exit 1; }
          if awk '/Future<void> _irohDirectConnect\(/{f=1} f{print} f&&/^  }$/{exit}' ./flutter/lib/common/widgets/peer_card.dart | grep -q "mainForgetPassword"; then
            echo "[FAIL] v119: _irohDirectConnect still deletes the saved password"
            exit 1
          fi
          if grep -q "iroh_node_id_to_rustdesk_password" src/client.rs; then
            echo "[FAIL] v119: iroh saved-password fallback must be removed from client.rs"
            exit 1
          fi
          if grep -q "Saved password FIRST" ./flutter/lib/common/widgets/peer_card.dart; then
            echo "[FAIL] v117-revert: iroh saved-password-first must be removed"
            exit 1
          fi
      - name: pin iroh lock closure to MSRV-safe versions (v88)
        shell: bash
        run: |
          # iroh 0.35 pulls url 2.5.4 (via iroh-relay) -> idna 1.1 -> idna_adapter.
          # idna_adapter is pinned to =1.2.0 in Cargo.toml (via patch_iroh_transport.py),
          # which drags the whole icu subtree to the 1.x line (MSRV 1.67) so the pinned
          # 1.85.0 toolchain can build the iroh closure. 1.2.0 is the only 1.2.x build
          # that depends on icu 1.x; 1.2.1/1.2.2 pull icu 2.x (rust-version 1.82/1.86)
          # which the toolchain cannot compile. The pin lives in Cargo.toml (not a
          # post-hoc `cargo update`), so the first lock resolution already selects it.
          # Guarded so builds without iroh (e.g. quick) skip the pin cleanly.
          if grep -q '^iroh' ./Cargo.toml; then
            cargo fetch
            # [prod-line v111] materialize the iroh-quinn [patch.crates-io] git
            # source into Cargo.lock: the fork tolerates Windows async UDP socket
            # errors (10052 family) that kill the endpoint on v6-less sites.
            cargo update -p iroh-quinn
            grep -qF '857074609/iroh-quinn' ./Cargo.lock || { echo "[FAIL] iroh-quinn patch not materialized in lock"; exit 1; }
            if ! grep -A1 'name = "idna_adapter"' ./Cargo.lock | grep -q '1\.2\.0'; then
              echo "[FAIL] idna_adapter is not 1.2.0"; exit 1
            fi
            if grep -A1 'name = "icu_' ./Cargo.lock | grep -qE 'version = "2\.'; then
              echo "[FAIL] icu >= 2.0 (rust-version >= 1.86) still in lock"; exit 1
            fi
            echo "[OK] MSRV-1.85 lock: idna_adapter $(grep -A1 'name = "idna_adapter"' ./Cargo.lock | tail -1)"
          else
            echo "[SKIP] iroh not in Cargo.toml, no icu pin needed"
            cargo fetch
          fi
      - name: gate hwcodec cqp fork NOT in lock (v116, CQP reverted)
        # v116-fix4 reverts the hwcodec 0.8.0 migration (externals/ submodules
        # are missing from the git-data API upload, so the C++ build fails).
        # CQP lands in V117. The fork must NOT leak into Cargo.lock; if it
        # does, the revert did not take and the build would fail at fetch.
        shell: bash
        run: |
          if grep -qF '857074609/hwcodec' ./Cargo.lock; then
            echo "[FAIL] v116 hwcodec cqp fork must NOT be in lock (reverted for V116; lands in V117)"
            exit 1
          fi
      - name: Apply super-p2p observe patch (V186)
        # Authenticated port-prediction stack, observe-only gray scale: public
        # STUN NAT classification + HMAC probe against the advertised mapping,
        # fire-and-forget on a detached thread. Logs only; transport selection
        # is untouched. Default ON; dispatch extras enable_super_p2p=false
        # bakes DEFAULT_ENABLED=false to opt a build out.
        env:
          SUPER_P2P_DEFAULT: ${{ fromJson(inputs.extras || '{}').enable_super_p2p == 'false' && 'false' || 'true' }}
        run: python3 patches/patch_super_p2p.py .
      - name: Gate - cargo check hbb_common (fail fast on patch compile errors)
        # Network-hardening patches (v98 TCP keepalive + DNS cache, V101
        # happy-eyeballs, V102 happy-eyeballs-lift + DNS timeout) all live in the
        # hbb_common crate. A typo there only surfaces at `cargo build` time,
        # which is reached only after vcpkg install + flutter engine + full build
        # (~20 min wasted on a guaranteed-fail). Compile-check hbb_common right
        # after the lock is fetched so a bad patch fails the run within minutes,
        # with a readable error, instead of deep in the build step.
        shell: bash
        run: |
          echo ">> cargo check -p hbb_common (gate: catch patch compile errors early)"
          cargo check -p hbb_common --message-format short
