          python3 patches/patch_desktop_redirect.py .
          echo "[OK] V107 desktop-redirect patch (intentionally no-op 鈥?feature abandoned)"

      - name: Auto-overwrite for headless file transfer (V104-fix)
        shell: bash
        run: |
          # Headless drag-drop transfers must NOT show the overwrite confirmation
          # dialog (the FT window is hidden, user cannot click it). This patch
          # auto-overwrites when isHeadlessTransfer=true, while keeping the dialog
          # for manual (non-drop) transfers from the FT window UI.
          # Must run AFTER patch_remote_drop_file.py (anchors on its output).
          python3 patches/patch_file_transfer_auto.py .
          grep -q "isHeadlessTransfer" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing headless flag"; exit 1; }
          grep -q "V104-fix-auto: headless" flutter/lib/models/file_model.dart || { echo "[FAIL] file_model.dart missing auto-overwrite logic"; exit 1; }
          echo "[OK] V104-fix headless auto-overwrite + consistent destination"

      - name: Headless file transfer without peer confirmation (V105 headless-drop)
        shell: bash
        run: |
          # Unattended drag-drop: the control side opens a brand-new FILE TRANSFER
          # connection per drop and does NOT carry a password, so the peer fell
          # into the empty-password branch of handle_login_request() and raised
          # the Connection Manager dialog - which nobody can click on an
          # unattended host, so the transfer never started.
          # This patch (a) remembers peers that authenticated recently and
          # auto-approves their file-transfer sessions inside the grace window
          # (default 30 min, headless-ft-grace-minutes=0 disables), and (b) forces
          # msg.enable_file_transfer=Yes on the control side, which previously
          # depended on the "enable-file-copy-paste" toggle (off by default) and
          # otherwise left the peer's file channel gated off.
          # Scope: file-transfer sessions only. Desktop remote sessions still
          # require the normal password / click approval.
          # Must run AFTER patch_file_transfer_auto.py (independent anchors, but
          # keep the drop-file patch group together).
          python3 patches/patch_headless_ft_auth.py .
          grep -qF "V105 headless drop-file: auto-approving" src/server/connection.rs || { echo "[FAIL] connection.rs missing headless FT auto-approve"; exit 1; }
          grep -qF "V105 headless drop-file: force-enable" src/client.rs || { echo "[FAIL] client.rs missing forced file-transfer option"; exit 1; }
          echo "[OK] V105 headless file transfer (no peer confirmation)"

      - name: Drop-initiated FT window shrinks to mini transfer card (V107-mini)
        shell: bash
        run: |
          # V107-mini: the drag-drop FT window is resized to a 240x480
          # progress-only card (native per-file progress, native cancel) and
          # auto-closes when all jobs finish. The full manager is one click away.
          # The custom V105 transfer-progress OVERLAY (kWindowDragProgress IPC,
          # _showDragProgressDialog) was removed in the native-FT refactor and is
          # intentionally NOT restored here -- only the native mini window is.
          # Must run AFTER patch_remote_drop_file.py + patch_file_transfer_auto.py
          # (re-anchors the _enterMiniTransferMode() call on the [V104-drop] block
          # those patches inject). Patch asserts its own anchors; we gate the
          # two structural markers that prove the mini window landed.
          python3 patches/patch_drop_progress_v2.py .
          grep -qF "_enterMiniTransferMode" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing mini transfer mode entry"; exit 1; }
          grep -qF "_buildMiniTransferView" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing mini transfer view"; exit 1; }
          echo "[OK] V107 mini transfer window (240x480 native progress card)"

      - name: Login timeout watchdog + stale saved-password self-heal (V105)
        shell: bash
        run: |
          # 1) A stale saved password on an iroh direct connect used to hang at
          #    "Connecting..." forever (peer never answers, no prompt, no picture).
          #    This patch (a) clears the persisted copy when the failed attempt
          #    carried exactly that saved password, so the next attempt prompts,
          #    and (b) arms a 20s watchdog that swaps the endless spinner for a
          #    visible login-error dialog when no first image ever arrives.
          # 2) Runs AFTER the drop/transfer patches (independent anchors).
          python3 patches/patch_login_timeout.py .
          grep -qF "stale-saved-password" src/client.rs || { echo "[FAIL] client.rs missing stale-password self-heal"; exit 1; }
          grep -qF "login-watchdog" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing login watchdog"; exit 1; }
          echo "[OK] V105 login watchdog + stale-password self-heal"

      - name: Rendezvous family-match DNS probe (v100, IPv6 preferred, default-on)
        shell: bash
        run: |
          # Default-on client-side DNS probe: when enable-dual-stack-lookup is
          # set (or absent, because the "enable-" prefix defaults to enabled) AND
          # the local host has a usable IPv6 stack, resolve AAAA first (500ms
          # ceiling) before falling back to the legacy IPv4 happy-eyeballs path.
          # Set enable-dual-stack-lookup=N to disable.
          python3 patches/patch_rendezvous_family_match.py .
          grep -qF "prod-line v100 family-match" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing v100 family-match probe"; exit 1; }
          echo "[OK] V100 rendezvous family-match (IPv6 preferred, default-on DNS probe)"

      - name: Rendezvous family-match settings toggle (v100 UI)
        shell: bash
        run: |
          # Adds a Settings > Network switch ("DNS resolve by address family
          # (IPv6 preferred)") that writes the local config key
          # enable-dual-stack-lookup, which the Rust probe above reads. The
          # "enable-" prefix makes it default-on.
          python3 patches/patch_family_match_setting.py .
          grep -qF "prod-line v100 family-match-ui" flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] desktop_setting_page.dart missing v100 family-match toggle"; exit 1; }
          # [v175] switchWidget() funnels the title and the tooltip through
          # listTile() -> translate(), so the row stays English unless cn.rs
          # carries both strings byte-for-byte. Asserted only when the
          # customized cn.rs is in play: the upstream-only variant compiles the
          # stock upstream file and must not be forced to use ours.
          if grep -qF '[LnDesk v175]' src/lang/cn.rs; then
            grep -qF '("DNS resolve by address family (IPv6 preferred)"' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the family-match toggle title"; exit 1; }
            grep -qF '("Enable IPv6-first DNS resolution for P2P connections.' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the family-match tooltip"; exit 1; }
          fi
          echo "[OK] V100 rendezvous family-match UI toggle"

      - name: auto iroh (v149)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          python3 patches/patch_auto_iroh.py .
          grep -q "auto_iroh_node_id" ./src/iroh_transport.rs || { echo "[FAIL] v149: auto_iroh_node_id helper missing"; exit 1; }
          grep -q "auto-iroh-node-id" ./src/client.rs || { echo "[FAIL] v149: auto-iroh routing missing in client.rs"; exit 1; }
          grep -q "auto-iroh-node-id" ./flutter/lib/common.dart || { echo "[FAIL] v149: peerIrohId lookup hook missing in common.dart"; exit 1; }
          grep -q "enable-auto-iroh" ./flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] v149: auto-iroh settings toggle missing"; exit 1; }
          # [v177] The peer option must be keyed by the RAW id. formatID() is a
          # DISPLAY formatter that pads numeric ids with spaces
          # ("123456789" -> "123 456 789"), so keying off it made every
          # double-click miss the peerIrohId map AND store the option under an
          # id the Rust side never loads (PeerConfig::load(raw id)) - the
          # "Iroh first" toggle looked dead while right-click Iroh Direct kept
          # working. Guard the SHAPE, not just the presence of the hook.
          grep -q "final fid = trimID(id);" ./flutter/lib/common.dart || { echo "[FAIL] v177: auto-iroh must key off the raw id (trimID)"; exit 1; }
          if grep -q "final fid = formatID(id);" ./flutter/lib/common.dart; then
            echo "[FAIL] v177: auto-iroh still keyed off the display formatter (formatID)"; exit 1
          fi
          grep -q "if (autoNodeId.isNotEmpty) {" ./flutter/lib/common.dart || { echo "[FAIL] v177: auto-iroh must not wipe a known NodeId on an empty lookup"; exit 1; }
          # [v175] same translate() path as the family-match toggle: the key and
          # the tooltip must exist in the customized cn.rs, otherwise the row
          # renders in English even on a Chinese UI.
          if grep -qF '[LnDesk v175]' src/lang/cn.rs; then
            grep -qF '("Iroh first connection"' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the Iroh-first toggle title"; exit 1; }
            grep -qF '("Try the iroh P2P transport first for numeric IDs' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the Iroh-first tooltip"; exit 1; }
          fi
          echo "[OK] v149 auto-iroh toggle localized"

