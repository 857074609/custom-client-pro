      - name: File transfer resilience (v320)
        shell: bash
        run: |
          # [LnDesk v320] file-transfer resilience (client send timeout + pump stall guard)
          #
          # Two client-side guards so a stalled upload fails
          # VISIBLY instead of freezing the progress bar forever.
          #
          # Symptom: uploading a file freezes partway (seen at 98%); after
          # that there is no transfer log at all, the session stays alive,
          # and it reproduces identically over relay and direct P2P (so it
          # is not a network-path problem).
          #
          # Root cause: the controlled side sets a send timeout on its
          # stream, but the CONTROLLING side never did, so a peer that
          # stops consuming file blocks wedges our send forever on a full
          # socket buffer with no deadline.
          #   v320-1: set a client send timeout (120s, matches the
          #           controlled side's SEND_TIMEOUT_OTHER).
          #   v320-2: bound one pump tick (60s) so zero forward progress
          #           breaks the io_loop and triggers a reconnect.
          python3 patches/file_transfer/patch_client_send_timeout.py .
          python3 patches/file_transfer/patch_transfer_stall_timeout.py .
          # Guards: both markers, the actual timeout wire-ups, and the
          # timeout constant typed as u64 milliseconds (hbb_common::timeout
          # takes ms, not a Duration -- a Duration here fails to compile).
          grep -qF "[LnDesk v320] client send timeout" src/client/io_loop.rs || { echo "[FAIL] v320: client send-timeout marker missing in io_loop.rs"; exit 1; }
          grep -qF "peer.set_send_timeout(V320_CLIENT_SEND_TIMEOUT_MS);" src/client/io_loop.rs || { echo "[FAIL] v320: client set_send_timeout call missing"; exit 1; }
          grep -qF "[LnDesk v320] transfer stall timeout" src/client/io_loop.rs || { echo "[FAIL] v320: transfer stall-timeout marker missing in io_loop.rs"; exit 1; }
          grep -qF "const V320_TRANSFER_STALL_TIMEOUT_MS: u64 = 60_000;" src/client/io_loop.rs || { echo "[FAIL] v320: stall timeout constant must be u64 milliseconds"; exit 1; }
          grep -qF "V320_TRANSFER_STALL_TIMEOUT_MS," src/client/io_loop.rs || { echo "[FAIL] v320: stall timeout not passed to timeout()"; exit 1; }
          echo "[OK] v320: client send timeout + transfer pump stall guard in place"

      - name: File-transfer version race (v334)
        shell: bash
        run: |
          # [LnDesk v334] floor the peer version with our own at the overwrite-
          # detection (od) and resume gates. lc.version is 0 until PeerInfo lands,
          # so a file dragged in the first seconds of a session silently lost od
          # + resume and every retry restarted from byte 0. The resume offset is
          # also honoured for a fresh job (digest.is_identical already proves the
          # peer holds a prefix of the same source), so a matching partial
          # .download resumes instead of overwriting.
          python3 patches/file_transfer/patch_transfer_version_race.py .
          # Semantic guards (counts + absence of the old form, NOT text-match of
          # intermediate layout) so a later harmless reformat cannot false-FAIL.
          grep -qF "[LnDesk v334]" src/client/io_loop.rs || { echo "[FAIL] v334: marker missing in io_loop.rs"; exit 1; }
          _v334_m=$(grep -c "\[LnDesk v334\]" src/client/io_loop.rs)
          [ "$_v334_m" -eq 6 ] || { echo "[FAIL] v334: expected 6 markers, got $_v334_m"; exit 1; }
          _v334_floor=$(grep -c "peer_ver_floor" src/client/io_loop.rs)
          [ "$_v334_floor" -eq 4 ] || { echo "[FAIL] v334: expected 4 peer_ver_floor refs, got $_v334_floor"; exit 1; }
          grep -qF "can_enable_overwrite_detection(peer_ver_floor);" src/client/io_loop.rs || { echo "[FAIL] v334: od gates must consume the floored value"; exit 1; }
          grep -qF "is_support_resume," src/client/io_loop.rs || { echo "[FAIL] v334: NeedConfirm input must drop job.is_resume"; exit 1; }
          grep -qF "is_support_resume && job.is_resume" src/client/io_loop.rs && { echo "[FAIL] v334: old NeedConfirm arg still present"; exit 1; }
          grep -qF "if digest.is_identical && job.is_resume {" src/client/io_loop.rs && { echo "[FAIL] v334: old sender resume condition still present"; exit 1; }
          _v334_res=$(grep -c "&& digest.transferred_size > 0" src/client/io_loop.rs)
          [ "$_v334_res" -ge 2 ] || { echo "[FAIL] v334: expected >=2 resume-offset sites, got $_v334_res"; exit 1; }
          echo "[OK] v334: peer-version floor + fresh-job resume in place"


      # [LnDesk v302b -> v307a] the hwcodec fork now carries force_i all the way
      # down: 944e5e8 widened EncodeCall to 6 args, 11f1b3a made
