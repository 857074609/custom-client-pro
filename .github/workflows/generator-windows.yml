      - name: pin iroh lock closure to MSRV-safe versions (v88)
        shell: bash
        run: |
          # iroh 0.35 pulls url 2.5.4 (via iroh-relay) -> idna 1.1 -> idna_adapter.
          # idna_adapter is pinned to =1.2.0 in Cargo.toml (via patch_iroh_transport.py),
          # which drags the whole icu subtree to the 1.x line (MSRV 1.67) so the pinned
          # 1.85.0 toolchain can build the iroh closure. 1.2.0 is the only 1.2.x build
          # that depends on icu 1.x; 1.2.1/1.2.2 pull icu 2.x (rust-version 1.82/1.86)
          # which the toolchain cannot compile. The pin lives in Cargo.toml (not a
          # post-hoc `cargo update`), so the first lock resolution already selects it.
          # Guarded so builds without iroh (e.g. quick) skip the pin cleanly.
          if grep -q '^iroh' ./Cargo.toml; then
            cargo fetch
            # [prod-line v111] materialize the iroh-quinn [patch.crates-io] git
            # source into Cargo.lock: the fork tolerates Windows async UDP socket
            # errors (10052 family) that kill the endpoint on v6-less sites.
            cargo update -p iroh-quinn
            grep -qF '857074609/iroh-quinn' ./Cargo.lock || { echo "[FAIL] iroh-quinn patch not materialized in lock"; exit 1; }
            if ! grep -A1 'name = "idna_adapter"' ./Cargo.lock | grep -q '1\.2\.0'; then
              echo "[FAIL] idna_adapter is not 1.2.0"; exit 1
            fi
            if grep -A1 'name = "icu_' ./Cargo.lock | grep -qE 'version = "2\.'; then
              echo "[FAIL] icu >= 2.0 (rust-version >= 1.86) still in lock"; exit 1
            fi
            echo "[OK] MSRV-1.85 lock: idna_adapter $(grep -A1 'name = "idna_adapter"' ./Cargo.lock | tail -1)"
          else
            echo "[SKIP] iroh not in Cargo.toml, no icu pin needed"
            cargo fetch
          fi
      - name: gate hwcodec zerolatency fork IS in lock (v260)
        # [LnDesk v260] INVERTS the v116 NOT-in-lock gate: hwcodec is now
        # rerouted to our zerolatency fork (H264/H265 mouse-smear root fix)
        # via a root-Cargo.toml [patch] + a rewritten Cargo.lock source line
        # (patch_hwcodec_zerolatency.py). The v116 assertion would fail every
        # build from now on. Runs after the pre-build `cargo fetch`, so the
        # pinned fork rev must already be materialized here.
        shell: bash
        run: |
          grep -qF '857074609/hwcodec' ./Cargo.lock || { echo "[FAIL] v260 hwcodec zerolatency fork missing from lock"; exit 1; }
          grep -qF '944e5e8c4f384d89fe6931528fe30fdef17f0df7' ./Cargo.lock || { echo "[FAIL] v260 hwcodec fork not pinned to 944e5e8"; exit 1; }
          echo "[OK] v260 hwcodec fork materialized in lock @ 944e5e8"
      - name: super-p2p suite (V186/V187 observe + V200 remove native test_nat_type)
        # [V218] 合并为一个步骤：两步强耦合（V200 依赖 super_p2p 模块），且同属
        # 「启用P2P增强」(super_p2p_enforcement) 一个复选框。
        if: fromJson(inputs.extras || '{}').super_p2p_enforcement != 'observe'
        # Authenticated port-prediction stack: public STUN NAT classification +
        # HMAC probe against candidates; acceptor self-observes and reports its
        # public mapping (V187a). fire-and-forget on a detached thread.
        #
        # [V217] 单一开关收敛：原先由两个键控制 ——
        #   enable_super_p2p（总开关）与 super_p2p_enforcement（强度）。
        #   但 enable_super_p2p 在前端 forms.py / services.py / generator.html
        #   三处均无定义（死键），表达式恒解析为 'true'，导致 super-p2p 在所有
        #   构建中强制启用、用户无法关闭。现统一由 super_p2p_enforcement 驱动：
        #     勾选（'on'）      -> DEFAULT_ENABLED=true  + ENFORCEMENT="on"
        #                             探测验证通过即切 UDP 直连（全功能）
        #     取消勾选（'observe'）-> DEFAULT_ENABLED=false + ENFORCEMENT="observe_only"
        #                             enabled() 返回 false，observe 任务在入口直接
        #                             return，零探测开销（完全停用）
        # 运行时仍可用本地选项 enable-super-p2p 覆盖烘焙默认值（空=用默认）。
        #
        # 门控说明：用 `!= 'observe'` 而非 `== 'on'`，键缺失时 fromJson 返回 null
        # 条件成立，保持「默认启用」的向后兼容行为（旧版 generator 不下发该键
        # 也不会关掉功能）。取消勾选时 super-p2p 与 V200 一起跳过，Rust 侧保留
        # 上游原生 test_nat_type，不存在调用已移除模块的编译风险。
        #
        # 表达式说明：SUPER_P2P_DEFAULT 需要把 'observe' 显式映射成 'false'
        #（补丁内部只在 env 恰为 "false" 时才改写 DEFAULT_ENABLED），故用
        # `== 'observe' && 'false' || 'true'` 而非直接透传该键。
        env:
          SUPER_P2P_DEFAULT: ${{ fromJson(inputs.extras || '{}').super_p2p_enforcement == 'observe' && 'false' || 'true' }}
          SUPER_P2P_ENFORCEMENT: ${{ fromJson(inputs.extras || '{}').super_p2p_enforcement || 'on' }}
          SUPER_P2P_REFLECTORS: ${{ fromJson(inputs.extras || '{}').custom_p2p_reflector || '' }}
        shell: bash
        run: |
          python3 patches/patch_super_p2p.py .
          # V200: drop the hbbs-trusting native test_nat_type (RFC-incorrect
          # same-host-2-port symmetric heuristic) and feed startup/mediator NAT
          # refresh from super_p2p::refresh_my_nat_type(). MUST run AFTER the
          # super_p2p command above (which adds the module). Only wired here
          # because super_p2p is currently applied only in this windows workflow.
          python3 patches/patch_remove_test_nat_type.py .
          # [V296] SoonDesk 复刻：候选池拆分 + 有界兜底。断言补丁确实把三处
          # 新符号写进了 checkout（patches 侧只做写入，编译由下面的 cargo check 兜底；
          # 这里先做存在性断言，让符号缺失在几分钟内失败而不是等到完整构建）。
          echo ">> assert V296 super_p2p candidate split + bounded fallback"
          grep -qF 'pub fn exact_candidates' src/super_p2p/predict.rs \
            || { echo "[FAIL] v296: predict.rs exact_candidates missing"; exit 1; }
          grep -qF 'pub fn fixed_endpoint_fallback' src/super_p2p/predict.rs \
            || { echo "[FAIL] v296: predict.rs fixed_endpoint_fallback missing"; exit 1; }
          grep -qF 'let mut out = exact_candidates(advertised, additional);' src/super_p2p/predict.rs \
            || { echo "[FAIL] v296: predict.rs build_candidates not split (exact not hoisted)"; exit 1; }
          grep -qF 'FALLBACK_PORT_RADIUS: i32 = 24' src/super_p2p/mod.rs \
            || { echo "[FAIL] v296: mod.rs FALLBACK_PORT_RADIUS missing"; exit 1; }
          grep -qF 'predict::fixed_endpoint_fallback(primary, FALLBACK_PORT_RADIUS)' src/super_p2p/mod.rs \
            || { echo "[FAIL] v296: mod.rs bounded fallback not wired into probe_direct"; exit 1; }
          grep -qF 'EXACT_RESEND_ROUNDS' src/super_p2p/probe.rs \
            || { echo "[FAIL] v296: probe.rs exact resend not throttled"; exit 1; }
          echo "[OK] v296: exact/predicted split + fixed_endpoint_fallback + resend throttle all present"
          # [V298] STUN 池去境外：现场双端日志里 stun.l.google.com:19302 /
          # stun.cloudflare.com:3478 每轮吃 200~500ms 后返回 io: stun timeout
          # （与我们的 public mapping 发现无关，纯浪费预算），已删除，只保留
          # 国内可达目标（SoonDesk 同款口径）。断言三个境外目标确实不在了。
          python3 patches/patch_stun_pool_domestic.py .
          grep -qF 'stun.miwifi.com' src/super_p2p/mod.rs \
            || { echo "[FAIL] v298: domestic STUN list missing"; exit 1; }
          # 注意：注释里会提到被删掉的主机名，所以不能整体 grep；只检查
          # STUN_TARGETS 表体内部是否还有 ("host", port) 形式的条目。
          ! sed -n '/^const STUN_TARGETS/,/^];/p' src/super_p2p/mod.rs | grep -qF 'stun.l.google.com' \
            || { echo "[FAIL] v298: foreign STUN (google) still in pool"; exit 1; }
          ! sed -n '/^const STUN_TARGETS/,/^];/p' src/super_p2p/mod.rs | grep -qF 'stun.cloudflare.com' \
            || { echo "[FAIL] v298: foreign STUN (cloudflare) still in pool"; exit 1; }
          echo "[OK] v298: STUN pool is domestic-only (google/cloudflare removed)"
          # [V299] 删除 NAT 类型检测，无条件尝试打洞：原先 hbbs 把中继的
          # peer_nat_type 下发，对端 client.rs 一旦判为 SYMMETRIC 就直接放弃
          # 打洞改走 relay race。现场该判定频繁误伤（打洞本来能成），改为
          # 不再分类、不再据此短路，一律尝试。
          python3 patches/patch_remove_nat_type_gate.py .
          grep -qF 'v299: classification removed' src/super_p2p/mod.rs \
            || { echo "[FAIL] v299: NAT classification still runs in refresh_my_nat_type"; exit 1; }
          echo "[OK] v299: NAT-type detection removed, punching is unconditional"
          # [V300] probe 短路：已有 validated 候选时压缩 predicted 预算。
          # 现场 predicted 候选动辄上百个、每轮 batch 全部尝试，而真正打通
          # 的往往是 exact；V300 在 validated 出现后把 predicted 的发送上限
          # 压到 SHORT_CIRCUIT_PREDICTED_CAP（16），exact 永不裁剪。
          python3 patches/patch_probe_short_circuit.py .
          grep -qF 'SHORT_CIRCUIT_PREDICTED_CAP' src/super_p2p/probe.rs \
            || { echo "[FAIL] v300: probe.rs predicted cap missing"; exit 1; }
          grep -qF 'short_circuit_on_validated' src/super_p2p/probe.rs \
            || { echo "[FAIL] v300: probe.rs short-circuit switch missing"; exit 1; }
          echo "[OK] v300: probe short-circuits predicted once a candidate is validated"
      - name: Gate - cargo check hbb_common (fail fast on patch compile errors)
        # Network-hardening patches (v98 TCP keepalive + DNS cache, V101
        # happy-eyeballs, V102 happy-eyeballs-lift + DNS timeout) all live in the
        # hbb_common crate. A typo there only surfaces at `cargo build` time,
        # which is reached only after vcpkg install + flutter engine + full build
        # (~20 min wasted on a guaranteed-fail). Compile-check hbb_common right
        # after the lock is fetched so a bad patch fails the run within minutes,
        # with a readable error, instead of deep in the build step.
        shell: bash
        run: |
          echo ">> cargo check -p hbb_common (gate: catch patch compile errors early)"
          cargo check -p hbb_common --message-format short
      # - name: run as admin
      #   
      #   if: ${{ fromJson(inputs.extras).runasadmin == 'true' }}
      #   shell: bash
      #   run: |
      #     sed -i '/<\/compatibility>/a \
      #           <security> \
      #             <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/> \
      #           </security>' ./flutter/windows/runner/runner.exe.manifest

      - name: Cache Dart/Flutter pub cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: pub-${{ matrix.job.os }}-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            pub-${{ matrix.job.os }}-

      - name: replace flutter icons
        if: ${{ inputs.iconlink != 'false' }}
        
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

     
      - name: Cache vcpkg installed tree + source downloads
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-

      # Exact cache hit -> installed tree already matches this manifest + overlay
      # ports + triplet, so vcpkg install is a no-op; skip it entirely (~0s).
      # Partial hit (restore-keys) -> run install, vcpkg resumes the delta from
      # the restored downloads/installed instead of rebuilding everything.
      - name: Install vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        shell: bash
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            echo "::group::vcpkg install attempt $i"
            if $VCPKG_ROOT/vcpkg install \
              --triplet ${{ matrix.job.vcpkg-triplet }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "attempt $i failed, retrying in 30s (vcpkg resumes completed ports)"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Verify vcpkg deps (cache-hit path)
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -d "$VCPKG_ROOT/installed" || { echo "::error::vcpkg installed tree missing after cache restore"; exit 1; }
          echo "vcpkg deps restored from cache OK"

      - name: session-tab connection mode always visible (v94)
        shell: bash
        run: |
          # v94 (REQ-v94-001, design D): keep the secure/direct shield hover but
          # show only the fingerprint; insert an always-visible connection-mode
          # Text (msgConn) between the shield and the peerId label in
          # flutter/lib/desktop/pages/remote_tab_page.dart so the mode is no
          # longer hover-only (touch / quick-glance observability). Idempotent
          # via the 'prod-line v94 tab-conn-badge' marker.
          # [v170] add-to-ab auto rename + desktop toolbar toggles
          python3 patches/patch_add_to_ab_rename.py .
          python3 patches/patch_peer_card_alias.py .
          python3 patches/patch_desktop_toolbar_toggles.py .
          python3 patches/patch_add_address_book.py .
          python3 patches/iroh/iroh_badge.py .

      - name: Both-mode peer-tab sidebar collapsed by default (V258)
        if: env.UI_VARIANT == 'control_custom'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V258 (both-mode only): the "Address book" tags panel and the
          # "Accessible devices" (MyGroup) left list start COLLAPSED; the
          # shared sidebar button in the peer-tab toolbar expands them with a
          # single shared state (confirmed scope). The tab glyph bump
          # 18 -> 22 comes from patch_peer_tab_style.py above.
          # peer_tab_page.dart / address_book.dart / my_group.dart are SHARED
          # files, so this stays gated on UI_VARIANT == 'control_custom'.
          # MUST run after patch_add_address_book.py (V256/V257 ab toolbar).
          python3 patches/patch_both_sidebar.py .
          grep -q "offstage: hideAbTagsPanel.value," flutter/lib/common/widgets/my_group.dart || { echo "[FAIL] v258: MyGroup left list is not collapsible"; exit 1; }
          grep -q "final hideAbTagsPanel = true.obs;" flutter/lib/common/widgets/address_book.dart || { echo "[FAIL] v258: ab tags panel is not collapsed by default"; exit 1; }
          grep -q "PeerTabIndex.group.index," flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] v258: sidebar toggle not reachable from the devices tab"; exit 1; }
          grep -q "size: 22," flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] v258: tab glyphs not enlarged to 22"; exit 1; }
          grep -q "Toggle Sidebar" src/lang/cn.rs || { echo "[FAIL] v258: cn.rs is missing the Toggle Sidebar key"; exit 1; }
          echo "[OK] V258: both-mode sidebars collapsed by default, tab glyphs enlarged"
      - name: Drag local files into remote session (V104)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V104: 主控机文件直接拖入已连接的远程会话即传输到远端当前目录。
          # 远程会话 body 挂 DropTarget（desktop_drop 已是正式依赖），拖入后经现有
          # kWindowConnect IPC 把路径交给主窗口，主窗口打开该文件传输会话（FT 窗口
          # 保持可见，用其原生缩小版进度卡），由文件传输页复用「发送」按钮链路
          # 自动上传（静默，无授权弹窗）。
          # 必须放在所有 *_both / _new / _old 布局文件 cp 覆盖之后，否则注入被覆盖。
          python3 patches/patch_remote_drop_file.py .
          grep -q "_onDropFilesToRemote" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing drop handler"; exit 1; }
          # Fallback entry: UIPI blocks drag-drop into elevated (admin) windows, so the
          # "Send File" button is the path that always works. Do not drop this.
          grep -q "_buildSendFileButton" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing send-file fallback button"; exit 1; }
          grep -q "sendLocalPathsToRemote" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing auto-send"; exit 1; }
          # Files must be forwarded through IPC all the way to the FT sub-window's
          # own isolate map (Dart isolates do NOT share static globals).
          grep -q "params\['files'\] = files" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart missing files forwarding"; exit 1; }
          grep -q "pendingFiles" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing pendingFiles field"; exit 1; }
          grep -q "pendingFiles" flutter/lib/desktop/pages/file_manager_tab_page.dart || { echo "[FAIL] file_manager_tab_page.dart missing pendingFiles forwarding"; exit 1; }
          # FT window is opened visible (native progress card) by the drop handler; the
          # injected [V104-drop] marker confirms the drop -> FT-window wiring landed.
          grep -q "\[V104-drop\]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart missing drop -> FT window wiring"; exit 1; }
          # Sub-window plugin registration is what actually makes DropTarget work
          # inside the remote session window (a separate FlutterEngine).
          grep -q "DesktopDropPluginRegisterWithRegistrar" flutter/windows/runner/flutter_window.cpp || { echo "[FAIL] flutter_window.cpp missing desktop_drop sub-window registration"; exit 1; }
          echo "[OK] V104 remote-session drop-file transfer (visible FT window + silent upload)"

      - name: Controlled-side desktop redirection-aware drop target (V107 desktop-redirect)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        run: |
          # [V107-desktop-redirect] Feature ABANDONED (eighth round): the user
          # dropped desktop-redirection to cut code bloat. patch_desktop_redirect.py
