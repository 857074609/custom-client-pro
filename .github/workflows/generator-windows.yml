      - name: Apply QR code payload patch (v138)
        if: inputs.ui_mode == 'true' && fromJson(inputs.extras).enableQrCode == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Custom UI only (ui_mode): the QR connection-info band on the
          # incoming-only home page. Rust encrypts ID / temporary password /
          # network info / iroh NodeId with a key derived from the preset
          # password; Dart renders it with qr_flutter between the security-code
          # area and the Quit/Copy row, refreshing every 5 s (unattended boxes
          # have no keyboard or mouse to press refresh, and the temporary
          # password is rotated after every authorized session).
          # Gating: services.py forces ui_mode=False for direction in
          # (outgoing, both), so ui_mode=true always means incoming; Dart adds an
          # isIncomingOnly guard on top of that.
          # The anchor deliberately avoids `buildPasswordBoard(context),`:
          # patch_direct_access.py inserts the optional IP-direct line right
          # after it, which would break that anchor when the IP board is enabled.
          python3 patches/patch_qr_code.py .
          test -f src/qr_payload.rs || { echo "[FAIL] src/qr_payload.rs was not created"; exit 1; }
          grep -q "pub mod qr_payload;" src/lib.rs || { echo "[FAIL] src/lib.rs is missing pub mod qr_payload"; exit 1; }
          grep -q 'qr-payload' src/flutter_ffi.rs || { echo "[FAIL] flutter_ffi.rs is missing the qr-payload branch"; exit 1; }
          grep -q 'aes-gcm' Cargo.toml || { echo "[FAIL] Cargo.toml is missing the aes-gcm dependency"; exit 1; }
          grep -q '"aes-gcm",' Cargo.lock || { echo "[FAIL] Cargo.lock does not list aes-gcm for rustdesk (--locked would fail)"; exit 1; }
          grep -q "injected_permanent_password" libs/hbb_common/src/config.rs || { echo "[FAIL] config.rs is missing the preset-password getter"; exit 1; }
          grep -q "fn b64url" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs is missing the base64url encoder"; exit 1; }
          grep -q "qr-payload-force" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs is missing the force-refresh branch"; exit 1; }
          grep -q "fn join_qr_html" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs is missing the join_qr_html helper"; exit 1; }
          grep -q 'Config::get_option("api-server")' src/qr_payload.rs || { echo "[FAIL] qr_payload.rs does not read the api-server option (v140)"; exit 1; }
          if grep -q "custom-rendezvous-server" src/qr_payload.rs; then echo "[FAIL] qr_payload.rs still falls back to the rendezvous server (v140 dropped it)"; exit 1; fi
          grep -q "prod-line v140" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs base_url is not the v140 api-server chain"; exit 1; }
          grep -q "if (isIncomingOnly) const _ConnectionQrBoard()," flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] QR band is not mounted on the incoming-only branch"; exit 1; }
          grep -q "class _ConnectionQrBoard extends StatefulWidget" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart is missing the _ConnectionQrBoard widget"; exit 1; }
          grep -q "Timer.periodic" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] QR band is missing its auto-refresh timer"; exit 1; }
          grep -q "_kQrSize = 164.0" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] QR size constant is missing"; exit 1; }
          grep -q "qr_flutter" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart is missing the qr_flutter import"; exit 1; }
          grep -q "prod-line v139" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] QR board background not matched to UI theme"; exit 1; }
          echo "[OK] v138 QR connection-info band injected"

