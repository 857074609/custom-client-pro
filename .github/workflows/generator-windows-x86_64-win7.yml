      - name: Apply patches for fix__updateWindowSize
        if: ${{(env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download') && inputs.ui_mode == 'false' }}
        run: |
          python3 patches/fix__updateWindowSize.py

      - name: Apply both-mode home window size floor
        # direction=both 主界面顶部为左右并排两张卡片，右卡 5 个操作按钮
        # （邀请/查看/摄像头/控制/下拉）需要约 1000px 窗口宽度才能排在一行；
        # 上游默认 800x600 会把它挤成两行。该补丁只在运行时命中
        # both 模式时放大窗口并居中（不可用 isCustomClient 做门：定制构建里
        # disabled_custom_client.py 让它恒为 false），
        # incoming / outgoing 不受影响。
        run: |
          python3 patches/patch_home_window_size.py
          grep -q "kLnDeskHomeMinWidth" ./flutter/lib/main.dart || { echo "[FAIL] v145: both-mode home window size floor not injected"; exit 1; }
          grep -q -F '!bind.isIncomingOnly() && !bind.isOutgoingOnly()' ./flutter/lib/main.dart || { echo "[FAIL] v145: size floor guard is not the both-mode test"; exit 1; }
      
      
      #- name: custom Security Alert fontSize
      #  
       # shell: bash
       # run: |
        #  sed -i 's/^\([[:space:]]*\)color: Colors\.yellow,/\1\/\/ color: Colors.yellow,/' ./flutter/lib/common.dart
         # sed -i '/style: TextStyle(color: Colors\.red),/a\    textAlign: TextAlign.center,'  ./flutter/lib/common.dart
          #sed -i 's/\(style: TextStyle(color: Colors\.red\)\([),]\)/\1, fontSize: 18\2/g' ./flutter/lib/common.dart
          #sed -i '/if (bind\.mainGetBuildinOption(key: kOptionRemovePresetPasswordWarning) !=/,/^  }$/d' ./flutter/lib/common.dart
        #  sed -i '/fontSize:/ { N; s/18,/16,/; }' ./flutter/lib/common.dart
            
      - name: Apply domestic STUN fallback (multi-level)
        # 国内优先 + 国外兜底的 STUN 注入到客户端（NAT 探测 common.rs + WebRTC ICE webrtc.rs 两条路径），
        # 修复国内网络下默认国外 STUN 慢/被墙导致 P2P 打洞失败、只能走中继或连接失败的问题。
        # 必须对所有构建类型生效（原先只在 direction=both && hide_sensitive_ui 时运行，普通构建仍是国外 STUN）。
        shell: bash
        run: |
          python3 patches/hand_stun.py

      - name: Set server
        shell: bash
        run: |
          python3 patches/set_server.py

      - name: Apply compile-time server lock (OVERWRITE_SETTINGS)
        # Compiles ID/key/api/relay servers into the OVERWRITE_SETTINGS static
        # (highest option priority): locked, overrides saved RustDesk2.toml,
        # no sidecar custom_.txt server fields. set_server.py above stays as
        # the DEFAULT-layer fallback.
        shell: bash
        run: |
          python3 patches/patch_server_lock_compiletime.py

      - name: Apply permanent password patch
        shell: bash
        run: |
          VER="${{ env.VERSION }}"
          python3 patches/patch_permanent_password_new.py

      - name: Apply QR code payload patch (v138)
        if: inputs.ui_mode == 'true' && fromJson(inputs.extras).enableQrCode == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Custom UI only (ui_mode): the QR connection-info band on the
          # incoming-only home page. Rust encrypts ID / temporary password /
          # network info / iroh NodeId with a key derived from the preset
          # password; Dart renders it with qr_flutter between the security-code
          # area and the Quit/Copy row, refreshing every 5 s (unattended boxes
          # have no keyboard or mouse to press refresh, and the temporary
          # password is rotated after every authorized session).
          # Gating: services.py forces ui_mode=False for direction in
          # (outgoing, both), so ui_mode=true always means incoming; Dart adds an
          # isIncomingOnly guard on top of that.
          # The anchor deliberately avoids `buildPasswordBoard(context),`:
          # patch_direct_access.py inserts the optional IP-direct line right
          # after it, which would break that anchor when the IP board is enabled.
          python3 patches/patch_qr_code.py .
          test -f src/qr_payload.rs || { echo "[FAIL] src/qr_payload.rs was not created"; exit 1; }
          grep -q "pub mod qr_payload;" src/lib.rs || { echo "[FAIL] src/lib.rs is missing pub mod qr_payload"; exit 1; }
          grep -q 'qr-payload' src/flutter_ffi.rs || { echo "[FAIL] flutter_ffi.rs is missing the qr-payload branch"; exit 1; }
          grep -q 'aes-gcm' Cargo.toml || { echo "[FAIL] Cargo.toml is missing the aes-gcm dependency"; exit 1; }
          grep -q '"aes-gcm",' Cargo.lock || { echo "[FAIL] Cargo.lock does not list aes-gcm for rustdesk (--locked would fail)"; exit 1; }
          grep -q "injected_permanent_password" libs/hbb_common/src/config.rs || { echo "[FAIL] config.rs is missing the preset-password getter"; exit 1; }
          grep -q "fn b64url" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs is missing the base64url encoder"; exit 1; }
          grep -q "qr-payload-force" src/qr_payload.rs || { echo "[FAIL] qr_payload.rs is missing the force-refresh branch"; exit 1; }
