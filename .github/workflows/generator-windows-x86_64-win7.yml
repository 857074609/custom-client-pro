name: Custom Windows_7 Client Generator
run-name: Custom Windows_7 Client Generator
on: 
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: string
      serverinfo:
        description: 'serverinfo'
        required: true
        type: string
      custom:
        description: "Custom JSON"
        required: true
        default: ''
        type: string
      uuid:
        description: "uuid of request"
        required: true
        default: ''
        type: string
      ui_mode:
        description: "Custom User Interface"
        required: false
        type: string
      screen_wall:
        description: "Enable Screen Wall (multi-view window)"
        required: false
        default: 'false'
        type: string

      iconlink:
        description: "icon link"
        required: false
        default: 'false'
        type: string
      logolink:
        description: "logo link"
        required: false
        default: 'false'
        type: string
      appname:
        description: "app name"
        required: true
        default: 'rustdesk'
        type: string
      filename:
        description: "Filename"
        required: true
        default: 'rustdesk'
        type: string
      extras:
        description: "extra inputs in json"
        required: true
        default: '{}'
        type: string


env:
  SCITER_RUST_VERSION: "1.78.0" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # non-iroh route; 1.75 old toolchain (no iroh MSRV pressure). NOTE: *-win7-* rust-std was NEVER on stable channels (Tier 3), so the default pc-windows-msvc target is used.
  MAC_RUST_VERSION: "1.81.0" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ fromJson(inputs.extras || '{}').version || 'master' }}"
  RUSTDESK_BUILD_NUMBER: "${{ fromJson(inputs.extras || '{}').build_number || '0' }}"
  NDK_VERSION: "r27c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"
  GENURL: ${{ secrets.GENURL }}
  WS_PORT: "${{ fromJson(inputs.extras || '{}').ws_port || '' }}"
  


jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    secrets: inherit
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10




  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
     
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set gdpro value
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> "$GITHUB_ENV"


      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.VERSION == 'master' && 'master' || format('refs/tags/{0}', env.VERSION) }}
          submodules: recursive
          fetch-depth: 1
      

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout patches scripts
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          path: patches 
          token: ${{ secrets.REPO }}
          ref: d7561f508ee7cd095e11cb661ce72d4dff92ff94

      - name: Install invite Dart module (build contract, no watcher)
        shell: bash
        run: |
          # [v216-fix] desktop_home_page_new.dart / connection_page_both.dart 都会 import
          # 'package:flutter_hbb/common/invite.dart'，而该模块原先只由 patch_invite.py(v143)
          # 在「启用邀请」勾选时才安装 → 取消勾选时 flutter_assemble 必失败：
          #   connection_page.dart(10,8): error GFAA2A68C: Error when reading
          #   'lib/common/invite.dart': The system cannot find the file specified.
          # 本步骤只安装 Dart 模块 + local_notifier 依赖，**不改 main.dart**，
          # 因此 startInviteWatcher() 永不触发；邀请功能仍由 addinvite 复选框独占控制。
          APPNAME="${{ inputs.appname }}"
          if [ -z "$APPNAME" ] || [ "$APPNAME" = "rustdesk" ]; then APPNAME="RustDesk"; fi
          python3 patches/patch_invite_module.py . "$APPNAME"
          test -f flutter/lib/common/invite.dart || { echo "[FAIL] invite.dart not installed"; exit 1; }
          test -f flutter/lib/common/brand.dart  || { echo "[FAIL] brand.dart not installed"; exit 1; }
          grep -q "kBrandAppName" flutter/lib/common/invite.dart || { echo "[FAIL] invite.dart lost the kBrandAppName reference"; exit 1; }
          echo "[OK] invite Dart module + brand.dart installed (watcher not started)"

      - name: Apply activate_os no-right-click patch
        run: python3 patches/patch_activate_os_fix.py .
      - name: Apply connection text patch
        run: python3 patches/patch_connection_text.py .

      - name: Apply clipboard session sync patch
        run: python3 patches/patch_clipboard_session_sync.py .
      - name: Apply audio playback refactor patch
        run: python3 patches/patch_audio_playback_refactor.py .
      
      - name: Report Status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u73af\u5883\u51c6\u5907\u5c31\u7eea\uff0c\u5f00\u59cb\u5356\u529b\u5de5\u4f5c"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      
      - name: Decrypt and mask secrets
        id: decrypt
        shell: bash
        env:
          SERVERINFO: ${{ github.event.inputs.serverinfo }}
          BUILD_SECRET_KEY: ${{ secrets.BUILD_SECRET_KEY }}
          EXTRAS_JSON: ${{ inputs.extras }}
        run: |
          set +x
          SI="${{ github.event.inputs.serverinfo }}"
          if [ -z "$SI" ] || [ "$SI" = "placeholder" ]; then
            echo "::warning::serverinfo empty/placeholder -> no custom server from serverinfo"
          else
            pip install cryptography
          fi
          python -c "
          import os, json, sys
          try:
              from cryptography.fernet import Fernet
          except Exception:
              Fernet = None
          data = {}
          SI = os.environ.get('SERVERINFO','')
          if SI and SI != 'placeholder' and Fernet is not None:
              try:
                  key = os.environ['BUILD_SECRET_KEY'].encode()
                  data = json.loads(Fernet(key).decrypt(SI.encode()).decode())
              except Exception as e:
                  print('::warning::serverinfo decrypt failed ('+str(e)+') -> ignoring')
          # extras fallback (non-secret; never overrides real serverinfo values)
          ex_raw = os.environ.get('EXTRAS_JSON','')
          if ex_raw:
              try:
                  ex = json.loads(ex_raw)
                  for k in ('server','RS_PUB_KEY','apiServer'):
                      if ex.get(k) and not data.get(k):
                          data[k] = ex[k]
              except Exception:
                  pass
          for field in ['server','RS_PUB_KEY','apiServer','irohRelayUrl','permanentPassword','unlockPin','urlLink','downloadLink','updateLink']:
              v = data.get(field)
              if v: print('::add-mask::' + v)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write(f\"CUSTOM_SERVER={data.get('server','')}\n\")
              e.write(f\"CUSTOM_KEY={data.get('RS_PUB_KEY','')}\n\")
              e.write(f\"CUSTOM_APISERVER={data.get('apiServer','')}\n\")
              e.write(f\"IROH_RELAY_URL={data.get('irohRelayUrl','')}\n\")
              e.write(f\"PERMANENT_PASSWORD={data.get('permanentPassword','')}\n\")
              e.write(f\"UNLOCK_PIN={data.get('unlockPin','')}\n\")
              e.write(f\"URL_LINK={data.get('urlLink','')}\n\")
              e.write(f\"DOWNLOAD_LINK={data.get('downloadLink','')}\n\")
              e.write(f\"UPDATE_LINK={data.get('updateLink','')}\n\")
          "

      - name: Display last
        shell: bash
        run: |
          echo "CUSTOM_SERVER suffix:  ${CUSTOM_SERVER: -5}"
          echo "CUSTOM_KEY suffix:  ${CUSTOM_KEY: -5}"
          echo "CUSTOM_APISERVER suffix:  ${CUSTOM_APISERVER: -5}"
          echo "UNLOCK_PIN suffix:  ${UNLOCK_PIN: -1}"
          echo "PERMANENT_PASSWORD suffix:  ${PERMANENT_PASSWORD: -2}"
          echo "IROH_RELAY_URL present:  ${IROH_RELAY_URL:+yes}"
      
      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      
      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: Extract conn-type (client type)
        id: conn
        shell: pwsh
        run: |
          $c = "${{ inputs.custom }}"
          $t = "default"
          if ($c -eq "") {
              Write-Host "::warning::Input is empty, using default conn-type: $t"
          } else {
              try {
                $bytes = [System.Convert]::FromBase64String($c)
                  $jsonStr = [System.Text.Encoding]::UTF8.GetString($bytes)
                  $obj = $jsonStr | ConvertFrom-Json

                  if ($null -ne $obj.'conn-type' -and $obj.'conn-type' -ne "") {
                      $t = $obj.'conn-type'
                      Write-Host "Successfully extracted conn-type: $t"
                  } else {
                      Write-Host "::warning::'conn-type' field is missing or empty in input JSON"
                  }
              } catch {
                  Write-Host "::error::Failed to parse custom input. Error: $($_.Exception.Message)"
                  $t = "default"
              }
          }
          $sanitized = $t -replace '[^a-zA-Z0-9_.-]', '_'
          if ($sanitized -ne $t) {
              Write-Host " Sanitized conn-type from '$t' to '$sanitized'"
              $t = $sanitized
          }
          "conn=$t" >> $env:GITHUB_OUTPUT
          "CLIENT_TYPE=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host " Final conn-type output: $t"

      - name: Resolve UI variant
        shell: bash
        run: |
          # [LnDesk v152] single gate for every interface-variant step.
          if [ "${{ inputs.ui_mode }}" != "true" ]; then
            echo "UI_VARIANT=upstream" >> $GITHUB_ENV
          elif [ "$CLIENT_TYPE" = "incoming" ]; then
            echo "UI_VARIANT=incoming_custom" >> $GITHUB_ENV
          else
            echo "UI_VARIANT=control_custom" >> $GITHUB_ENV
          fi
          grep UI_VARIANT $GITHUB_ENV

      - name: S1 Apply incoming custom UI
        if: env.UI_VARIANT == 'incoming_custom'
        shell: bash
        run: |
          mkdir -p src/lang/
          mkdir -p flutter/lib/desktop/pages/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs

          VER="${{ env.VERSION }}"
          echo "Building version: $VER"
          cp -f patches/desktop_home_page_new.dart flutter/lib/desktop/pages/desktop_home_page.dart
          grep -q "_buildInviteButton" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] S1: desktop_home_page_new.dart not installed"; exit 1; }
          echo "[OK] S1: incoming custom UI applied"

      - name: Use the customized language files (upstream + incoming)
        if: env.UI_VARIANT == 'upstream' && env.CLIENT_TYPE == 'incoming'
        shell: bash
        run: |
          # [LnDesk v166] The upstream variant compiles the stock upstream
          # src/lang/cn.rs, which carries none of the LnDesk keys: the invite /
          # share dialogs live in invite.dart and every one of their translate()
          # keys would fall back to English. Reuse the customized language files
          # here too, so the upstream incoming build is localized exactly like
          # the custom one. patches/en.rs is a full replacement as well (it also
          # restores the upstream-only install/upgrade tips that the custom
          # builds never needed).
          mkdir -p src/lang/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs
          grep -qF '("Invite an administrator"' src/lang/cn.rs || { echo "[FAIL] v166: cn.rs lacks the invite dialog keys"; exit 1; }
          grep -qF '("The recipient opens the link in a browser and connects from the web client (valid for 30 minutes)."' src/lang/cn.rs || { echo "[FAIL] v166: cn.rs lacks the share hint key"; exit 1; }
          echo "[OK] v166: customized cn.rs / en.rs applied to the upstream variant"

      - name: Enable share button (upstream)
        if: fromJson(inputs.extras).addshare == 'true' && env.UI_VARIANT == 'upstream' && env.CLIENT_TYPE == 'incoming'
        shell: bash
        run: |
          # [LnDesk v166] Runs FIRST: it creates the shared Row that the invite
          # and copy scripts append themselves to, in that order
          # (Share -> Invite -> Copy -- same order as the custom home page).
          python3 patches/patch_share_button_uimode_false.py .
          grep -qF "[LnDesk share button]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v152: upstream share button not injected"; exit 1; }
          grep -qF '("Share", "分享")' src/lang/cn.rs || { echo "[FAIL] v152: cn.rs lacks the Share key"; exit 1; }
          echo "[OK] v152: upstream share button applied"

      - name: Enable invite button (upstream)
        if: fromJson(inputs.extras).addinvite == 'true' && env.UI_VARIANT == 'upstream' && env.CLIENT_TYPE == 'incoming'
        shell: bash
        run: |
          python3 patches/patch_invite_button_uimode_false.py .
          grep -qF "[LnDesk invite button]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v152: upstream invite button not injected"; exit 1; }
          grep -qF '("Invite", "邀请")' src/lang/cn.rs || { echo "[FAIL] v152: cn.rs lacks the Invite key"; exit 1; }
          echo "[OK] v152: upstream invite button applied"

      - name: Add Copy key (upstream)
        if: fromJson(inputs.extras).addcopy == 'true' && env.UI_VARIANT == 'upstream' && env.CLIENT_TYPE == 'incoming'
        shell: bash
        run: |
          # [LnDesk v166] Runs AFTER share/invite on purpose: the three upstream
          # entries share one Row in the custom home page's order
          # (Share -> Invite -> Copy), and each script appends itself at the
          # previous script's end marker. The upstream page has no
          # COPY_BUTTON_CONTROL marker, so a script (not sed) injects it.
          python3 patches/patch_add_copy_button_uimode_false.py .
          grep -qF "[LnDesk copy button]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v166: upstream copy button not injected"; exit 1; }
          grep -qF '("Copy ID & Password"' src/lang/cn.rs || { echo "[FAIL] v166: cn.rs lacks the Copy ID & Password key"; exit 1; }
          echo "[OK] v166: upstream copy button applied (one click copies ID + password + IP + iroh)"

      - name: Apply window size guard (upstream + incoming)
        if: env.UI_VARIANT == 'upstream' && env.CLIENT_TYPE == 'incoming'
        shell: bash
        run: |
          # [LnDesk v152] ported from desktop_home_page_quick.dart: keep the
          # settings tab from being squeezed back to the home auto-fit size
          # after a theme/language tree rebuild.
          python3 patches/patch_window_size_guard_uimode_false.py .
          grep -qF "[LnDesk window size guard]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v152: window size guard not injected"; exit 1; }
          echo "[OK] v152: window size guard applied"


      - name: Replace desktop_home_page for direction=both
        if: env.UI_VARIANT == 'control_custom'
        shell: bash
        run: |
          # direction=both 专属 UI：仅在「连接类型=both」且「勾选隐藏左侧面板(hide_sensitive_ui)」
          # 同时满足时触发。与上方「Replace custom patch files」同类机制（直接 cp 覆盖
          # desktop_home_page.dart），仅触发条件不同（需 both + 隐藏左侧面板，而非 ui_mode=='true'）。
          # desktop_home_page_both.dart 已在 patches/ 中烘焙好（隐藏左面板 + 上部左右两卡片：
          # 左=本机信息(ID/验证码/网络信息)，右=控制远程桌面；下部=设备列表+就绪状态）。
          # 本机信息卡片内 ID 常显，验证码/网络信息默认折叠，点「显示」展开。
          # 注意：direction in ("outgoing","both") 时 services.py 强制 ui_mode=False，
          # 故本步骤独立于「Replace custom patch files」（其被 ui_mode 门控跳过）运行。
          # 网络信息是否显示完全取决于是否勾选「内网 IP 直连看板」(ip_direct_board)：
          # 勾选则 patch_direct_access 写入 lan-ip 供本框读取；未勾选则本框显示为空。
          # 注意：ui_mode 被 services.py 强制 False 时，「Replace custom patch files」步骤被跳过，
          # 不会 cp 中英文语言文件；故本步骤须自行 cp，否则 desktop_home_page_both.dart
          # 用到的 translate("Local Info"/"IP Direct"/"Show Network Info"/"Double-click to copy" 等)
          # 在中文环境会回显英文 key。patches/en.rs / cn.rs 已含这些 key。
          # UI_MODE_BOTH 布局依赖 connection_page_both.dart 拆分 ConnectionPage 的顶部卡片
          # 与底部设备列表，因此需同步 cp 覆盖 connection_page.dart。
          mkdir -p flutter/lib/desktop/pages/
          cp -f patches/desktop_home_page_both.dart flutter/lib/desktop/pages/desktop_home_page.dart
          # UI_MODE_BOTH 上下布局：同时替换 connection_page.dart，拆出顶部卡片与底部列表
          cp -f patches/connection_page_both.dart flutter/lib/desktop/pages/connection_page.dart
          # [v224-fix5] both 模板同时用到两代 url_launcher API：
          #   url_launcher.dart        -> launchUrl / LaunchMode（官网按钮）
          #   url_launcher_string.dart -> canLaunchUrlString / launchUrlString（onUsePublicServerGuide）
          # 缺任一都会让 flutter analyze 报 undefined_method。
          grep -q "url_launcher_string.dart" flutter/lib/desktop/pages/connection_page.dart || { echo "[FAIL] v224-fix5: url_launcher_string import missing (canLaunchUrlString/launchUrlString)"; exit 1; }
          grep -q "package:url_launcher/url_launcher.dart" flutter/lib/desktop/pages/connection_page.dart || { echo "[FAIL] v224-fix5: url_launcher import missing (launchUrl/LaunchMode)"; exit 1; }
          # UI_MODE_BOTH 扁平化：设备卡片默认 1px 细边框 + 透明背景，与窗口背景形成层次感
          cp -f patches/peer_card_both.dart flutter/lib/common/widgets/peer_card.dart
          # [v120] Accessible devices tab: assert the address-book alias helper is present.
          grep -q "_accessibleDeviceTitle" flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] v120: accessible-device address-book alias helper (_accessibleDeviceTitle) missing"; exit 1; }
          # UI_MODE_BOTH: "查看"按钮需远程桌面窗口初始化时强制置为 view-only，
          # 通过临时全局 option 传递，避免轮询时序不可靠。
          cp -f patches/remote_page_both.dart flutter/lib/desktop/pages/remote_page.dart
          mkdir -p src/lang/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs
          # [v117 bug2] "控制" must force view_only=N. The persisted read-only state is
          # PeerConfig.view_only (a TOP-LEVEL typed field), NOT PeerConfig.options
          # ["view_only"] -- mainSetPeerOption only writes the generic options table, so
          # writing it there is a silent no-op. The real reset has to happen inside the
          # session (sessionToggleOption('view-only') persists back to PeerConfig), so
          # onControl() only arms a one-shot flag that the remote window consumes.
          # Assert both halves landed, otherwise the button silently stays read-only.
          grep -q "kForceControlLaunch" flutter/lib/desktop/pages/connection_page.dart || { echo "[FAIL] v117 control button does not arm force-control-launch"; exit 1; }
          grep -q "force-control-launch" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] v117 remote window does not consume force-control-launch"; exit 1; }
          if grep -qF "mainSetPeerOption(id: targetId, key: 'view_only'" flutter/lib/desktop/pages/connection_page.dart; then
            echo "[FAIL] v117 control button still relies on the no-op options-table write"
            exit 1
          fi
          grep -q "copyPill" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v227c: copyPill missing (single top-right copy reverted)"; exit 1; }
          grep -q "mainUpdateTemporaryPassword" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] v227c: temp-password refresh button missing"; exit 1; }
          echo "[OK] direction=both: 已替换 desktop_home_page.dart + connection_page.dart + peer_card.dart 并覆盖中英文语言文件"

      - name: Apply main-interface security lock (home-lock)
        if: fromJson(inputs.extras).enableHomeLock == 'true' && env.UI_VARIANT == 'control_custom'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 主界面安全锁：打开需 PIN；无远程会话且本地键鼠空闲 3 分钟自动锁定；密码复用 PIN。
          # 仅 both/outgoing（主控型）的 windows/win7 生效；PIN 未设置时注入的闸门自动失效。
          python3 patches/patch_home_lock.py .
          grep -q "prod-line home-lock" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] home-lock: gate was not injected"; exit 1; }
          grep -q "_HomeLockGate" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] home-lock: _HomeLockGate missing"; exit 1; }
          echo "[OK] home-lock applied"

      # === [V217] 网络加固（自 generator-windows.yml 对齐）===
      # 以下三步此前仅存在于 generator-windows.yml，win7 工作流完全缺失，
      # 导致 win7 产物缺少 TCP keepalive / DNS 缓存 / happy-eyeballs 并发连接能力：
      #   - NAT 网关静默丢弃空闲会话 -> 表现为「假在线」，重连才恢复；
      #   - 双栈域名(A+AAAA)顺序迭代，每个地址死等 CONNECT_TIMEOUT(18s)；
      #   - DDNS 主机换 IP 后被 OS DNS 缓存钉死在旧地址，客户端持续拨空。
      # 三者均锚定上游 1.4.9 原始状态，必须先于其他补丁运行；锚点缺失即构建失败。
      # 已离线干跑验证（纯净 1.4.9 + 完整 hbb_common）全部 exit 0，断言全绿。

      - name: Inject TCP keepalive + DNS cache (v98)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # v98 网络加固（移植自 HopToDesk 官方 1.46.40）：
          # 1) patch_tcp_keepalive.py：所有出站纯 TCP 连接（rendezvous/hbbs_http/直连/中继）
          #    与 direct_server 入站连接启用内核级 keepalive（30s 空闲/10s 间隔），
          #    解决 NAT 网关静默丢空闲会话导致的"假在线"。
          # 2) patch_dns_cache.py：hbbs 域名解析结果缓存 300s + 多地址轮询回退，
          #    全部失败时自动清缓存强制重解析。
          # 二者均锚定上游 1.4.9 原始状态，必须先于其他补丁运行；锚点缺失即构建失败。
          python3 patches/patch_tcp_keepalive.py .
          grep -q "pub fn set_tcp_keepalive" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs 缺少 set_tcp_keepalive"; exit 1; }
          grep -q "prod-line keepalive" libs/hbb_common/src/tcp.rs || { echo "[FAIL] tcp.rs 缺少 keepalive 标记"; exit 1; }
          python3 patches/patch_dns_cache.py .
          grep -q "pub async fn resolve_cached" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs 缺少 resolve_cached"; exit 1; }
          grep -q "prod-line dns-cache" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs 缺少 dns-cache 标记"; exit 1; }
          echo "[OK] v98 TCP keepalive + DNS cache 注入完成"

      - name: Inject happy-eyeballs concurrent connect (V101)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V101: FramedStream::new RFC 6555 并发连接竞速。
          # 修复双栈域名(A+AAAA)下顺序迭代、每个地址死等 CONNECT_TIMEOUT(18s) 的卡顿：
          # 解析出的所有地址并发 connect（250ms 探测），先通者胜、其余取消；
          # 全失败时回退传统顺序连接（保留单地址慢路径语义）。
          # 锚定上游 1.4.9 原始状态，标记缺失即构建失败。
          # 注意：当前 connect_tcp_local 仍逐个传单 IP 给 FramedStream::new，
          # 故 race 退化为单次 connect（V102 会把 race 上提到 connect_tcp_local 层）。
          python3 patches/patch_FramedStream_happy_eyeballs.py .
          grep -q "race_connect_all" libs/hbb_common/src/tcp.rs || { echo "[FAIL] tcp.rs missing race_connect_all"; exit 1; }
          grep -q "prod-line v101 happy-eyeballs" libs/hbb_common/src/tcp.rs || { echo "[FAIL] tcp.rs missing v101 marker"; exit 1; }
          echo "[OK] V101 happy-eyeballs concurrent connect injected"

      - name: Inject happy-eyeballs lift + DNS timeout + split metrics (V102)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V102: lift happy-eyeballs race to connect_tcp_local (V101's inner race
          # degenerates when fed a single IP) + cap DNS lookups with a 5s timeout
          # (a dead resolver could otherwise stall connect past CONNECT_TIMEOUT) +
          # log DNS-resolve time and connect-race time separately for diagnosis.
          # Requires V101 already injected (FramedStream::new present). Anchors are
          # unique single-occurrence strings; marker missing -> build fails.
          python3 patches/patch_V102_happy_eyeballs_lift.py .
          grep -q "prod-line v102 happy-eyeballs-lift" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing v102 marker"; exit 1; }
          grep -q "DNS_LOOKUP_TIMEOUT_SEC" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing DNS_LOOKUP_TIMEOUT_SEC"; exit 1; }
          # [LnDesk dns-flush] A DDNS host that moved to a new IP stays pinned inside
          # the OS resolver cache (Windows Dnscache honours the A-record TTL), so the
          # client keeps dialling the dead address and never reconnects. Verify the
          # flush hook actually shipped -- at patch time, not 40 minutes into the build.
          grep -q "pub fn flush_os_dns_cache" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing flush_os_dns_cache"; exit 1; }
          grep -q "DnsFlushResolverCache" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing DnsFlushResolverCache FFI"; exit 1; }
          grep -qF "[dns-flush] OS resolver cache flushed" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing the dns-flush log marker"; exit 1; }
          grep -q "flush_os_dns_cache();" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs: the dns-flush hook is defined but never called"; exit 1; }
          echo "[OK] V102 happy-eyeballs lift + DNS timeout injected"
          echo "[OK] dns-flush hook verified (OS resolver cache cleared once all addrs fail)"

      - name: Rendezvous family-match DNS probe (v100, IPv6 preferred, default-on)
        if: fromJson(inputs.extras || '{}').super_p2p_enforcement != 'observe' || fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Default-on client-side DNS probe: when enable-dual-stack-lookup is
          # set (or absent, because the "enable-" prefix defaults to enabled) AND
          # the local host has a usable IPv6 stack, resolve AAAA first (500ms
          # ceiling) before falling back to the legacy IPv4 happy-eyeballs path.
          # Set enable-dual-stack-lookup=N to disable.
          # 锚定上游 1.4.9 原始 socket_client.rs，须在 v98/V102 之后运行。
          python3 patches/patch_rendezvous_family_match.py .
          grep -qF "prod-line v100 family-match" libs/hbb_common/src/socket_client.rs || { echo "[FAIL] socket_client.rs missing v100 family-match probe"; exit 1; }
          echo "[OK] V100 rendezvous family-match (IPv6 preferred, default-on DNS probe)"

      - name: Rendezvous family-match settings toggle (v100 UI)
        if: fromJson(inputs.extras || '{}').super_p2p_enforcement != 'observe' || fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Adds a Settings > Network switch ("DNS resolve by address family
          # (IPv6 preferred)") that writes the local config key
          # enable-dual-stack-lookup, which the Rust probe above reads. The
          # "enable-" prefix makes it default-on.
          python3 patches/patch_family_match_setting.py .
          grep -qF "prod-line v100 family-match-ui" flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] desktop_setting_page.dart missing v100 family-match toggle"; exit 1; }
          # [v175] switchWidget() funnels the title and the tooltip through
          # listTile() -> translate(), so the row stays English unless cn.rs
          # carries both strings byte-for-byte. Asserted only when the
          # customized cn.rs is in play: the upstream-only variant compiles the
          # stock upstream file and must not be forced to use ours.
          if grep -qF '[LnDesk v175]' src/lang/cn.rs; then
            grep -qF '("DNS resolve by address family (IPv6 preferred)"' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the family-match toggle title"; exit 1; }
            grep -qF '("Enable IPv6-first DNS resolution for P2P connections.' src/lang/cn.rs || { echo "[FAIL] v175: cn.rs lacks the family-match tooltip"; exit 1; }
          fi
          echo "[OK] V100 rendezvous family-match settings toggle"

      - name: Apply screen wall patch + i18n
        if: inputs.screen_wall == 'true' && env.UI_VARIANT == 'control_custom'
        shell: bash
        env:
          # Windows runner 默认 cp1252，中文 print 会 UnicodeEncodeError；
          # 强制 UTF-8（脚本内也已 reconfigure，双保险）。
          PYTHONIOENCODING: utf-8
        run: |
          # 屏幕墙功能（多设备独立窗口）+ 中英文多语言【同时】注入：
          # patch_screen_wall.py 对上游 1.4.9 源码做锚点注入（新增
          # screen_wall_page.dart / mini_remote_view.dart + 修改 8 个既有文件），
          # 并在 src/lang/en.rs / src/lang/cn.rs 尾部插入屏幕墙 UI 翻译 key
          # （Screen Wall 等 23 组，已存在自动跳过）——勾选"开启屏幕墙"时，
          # 客户端中文环境显示"屏幕墙"、英文环境显示 "Screen Wall"。
          # 任一锚点缺失/歧义即报错退出，构建显式失败。
          python3 patches/patch_screen_wall.py .

          # [screen_wall v137] _peerBrief() uses bind.mainGetPeerOptionSync; `bind`
          # comes from models/platform_model.dart. Base patch now injects the import
          # itself so chains without v107 still compile (win7 runs v107 too since V218); v107 skips its own B1
          # when it is already there. Guard it so a missing import fails here and not
          # halfway through `flutter build windows` ("Undefined name 'bind'").
          grep -q "models/platform_model.dart" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart: missing platform_model import (bind undefined)"; exit 1; }
          echo "[OK] screen wall v137 verified (platform_model import present)"

          # 注入后验证多语言 key 已就位（en.rs/cn.rs 必须含 Screen Wall）
          for f in src/lang/en.rs src/lang/cn.rs; do
            grep -q '"Screen Wall"' "$f" || { echo "[FAIL] $f 缺少 Screen Wall 翻译 key"; exit 1; }
          done
          echo "[OK] 屏幕墙功能 + 多语言（en/cn）注入完成"

          # [v227c] both 模式右卡「屏幕墙」按钮：与 generator-windows.yml 同款注入，
          # 此前 win7 工作流漏了这一步——屏幕墙功能链在包里、右卡按钮却不存在
          # （官网旁边没有屏幕墙，回溯到 18:17 的 windows 生成器构建才有）。
          # 前置："Replace desktop_home_page"（本文件 413 行）已铺 connection_page_both.dart。
          python3 patches/patch_both_screen_wall_button.py .
          grep -qF "[LnDesk v224 screen-wall-btn-import]" flutter/lib/desktop/pages/connection_page.dart || { echo "[FAIL] v227c win7: screen wall button import not injected"; exit 1; }
          echo "[OK] v227c win7: both 右卡屏幕墙按钮已注入"

      - name: Screen wall v107 consolidated chain (multi-instance + preview + add-to-wall + idle exemption)
        if: inputs.screen_wall == 'true' && env.UI_VARIANT == 'control_custom'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # patch_screen_wall_v107.py 整合原 v103/v104/v108/v109 四个补丁（锚点与
          # 执行顺序逐字保留；v104 为空操作占位已被 base 吸收，见
          # Docs/rustdesk-1.4.9/v108/修改方案.md）：
          # - 多实例：最多 10 个屏幕墙窗口（10 墙 × 4 设备 = 40 路），级联错位、
          #   强制深色 + 黑底；第 11 次点击提示"最多打开 10 个屏幕墙"；
          # - 入口预览选择：无指定 wallId 时弹 Dialog 列出已保存屏幕墙（可选新建）；
          # - 设备卡片菜单「Add to Screen Wall」：自动依次填充，满了切下一块；
          # - 屏幕墙为「监控型」会话，服务端豁免「长时间不活动自动断开」。
          # 必须在 "Apply screen wall patch + i18n"（base）之后运行（锚点匹配其产物）。
          # 脚本自带幂等守卫：最终 marker 全部存在时 [SKIP] 退出 0。
          python3 patches/patch_screen_wall_v107.py .
          grep -q "Screen Wall Max 10 Windows" flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] peer_tab_page.dart 缺少 v103 多实例入口"; exit 1; }
          grep -q "Device Already Added" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart 缺少 v103 去重提示"; exit 1; }
          grep -q "ThemeData.dark" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart 缺少强制深色主题"; exit 1; }
          grep -q "_screenWallWindows.length >= 10" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart 缺少 10 实例上限"; exit 1; }
          grep -q "kScreenWallWalls" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart 缺少 v107 多墙持久化键"; exit 1; }
          grep -q "addPeerToScreenWall" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart 缺少 v108 添加到屏幕墙入口"; exit 1; }
          grep -q "_pickScreenWall" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart 缺少 v108 预览选择 Dialog"; exit 1; }
          grep -q "Add to Screen Wall" flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] peer_card.dart 缺少 v108 菜单项"; exit 1; }
          grep -q "String? wallId" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart 缺少 v108 wallId 参数"; exit 1; }
          # 反向断言：v109 的 SW__ 密码哨兵已整条下线（Dart 不再加前缀，
          # Rust 侧 is_screen_wall 也随 V119 死代码清理移除），任何一侧残留都判失败。
          if grep -q "SW__" flutter/lib/desktop/widgets/mini_remote_view.dart; then echo "[FAIL] mini_remote_view.dart 仍包含 v109 密码哨兵前缀"; exit 1; fi
          if grep -q "SW__" flutter/lib/utils/multi_window_manager.dart; then echo "[FAIL] multi_window_manager.dart 仍包含 v109 哨兵剥离"; exit 1; fi
          if grep -q "is_screen_wall\|SW__" src/server/connection.rs; then echo "[FAIL] connection.rs 仍残留 v109 is_screen_wall / SW__ 死代码"; exit 1; fi
          echo "[OK] 屏幕墙 v107 整合链（多实例/预览/添加入口）注入完成"
          # [v119] 屏幕墙会话不自动进入隐私模式（握手期豁免，零闪黑）
          python3 patches/patch_screen_wall_v119.py .
          grep -q "pub is_screen_wall: bool" src/client.rs || { echo "[FAIL] client.rs 缺少 v119 is_screen_wall 字段"; exit 1; }
          grep -q "lc.read().unwrap().is_screen_wall" src/client/io_loop.rs || { echo "[FAIL] io_loop.rs 缺少 v119 隐私模式豁免"; exit 1; }
          grep -q "bool? isScreenWall," flutter/lib/models/model.dart || { echo "[FAIL] model.dart 缺少 v119 isScreenWall 参数"; exit 1; }
          # [v120] 屏幕墙工具栏保留隐私模式手动开关（默认关、可手动开）：icon 仍调用
          # sessionTogglePrivacyMode；与 v119 握手期跳过自动进隐私（io_loop.rs）配合 = 默认关 + 图标可手动开。
          grep -q "sessionTogglePrivacyMode" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart 缺少 v120 隐私模式手动开关"; exit 1; }
          grep -q "kScreenWallToolbarGap \* 2" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart 缺少 v120 隐私/zoom 图标间隔加大"; exit 1; }
          grep -q "_viewOriginal" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart 缺少 v120 view-style 切换"; exit 1; }
          # 首帧强制关闭隐私模式（清掉主窗口残留的全局 PrivacyModeState 单例，避免图标错显「已开隐私」）。
          grep -q "MiniRemoteView force privacy-off error" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart 缺少 v120 屏幕墙首帧强制关闭隐私模式"; exit 1; }
          # 图标必须改用本格私有 _privacyOn，不得再读全局 PrivacyModeState 单例
          # （按 peer id 共享，会被主界面同设备会话污染 → 假性「已开隐私」）。
          grep -q "_privacyOn" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart 缺少 v120 屏幕墙隐私图标私有状态"; exit 1; }
          # 反向断言：图标不得再读 PrivacyModeState.find(widget.id)（主界面污染源）。
          if grep -q "PrivacyModeState.find(widget.id)" flutter/lib/desktop/widgets/mini_remote_view.dart; then
            echo "[FAIL] mini_remote_view.dart 隐私图标仍读全局 PrivacyModeState 单例"; exit 1;
          fi
          echo "[OK] 屏幕墙 v119（隐私模式豁免）+ v120（隐私开关保留 + 图标间隔 + view-style 切换 + 首帧强制关隐私 + 图标私有状态）注入完成"

          # [screen_wall v121] Assert the v121 screen-wall enhancements really landed in
          # the tree. windows / win7 / quick pin the patches checkout to a concrete sha
          # instead of main, so a stale pin silently ships a build without these features
          # (exactly what happened to run #1744). Fail here instead of at the user's desk.
                    # [screen_wall v136] The one-shot 1920x1080 button is now a resolution
          # cycle (2560x1440 -> ... -> 1360x768) that skips unsupported modes.
          grep -q "_kCycleResolutions" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart: missing the v136 resolution cycle list"; exit 1; }
          grep -q "_resCycleIdx" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart: missing the v136 resolution cycle cursor"; exit 1; }
          grep -q "Icons.aspect_ratio" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart: missing the resolution icon"; exit 1; }
          grep -q "Maximize Window" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart: missing the Maximize Window label"; exit 1; }
          grep -q "widget.onMaximize?.call()" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart: missing toolbar double-click maximize"; exit 1; }
          grep -q "requestExitZoom" flutter/lib/desktop/pages/screen_wall_page.dart || { echo "[FAIL] screen_wall_page.dart: missing the global Esc exit-zoom hook"; exit 1; }
          echo "[OK] screen wall v121 verified (resolution icon / double-click maximize / label fix / global Esc)"

          # [screen_wall v132] Two runtime fixes that v121 shipped broken:
          # 1) Escape never reached the local UI while the keyboard was grabbed --
          #    rdev swallows every key-down (returns None), so the zoom's local Esc
          #    handler was unreachable from inside a grabbed device view.
          # 2) The 1920x1080 button did nothing on view-only sessions (the controlled
          #    side's change_resolution is gated on `if self.keyboard`) and on peers
          #    whose SupportedResolutions lacks 1920x1080.
          grep -q "LnDesk v132\] Let Escape ALSO reach the local Flutter UI" src/keyboard.rs || { echo "[FAIL] keyboard.rs: v132 Escape passthrough missing"; exit 1; }
          grep -q "if key == Key::Escape {" src/keyboard.rs || { echo "[FAIL] keyboard.rs: v132 Escape branch missing"; exit 1; }
          grep -q "_ffi.ffiModel.viewOnly" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart: resolution button lacks the view-only guard"; exit 1; }
          grep -q "Unsupported resolution" flutter/lib/desktop/widgets/mini_remote_view.dart || { echo "[FAIL] mini_remote_view.dart: resolution precheck missing"; exit 1; }
          echo "[OK] screen wall v132 verified (Escape passthrough + resolution guard)"

      - name: Force light-mode background to pure white (v224)
        # 值驱动补丁：extras.light_background_white != 'false' 时生效（默认开）。
        # 不用 '==' true 是为了兼容不下发该键的旧 generator 提交。
        if: fromJson(inputs.extras || '{}').light_background_white != 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 亮色模式底色强制纯白。上游 lightTheme 里 scaffoldBackgroundColor 已是白色，
          # 但 grayBg(#EFEFF2) 被三处消费，导致「窗口白、卡片/输入框/Container 灰」：
          #   common.dart:397  inputDecorationTheme.fillColor -> 所有输入框
          #   common.dart:412  cardColor                      -> 所有 Card
          #   common.dart:457  colorScheme.background          -> Container/ColoredBox
          # 本补丁把这三处改指 Colors.white，grayBg 常量本身保留（对话框描边 / 描边按钮
          # 仍在用）。暗色主题走独立硬编码值（#24252B / #18191E），完全不受影响，
          # 用户仍可正常切深色模式——补丁内已加反向断言校验这点。
          python3 patches/patch_light_background_white.py .
          grep -qF "[LnDesk v224 light background white]" flutter/lib/common.dart || { echo "[FAIL] v224: light background marker not injected"; exit 1; }
          # 正向：三处必须已是 Colors.white
          grep -q "fillColor: Colors.white," flutter/lib/common.dart || { echo "[FAIL] v224: input fillColor not white"; exit 1; }
          grep -q "cardColor: Colors.white," flutter/lib/common.dart || { echo "[FAIL] v224: cardColor not white"; exit 1; }
          grep -q "background: Colors.white)," flutter/lib/common.dart || { echo "[FAIL] v224: colorScheme.background not white"; exit 1; }
          # 反向：暗色三值必须原样存在（深色模式仍可用）
          grep -q "scaffoldBackgroundColor: Color(0xFF18191E)," flutter/lib/common.dart || { echo "[FAIL] v224: dark scaffoldBackgroundColor was altered"; exit 1; }
          grep -q "cardColor: Color(0xFF24252B)," flutter/lib/common.dart || { echo "[FAIL] v224: dark cardColor was altered"; exit 1; }
          echo "[OK] v224: 亮色底色已强制纯白（3 处），暗色主题保持不变"

      - name: Font Awesome 4.7 icons for peer tab bar (v224)
        if: env.UI_VARIANT == 'control_custom'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 二进制资源不能用 Python 注入，先 cp 再打补丁：
          #   patches/assets/fontawesome-webfont.ttf -> flutter/assets/
          # 之后 patch_font_awesome_icons.py 做三件事：
          #   1. flutter/pubspec.yaml 追加 family: FontAwesome 字体族声明
          #   2. flutter/lib/common.dart 的 IconFont 类追加 _family6 + FA 字形常量
          #      （含 fa-sort F0DC / fa-refresh F021）
          #   3. peer_tab_model.dart 的左半区 5 个 tab 图标 + peer_tab_page.dart
          #      右半区（搜索 / 多选 / 排序 / 刷新 / 视图切换）换成 FA 字形
          #      刷新仍保留上游的 RotatedBox(quarterTurns: 2)，箭头朝向不变
          cp -f patches/assets/fontawesome-webfont.ttf flutter/assets/fontawesome-webfont.ttf
          test -s flutter/assets/fontawesome-webfont.ttf || { echo "[FAIL] v224: fontawesome-webfont.ttf missing/empty"; exit 1; }
          python3 patches/patch_font_awesome_icons.py .
          grep -q "family: FontAwesome" flutter/pubspec.yaml || { echo "[FAIL] v224: FontAwesome family missing in pubspec.yaml"; exit 1; }
          grep -q "fontawesome-webfont.ttf" flutter/pubspec.yaml || { echo "[FAIL] v224: fontawesome ttf not declared in pubspec.yaml"; exit 1; }
          grep -q "_family6 = 'FontAwesome'" flutter/lib/common.dart || { echo "[FAIL] v224: IconFont _family6 not injected"; exit 1; }
          grep -q "IconFont.faClockO" flutter/lib/models/peer_tab_model.dart || { echo "[FAIL] v224: peer_tab_model icons not switched to FA"; exit 1; }
          grep -q "static const IconData faCaretDown" flutter/lib/common.dart || { echo "[FAIL] v224: faCaretDown constant missing in IconFont"; exit 1; }
          grep -q "static const IconData faSort" flutter/lib/common.dart || { echo "[FAIL] v224: faSort constant missing in IconFont"; exit 1; }
          grep -q "static const IconData faRefresh" flutter/lib/common.dart || { echo "[FAIL] v224: faRefresh constant missing in IconFont"; exit 1; }
          grep -q "IconFont.faSearch" flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] v224: search magnifier not switched to FA"; exit 1; }
          grep -q "IconFont.faSort" flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] v224: sort dropdown not switched to FA"; exit 1; }
          grep -q "IconFont.faRefresh" flutter/lib/common/widgets/peer_tab_page.dart || { echo "[FAIL] v224: refresh button not switched to FA"; exit 1; }
          if grep -q "Icons.sort_rounded," flutter/lib/common/widgets/peer_tab_page.dart; then
            echo "[FAIL] v224: old sort glyph still present"; exit 1
          fi
          if grep -q "Icons.refresh," flutter/lib/common/widgets/peer_tab_page.dart; then
            echo "[FAIL] v224: old refresh glyph still present"; exit 1
          fi
          grep -qF "[LnDesk v224 font-awesome icons]" flutter/lib/common.dart || { echo "[FAIL] v224: FA marker not injected"; exit 1; }
          echo "[OK] v224: Font Awesome 4.7 图标已接入"

