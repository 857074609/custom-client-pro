        run: |
          # V104: 主控机文件直接拖入已连接的远程会话即传输到远端当前目录。
          # 远程会话 body 挂 DropTarget（desktop_drop 已是正式依赖），拖入后经现有
          # kWindowConnect IPC 把路径交给主窗口，主窗口打开该文件传输会话（FT 窗口
          # 保持可见，用其原生缩小版进度卡），由文件传输页复用「发送」按钮链路
          # 自动上传（静默，无授权弹窗）。
          # 必须放在所有 *_both / _new / _old 布局文件 cp 覆盖之后，否则注入被覆盖。
          # 已离线干跑验证（纯净 1.4.9）exit 0，8 条断言全绿；重复运行幂等 [SKIP]。
          python3 patches/patch_remote_drop_file.py .
          grep -q "_onDropFilesToRemote" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing drop handler"; exit 1; }
          # Fallback entry: UIPI blocks drag-drop into elevated (admin) windows, so the
          # "Send File" button is the path that always works. Do not drop this.
          grep -q "_buildSendFileButton" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing send-file fallback button"; exit 1; }
          grep -q "sendLocalPathsToRemote" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing auto-send"; exit 1; }
          # Files must be forwarded through IPC all the way to the FT sub-window's
          # own isolate map (Dart isolates do NOT share static globals).
          grep -qF "params['files'] = files" flutter/lib/utils/multi_window_manager.dart || { echo "[FAIL] multi_window_manager.dart missing files forwarding"; exit 1; }
          grep -q "pendingFiles" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing pendingFiles field"; exit 1; }
          grep -q "pendingFiles" flutter/lib/desktop/pages/file_manager_tab_page.dart || { echo "[FAIL] file_manager_tab_page.dart missing pendingFiles forwarding"; exit 1; }
          # FT window is opened visible (native progress card) by the drop handler; the
          # injected [V104-drop] marker confirms the drop -> FT-window wiring landed.
          grep -q "\[V104-drop\]" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart missing drop -> FT window wiring"; exit 1; }
          # Sub-window plugin registration is what actually makes DropTarget work
          # inside the remote session window (a separate FlutterEngine).
          grep -q "DesktopDropPluginRegisterWithRegistrar" flutter/windows/runner/flutter_window.cpp || { echo "[FAIL] flutter_window.cpp missing desktop_drop sub-window registration"; exit 1; }
          echo "[OK] V104 remote-session drop-file transfer (visible FT window + silent upload)"

      - name: Controlled-side desktop redirection-aware drop target (V107 desktop-redirect)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        run: |
          # [V107-desktop-redirect] Feature ABANDONED (eighth round): the user
          # dropped desktop-redirection to cut code bloat. patch_desktop_redirect.py
          # is now an intentional no-op (it only prints SKIP and exits 0); it does
          # NOT inject any marker into connection.rs / flutter_ffi.rs. The old
          # ReadDir marker resolution + SYSTEM-impersonation logic was all removed.
          # Keep the call so the file is still exercised, but DO NOT assert the
          # removed markers here or the gate fails every build.
          python3 patches/patch_desktop_redirect.py .
          echo "[OK] V107 desktop-redirect patch (intentionally no-op — feature abandoned)"

      - name: Auto-overwrite for headless file transfer (V104-fix)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        run: |
          # Headless drag-drop transfers must NOT show the overwrite confirmation
          # dialog (the FT window is hidden, user cannot click it). This patch
          # auto-overwrites when isHeadlessTransfer=true, while keeping the dialog
          # for manual (non-drop) transfers from the FT window UI.
          # Must run AFTER patch_remote_drop_file.py (anchors on its output).
          python3 patches/patch_file_transfer_auto.py .
          grep -q "isHeadlessTransfer" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing headless flag"; exit 1; }
          grep -q "V104-fix-auto: headless" flutter/lib/models/file_model.dart || { echo "[FAIL] file_model.dart missing auto-overwrite logic"; exit 1; }
          echo "[OK] V104-fix headless auto-overwrite + consistent destination"

      - name: Headless file transfer without peer confirmation (V105 headless-drop)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Unattended drag-drop: the control side opens a brand-new FILE TRANSFER
          # connection per drop and does NOT carry a password, so the peer fell
          # into the empty-password branch of handle_login_request() and raised
          # the Connection Manager dialog - which nobody can click on an
          # unattended host, so the transfer never started.
          # This patch (a) remembers peers that authenticated recently and
          # auto-approves their file-transfer sessions inside the grace window
          # (default 30 min, headless-ft-grace-minutes=0 disables), and (b) forces
          # msg.enable_file_transfer=Yes on the control side, which previously
          # depended on the "enable-file-copy-paste" toggle (off by default) and
          # otherwise left the peer's file channel gated off.
          # Scope: file-transfer sessions only. Desktop remote sessions still
          # require the normal password / click approval.
          # Must run AFTER patch_file_transfer_auto.py (independent anchors, but
          # keep the drop-file patch group together).
          python3 patches/patch_headless_ft_auth.py .
          grep -qF "V105 headless drop-file: auto-approving" src/server/connection.rs || { echo "[FAIL] connection.rs missing headless FT auto-approve"; exit 1; }
          grep -qF "V105 headless drop-file: force-enable" src/client.rs || { echo "[FAIL] client.rs missing forced file-transfer option"; exit 1; }
          echo "[OK] V105 headless file transfer (no peer confirmation)"

      - name: Drop-initiated FT window shrinks to mini transfer card (V107-mini)
        if: fromJson(inputs.extras || '{}').enhanced_file_transfer != 'false'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V107-mini: the drag-drop FT window is resized to a 240x480
          # progress-only card (native per-file progress, native cancel) and
          # auto-closes when all jobs finish. The full manager is one click away.
          # Must run AFTER patch_remote_drop_file.py + patch_file_transfer_auto.py
          # (re-anchors the _enterMiniTransferMode() call on the [V104-drop] block
          # those patches inject). Patch asserts its own anchors; we gate the
          # two structural markers that prove the mini window landed.
          python3 patches/patch_drop_progress_v2.py .
          grep -qF "_enterMiniTransferMode" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing mini transfer mode entry"; exit 1; }
          grep -qF "_buildMiniTransferView" flutter/lib/desktop/pages/file_manager_page.dart || { echo "[FAIL] file_manager_page.dart missing mini transfer view"; exit 1; }
          echo "[OK] V107 mini transfer window (240x480 native progress card)"

      - name: Login timeout watchdog + stale saved-password self-heal (V105)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 1) A stale saved password on a direct connect used to hang at
          #    "Connecting..." forever (peer never answers, no prompt, no picture).
          #    This patch (a) clears the persisted copy when the failed attempt
          #    carried exactly that saved password, so the next attempt prompts,
          #    and (b) arms a 20s watchdog that swaps the endless spinner for a
          #    visible login-error dialog when no first image ever arrives.
          # 2) Runs AFTER the drop/transfer patches (independent anchors).
          # 3) 本工作流不启用 iroh，脚本会自动走 no-iroh self-heal 变体
          #    （离线干跑已确认输出 "[INFO] iroh transport ABSENT -> using no-iroh self-heal variant"）。
          python3 patches/patch_login_timeout.py .
          grep -qF "stale-saved-password" src/client.rs || { echo "[FAIL] client.rs missing stale-password self-heal"; exit 1; }
          grep -qF "login-watchdog" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing login watchdog"; exit 1; }
          echo "[OK] V105 login watchdog + stale-password self-heal"

      - name: Settings page survives theme-change rebuilds (V104)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Changing the theme calls Get.changeThemeMode which rebuilds the whole
          # app. The desktop settings page must keep its selected tab and not leak
          # its GetX singleton (wrong-type dispose was resetting it). See patch.
          python3 patches/patch_settings_theme.py .
          grep -q "settings page resilient to theme-change" flutter/lib/desktop/pages/desktop_setting_page.dart || { echo "[FAIL] desktop_setting_page.dart missing theme-rebuild resilience"; exit 1; }
          echo "[OK] settings page immune to theme-change rebuilds"

      - name: Disable_desktop_icon
        if: fromJson(inputs.extras).disable_desktop_icon == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # V216: never create Desktop / Start Menu / Startup-folder shortcuts.
          #
          # The primary fix lives in windows.rs::get_silent_install_options(),
          # which upstream hard-codes to "desktopicon startmenu [printer]".
          # Neutralizing only the copy blocks inside install_me() is NOT enough:
          # the installer runs --silent-install (patch #0011) and that options
          # string arrives straight from get_silent_install_options().
          python3 patches/disable_desktop_icon.py .
          # Gate: both silent-install return branches must no longer carry the
          # shortcut flags, otherwise a silent install recreates the icons.
          grep -q 'silent install: no shortcut at all' src/platform/windows.rs \
            || { echo "[FAIL] v216: get_silent_install_options not stripped"; exit 1; }
          # Gate: install_service() has its own Startup-folder shortcut block
          # that never passes through install_me().
          grep -q 'install_service: no Startup tray shortcut' src/platform/windows.rs \
            || { echo "[FAIL] v216: install_service Startup shortcut not neutralized"; exit 1; }
          # Gate: the interactive wizard checkboxes must be gone.
          grep -q "// Option(desktopicon, label: 'Create desktop icon')" \
            flutter/lib/desktop/pages/install_page.dart \
            || { echo "[FAIL] v216: install_page desktopicon option not hidden"; exit 1; }
          echo "[OK] v216 desktop / start-menu / startup shortcuts disabled"

      # === [V217] 质量门禁：把「20 分钟后才炸」提前到「3 分钟内失败」 ===
      # win7 此前没有任何 Dart/Rust 静态门禁，所有补丁错误都要等 build.py 真正
      # 编译（vcpkg + flutter engine + 全量构建 ≈ 20 分钟）才暴露。以下两道门禁
      # 在编译前 fail fast，并给出带文件名/行号的可读错误。
      # 已离线验证：hbb_common 在打完全部网络补丁后可编译通过（rustc 语法级）。

      - name: super-p2p suite (V186/V187 observe + V200 remove native test_nat_type)
        # [V218] 合并为一个步骤：两步强耦合（V200 依赖 super_p2p 模块），且同属
        # 「启用P2P增强」(super_p2p_enforcement) 一个复选框。
        if: fromJson(inputs.extras || '{}').super_p2p_enforcement != 'observe'
        # Authenticated port-prediction stack: public STUN NAT classification +
        # HMAC probe against candidates; acceptor self-observes and reports its
        # public mapping (V187a). fire-and-forget on a detached thread.
        #
        # [V217] 单一开关收敛：原先由两个键控制 ——
        #   enable_super_p2p（总开关）与 super_p2p_enforcement（强度）。
        #   但 enable_super_p2p 在前端 forms.py / services.py / generator.html
        #   三处均无定义（死键），表达式恒解析为 'true'，导致 super-p2p 在所有
        #   构建中强制启用、用户无法关闭。现统一由 super_p2p_enforcement 驱动：
        #     勾选（'on'）      -> DEFAULT_ENABLED=true  + ENFORCEMENT="on"
        #                             探测验证通过即切 UDP 直连（全功能）
        #     取消勾选（'observe'）-> DEFAULT_ENABLED=false + ENFORCEMENT="observe_only"
        #                             enabled() 返回 false，observe 任务在入口直接
        #                             return，零探测开销（完全停用）
        # 运行时仍可用本地选项 enable-super-p2p 覆盖烘焙默认值（空=用默认）。
        #
        # 门控说明：用 `!= 'observe'` 而非 `== 'on'`，键缺失时 fromJson 返回 null
        # 条件成立，保持「默认启用」的向后兼容行为（旧版 generator 不下发该键
        # 也不会关掉功能）。取消勾选时 super-p2p 与 V200 一起跳过，Rust 侧保留
        # 上游原生 test_nat_type，不存在调用已移除模块的编译风险。
        #
        # 表达式说明：SUPER_P2P_DEFAULT 需要把 'observe' 显式映射成 'false'
        #（补丁内部只在 env 恰为 "false" 时才改写 DEFAULT_ENABLED），故用
        # `== 'observe' && 'false' || 'true'` 而非直接透传该键。
        env:
          SUPER_P2P_DEFAULT: ${{ fromJson(inputs.extras || '{}').super_p2p_enforcement == 'observe' && 'false' || 'true' }}
          SUPER_P2P_ENFORCEMENT: ${{ fromJson(inputs.extras || '{}').super_p2p_enforcement || 'on' }}
          SUPER_P2P_REFLECTORS: ${{ fromJson(inputs.extras || '{}').custom_p2p_reflector || '' }}
        shell: bash
        run: |
          python3 patches/patch_super_p2p.py .
          # V200: drop the hbbs-trusting native test_nat_type (RFC-incorrect
          # same-host-2-port symmetric heuristic) and feed startup/mediator NAT
          # refresh from super_p2p::refresh_my_nat_type(). MUST run AFTER the
          # super_p2p command above (which adds the module). Only wired here
          # because super_p2p is currently applied only in this windows workflow.
          python3 patches/patch_remove_test_nat_type.py .
      - name: Gate - cargo check hbb_common (fail fast on patch compile errors)
        # Network-hardening patches (v98 TCP keepalive + DNS cache, V101
        # happy-eyeballs, V102 happy-eyeballs-lift + DNS timeout) all live in the
        # hbb_common crate. A typo there only surfaces at `cargo build` time,
        # which is reached only after vcpkg install + flutter engine + full build
        # (~20 min wasted on a guaranteed-fail). Compile-check hbb_common right
        # after the lock is fetched so a bad patch fails the run within minutes,
        # with a readable error, instead of deep in the build step.
        shell: bash
        run: |
          echo ">> cargo check -p hbb_common (gate: catch patch compile errors early)"
          cargo check -p hbb_common --message-format short

      - name: Relax upstream lint noise for analyze gate
        shell: bash
        run: |
          # [LnDesk v160] Upstream rustdesk ships many cosmetic lint issues
          # (constant_identifier_names / camel_case_types / unnecessary_import /
          # unused_import / unnecessary_this / unused_element) in web-platform
          # files we never patch (lib/web/**, lib/models/web_model.dart,
          # lib/utils/multi_window_manager.dart). They are infos/warnings, but
          # to keep the analyze gate focused on REAL compile errors only, drop a
          # scoped analysis_options that silences exactly those rules while
          # inheriting the repo's own settings. Compile errors (undefined names,
          # type mismatches) are NOT in this set and remain fatal.
          cat > flutter/analysis_options.yaml <<'YAML'
          include: ../analysis_options.yaml
          linter:
            rules:
              constant_identifier_names: false
              camel_case_types: false
              unnecessary_import: false
              unused_import: false
              unnecessary_this: false
              unused_element: false
          YAML
          echo "[OK] suppressed upstream cosmetic lint rules for analyze gate"

      - name: Guard - IconFont FA glyph references must be defined (v225)
        shell: bash
        run: |
          # [v225] both 模板（connection_page_both / desktop_home_page_both）引用 IconFont.faXxx，
          # 这些常量由 patch_font_awesome_icons.py 注入 flutter/lib/common.dart。若某工作流只 cp
          # 模板、没跑 FA 步骤（win7 曾缺该步骤 -> undefined_getter），analyze 只会在 200+ 条
          # info/warning 里冒出 4 行 error，定位成本很高。这里做一次廉价的符号对账，
          # 直接在步骤日志里点名缺失的字形。
          cd ./flutter
          missing=0
          for sym in $(grep -rhoE 'IconFont\.fa[A-Za-z0-9]+' lib | sed 's/IconFont\.//' | sort -u); do
            if ! grep -q "static const IconData ${sym} " lib/common.dart; then
              echo "[FAIL] v225-guard: IconFont.${sym} 未在 flutter/lib/common.dart 定义（FA 图标步骤未执行？）"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "[OK] v225-guard: 所有 IconFont FA 字形引用均已在 common.dart 定义"
          cd ..

      - name: Gate - flutter analyze (fail fast on Dart compile errors)
        shell: bash
        run: |
          # Catch Dart semantic/compile errors (e.g. non-constant expression,
          # int passed where double is required) HERE with file:line, instead of
          # burying them inside MSB8066 during 'flutter build'.
          # Only ERRORS are fatal: upstream carries many lint infos/warnings
          # that must not block the build. 'lib' only (test/ often noisy).
          # [LnDesk v160] cosmetic rules already silenced via flutter/analysis_options.yaml.
          cd ./flutter
          flutter pub get
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### flutter analyze: Dart errors (fatal)"
              echo '```'
              grep -iE 'error' analyze.log | head -40 || echo '(no error line matched)'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "[FAIL] flutter analyze reported Dart errors - see the job summary"
            exit 1
          fi
          echo "[OK] flutter analyze clean (no Dart errors)"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk — 对齐官方 build-for-windows 参数（--portable --skip-portable-pack）
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
 
          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk   

          # Download printer driver files and extract them to ./rustdesk
           try {
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
             Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

             # Check and move the files
             $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
             $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
             $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
             $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
             if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                 Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                 Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                 mkdir ./rustdesk/drivers
                 mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                 Expand-Archive printer_driver_adapter.zip -DestinationPath .
                 mv -Force .\printer_driver_adapter.dll ./rustdesk
             } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                 Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
             } else {
                 Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
             }
           } catch {
               Write-Host "Ingore the printer driver error."
           }
          
      - name: icon stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png not found"
            exit 1
          fi
          ASSET_DIR="./rustdesk/data/flutter_assets/assets"
          ICON_SVG="$ASSET_DIR/icon.svg"
          [ -f "$ICON_SVG" ] && mv "$ICON_SVG" "$ICON_SVG.bak"
          magick ./res/icon.png "$ICON_SVG"
      
      - name: Download logo.png
        if: ${{ inputs.logolink == 'true' }}
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        shell: pwsh
        run: |
          $outDir = "./rustdesk/data/flutter_assets/assets"
          if (!(Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }
          $uri = "${env:GENURL}/png/${env:UUID}/logo.png"
          Invoke-WebRequest -Uri $uri -OutFile "$outDir/logo.png" -TimeoutSec 30
      
      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"
                      
      
      - name: Create custom_.txt file
        shell: bash
        run: |
          echo -n "${{ inputs.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Stage code-signing public cert into package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          cp -f patches/CodeSignCert_Public.cer ./rustdesk/CodeSignCert_Public.cer
          echo "✅ public cert staged into ./rustdesk/ (imported at install time)"

      - name: Pack payload binaries with UPX (before packaging & signing)
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          # [v227c] 签名前对负载二进制加壳：压缩主程序与核心 DLL（体积约省 50-60%）。
          # 顺序必须保证：先加壳、后自解压打包与签名（加壳会使既有签名失效）。
          # 只压 rustdesk.exe + librustdesk.dll；flutter_windows.dll（引擎）与
          # WindowInjection.dll（注入 DLL）不压，规避加载兼容与杀软误报放大。
          choco install upx -y --no-progress
          upx --version
          upx -9 --lzma ./rustdesk/rustdesk.exe ./rustdesk/librustdesk.dll
          ls -l ./rustdesk/rustdesk.exe ./rustdesk/librustdesk.dll
          echo "[OK] payload packed with UPX"

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ inputs.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ inputs.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          PACKER=$(find ./target -name "rustdesk-portable-packer.exe" | head -1)
          if [ -z "$PACKER" ]; then echo "::error::rustdesk-portable-packer.exe not found"; exit 1; fi
          mv "$PACKER" "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi

        if: env.UPLOAD_ARTIFACT == 'true'
        # MSI 是附带产物（分发主力是 -install.exe）：MSI 编译失败仅告警跳过，不阻断工作流
        continue-on-error: true
        run: |
          $myappname = "${{ inputs.appname }}" -replace '\s','_'
          cp "rustdesk/${{ inputs.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi

      - name: Sign Windows binaries (EXE and MSI)
        if: env.UPLOAD_ARTIFACT == 'true' && (success() || failure())
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PASS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "Skipping signing: CODE_SIGN_PFX_BASE64 secret is not set."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "Skipping signing: CODE_SIGN_PASS_PASSWORD secret is not set."
            exit 0
          }
          Write-Host "Creating certificate file from CODE_SIGN_PFX_BASE64"
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          $certBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("certificate\certificate.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.Directory.FullName -like "*x64*" } |
                      Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                      Select-Object -First 1
      
          if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                        Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                        Select-Object -First 1
          }
      
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows SDK paths."
            exit 1
          }
          Write-Host "Using signtool: $($signtool.FullName)"
      
          $exePath = ".\SignOutput\rustdesk.exe"
          $msiPath = ".\SignOutput\rustdesk.msi"
      
          if (Test-Path $exePath) {
            Write-Host "Signing EXE: $exePath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $exePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "EXE not found at $exePath, skipping."
          }
      
          if (Test-Path $msiPath) {
            Write-Host "Signing MSI: $msiPath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $msiPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "MSI not found at $msiPath, skipping."
          }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Extract first 4 chars of UUID
        id: tag
        shell: bash
        run: |
          RAW_UUID="${{ github.event.inputs.uuid }}"
          CLEAN_UUID=$(echo "$RAW_UUID" | tr -d '-')
          SHORT_UUID=${CLEAN_UUID:0:4}
          echo "tag=$SHORT_UUID" >> "$GITHUB_OUTPUT"
          
      - name: Set build filename
        id: build_name
        shell: bash
        run: |
          VER="${{ env.VERSION }}"
          W="${{ env.RUSTDESK_BUILD_NUMBER }}"
          # 始终带第4段构建号（W，即使 0 -> .0）：保证构建文件名与下载链接一致，且始终显示4段版本号
          VER_SUFFIX=".${W:-0}"
          NAME="${{ inputs.filename }}-${VER}${VER_SUFFIX}-win-${{ steps.conn.outputs.conn }}-x86_64-${{ steps.tag.outputs.tag }}"
          echo "BUILD_FILENAME=$NAME" >> "$GITHUB_ENV"
          echo "value=$NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Build filename set to: $NAME"
      
      - name: Rename EXE
        shell: bash
        run: |
          mv "./SignOutput/rustdesk.exe" "./SignOutput/${BUILD_FILENAME}-install.exe"
          echo "✅ EXE renamed to ${BUILD_FILENAME}-install.exe (double-click = silent install)"
      
      - name: Rename MSI (optional)
        shell: bash
        run: |
          test -f "./SignOutput/rustdesk.msi" && \
            mv "./SignOutput/rustdesk.msi" "./SignOutput/${BUILD_FILENAME}.msi" && \
            echo "✅ MSI renamed to ${BUILD_FILENAME}.msi" || \
            echo "⚠️ MSI not found, skipping rename."

      - name: Create GitHub Release and Upload Assets
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_name.outputs.value }}
          name: Release ${{ steps.build_name.outputs.value }}
          prerelease: true
          files: |
            ./SignOutput/${{ steps.build_name.outputs.value }}-install.exe
            ./SignOutput/${{ steps.build_name.outputs.value }}.msi
      
      - name: Send to file server
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        shell: bash
        run: |
          EXE="./SignOutput/${BUILD_FILENAME}-install.exe"
          MSI="./SignOutput/${BUILD_FILENAME}.msi"
          URL="${{ secrets.GENURL }}/save_custom_client"
          TOKEN="${{ fromJson(inputs.extras).token }}"
          UUID="${{ inputs.uuid }}"
          # [LnDesk v169] Cross-border upload resilience.
          # Healthy link: 9-18s (~2.4MB/s). Degraded: 8-40KB/s and then the
          # connection is reset (curl 55/56) - run 35582468723 died at 30%
          # after 11m48s, while run 35583260254 crawled the same way for 626s
          # and only happened to finish.
          # --retry alone does NOT retry 55/56; --retry-all-errors is required.
          # --retry-delay is deliberately unset so curl keeps its built-in
          # exponential backoff (1s,2s,4s,8s), which suits a congested link
          # better than a fixed delay.
          # --speed-limit is a conservative STALL guard only: the observed
          # "slow" (8-47KB/s) and "dead" (4-15KB/s) ranges overlap, so a more
          # aggressive valve would abort transfers that do finish.
          # -f turns an HTTP error (401/413/500) into a real failure. Without
          # it curl exits 0 and the step silently passes with no file saved.
          # EXE and MSI are attempted independently: under `set -e` the old
          # `&&` chain stopped at the first failure and never tried the MSI.
          CURL_OPTS=(
            -X POST
            -H "Content-Type: multipart/form-data"
            -H "Authorization: Bearer $TOKEN"
            --connect-timeout 30
            --retry 4
            --retry-all-errors
            --max-time 1800
            --speed-limit 1024
            --speed-time 180
          )
          STAT='\n[upload] http=%{http_code} sent=%{size_upload}B in %{time_total}s\n'
          rc_exe=0
          rc_msi=0
          echo "== [1/2] EXE =="
          if curl -f "${CURL_OPTS[@]}" -w "$STAT" \
              -F "file=@$EXE" -F "uuid=$UUID" "$URL"; then
            echo "[OK] EXE uploaded"
          else
            rc_exe=$?
            echo "[FAIL] EXE upload rc=$rc_exe"
          fi
          echo "== [2/2] MSI =="
          if [ ! -f "$MSI" ]; then
            echo "[SKIP] MSI not found, skipping upload."
          elif curl -f "${CURL_OPTS[@]}" -w "$STAT" \
              -F "file=@$MSI" -F "uuid=$UUID" "$URL"; then
            echo "[OK] MSI uploaded"
          else
            rc_msi=$?
            echo "[FAIL] MSI upload rc=$rc_msi"
          fi
          if [ "$rc_exe" -ne 0 ] || [ "$rc_msi" -ne 0 ]; then
            echo "[FAIL] file server upload failed (EXE rc=$rc_exe, MSI rc=$rc_msi)"
            exit 1
          fi
          echo "[OK] both artifacts uploaded to file server"
           
      - name: Report Status
        continue-on-error: true
        shell: bash
        timeout-minutes: 60
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Success"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      - name: failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: failed
        if: cancelled()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

  # [build-fallback v135] Never leave the builder page polling forever.
  # The terminal "Success" report lives in the last job of this graph, so when an
  # upstream job fails that job is skipped and NOTHING is reported - the waiting
  # page used to spin until the browser was closed. This job depends on the
  # reporting job with `always()` and files a failure only when that job did not
  # succeed (failure / cancelled / skipped).
  notify-final-status:
    name: Notify final status
    needs: [build-for-windows-flutter]
    if: ${{ always() && needs.build-for-windows-flutter.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "Failed" is the canonical terminal string the builder maps to its failure
      # page, so this also works against a builder that predates the v135 fix.
      - name: Report failed status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras || '{}').token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Failed"}' \
            "${{ secrets.GENURL }}/updategh" || echo "Report status ping failed (non-fatal)"
