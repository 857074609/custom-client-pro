name: Custom Windows Portable-Quick (No-Trace) Client Generator
run-name: Custom Windows Portable-Quick (No-Trace) Client Generator
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: string
      serverinfo:
        description: 'serverinfo'
        required: true
        type: string
      custom:
        description: "Custom JSON"
        required: true
        default: ''
        type: string
      uuid:
        description: "uuid of request"
        required: true
        default: ''
        type: string
      ui_mode:
        description: "Custom User Interface"
        required: false
        type: string
      screen_wall:
        description: "(unused in quick build, kept for dispatch contract)"
        required: false
        default: 'false'
        type: string
      iconlink:
        description: "icon link"
        required: false
        default: 'false'
        type: string
      logolink:
        description: "logo link"
        required: false
        default: 'false'
        type: string
      appname:
        description: "app name"
        required: true
        default: 'rustdesk'
        type: string
      filename:
        description: "(unused in quick build, kept for dispatch contract)"
        required: true
        default: 'rustdesk'
        type: string
      extras:
        description: "extra inputs in json"
        required: true
        default: '{}'
        type: string



# Drop a superseded run: dispatching the same generator again cancels the run
# that is already in flight instead of queueing behind it. Different generators
# use different groups, so parallel Windows/Linux/Android builds are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
env:
  RUST_VERSION: "1.75.0" # matches the 2026-08-26 1.4.9.0 good build toolchain.
    # v121: iroh is fully removed from quick, so there is no MSRV constraint
    # and the 1.75 toolchain builds the whole dependency closure.
  # Do NOT set CARGO_BUILD_TARGET: it makes cargo emit to target/<triple>/release/ instead
  # of target/release/, which breaks build.py (librustdesk.dll existence check at line 443)
  # and flutter/windows/CMakeLists.txt (RUSTDESK_LIB). Host triple is already correct here.
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "${{ fromJson(inputs.extras || '{}').version || 'master' }}"
  RUSTDESK_BUILD_NUMBER: "${{ fromJson(inputs.extras || '{}').build_number || '0' }}"
  UPLOAD_ARTIFACT: 'true'
  STATUS_URL: "${{ secrets.GENURL }}/updategh"
  GENURL: ${{ secrets.GENURL }}



jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    secrets: inherit
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: Build Windows Portable-Quick (No-Trace)
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
    steps:

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set gdpro value
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> "$GITHUB_ENV"

      - name: Compute sanitized app tag
        shell: bash
        run: |
          APP_TAG=$(echo "${{ inputs.appname }}" | tr ' ' '_' | tr -cd 'A-Za-z0-9._-')
          echo "APP_TAG=$APP_TAG" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.VERSION == 'master' && 'master' || format('refs/tags/{0}', env.VERSION) }}
          submodules: recursive
          fetch-depth: 1

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout patches scripts
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          path: patches
          token: ${{ secrets.REPO }}
          ref: ac5012c086a4d1172e263594525e76718f51fee1

      - name: Apply activate_os no-right-click patch
        run: python3 patches/patch_activate_os_fix.py .
      - name: Apply clipboard session sync patch
        run: python3 patches/patch_clipboard_session_sync.py .
      - name: Apply audio playback refactor patch
        run: python3 patches/patch_audio_playback_refactor.py .

      - name: Report Status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u73af\u5883\u51c6\u5907\u5c31\u7eea\uff0c\u5f00\u59cb\u5356\u529b\u5de5\u4f5c"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: Decrypt and mask secrets
        id: decrypt
        shell: bash
        env:
          SERVERINFO: ${{ github.event.inputs.serverinfo }}
          BUILD_SECRET_KEY: ${{ secrets.BUILD_SECRET_KEY }}
          EXTRAS_JSON: ${{ inputs.extras }}
        run: |
          set +x
          SI="${{ github.event.inputs.serverinfo }}"
          if [ -z "$SI" ] || [ "$SI" = "placeholder" ]; then
            echo "::warning::serverinfo empty/placeholder -> no custom server from serverinfo"
          else
            pip install cryptography
          fi
          python -c "
          import os, json, sys
          try:
              from cryptography.fernet import Fernet
          except Exception:
              Fernet = None
          data = {}
          SI = os.environ.get('SERVERINFO','')
          if SI and SI != 'placeholder' and Fernet is not None:
              try:
                  key = os.environ['BUILD_SECRET_KEY'].encode()
                  data = json.loads(Fernet(key).decrypt(SI.encode()).decode())
              except Exception as e:
                  print('::warning::serverinfo decrypt failed ('+str(e)+') -> ignoring')
          # extras fallback (non-secret; never overrides real serverinfo values)
          ex_raw = os.environ.get('EXTRAS_JSON','')
          if ex_raw:
              try:
                  ex = json.loads(ex_raw)
                  for k in ('server','RS_PUB_KEY','apiServer'):
                      if ex.get(k) and not data.get(k):
                          data[k] = ex[k]
              except Exception:
                  pass
          for field in ['server','RS_PUB_KEY','apiServer','permanentPassword','unlockPin']:
              v = data.get(field)
              if v: print('::add-mask::' + v)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write(f\"CUSTOM_SERVER={data.get('server','')}\n\")
              e.write(f\"CUSTOM_KEY={data.get('RS_PUB_KEY','')}\n\")
              e.write(f\"CUSTOM_APISERVER={data.get('apiServer','')}\n\")
              e.write(f\"PERMANENT_PASSWORD={data.get('permanentPassword','')}\n\")
              e.write(f\"UNLOCK_PIN={data.get('unlockPin','')}\n\")
          "

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: Replace custom patch files
        if: inputs.ui_mode == 'true'
        shell: bash
        run: |
          mkdir -p src/lang/
          mkdir -p flutter/lib/desktop/pages/
          cp -f patches/cn.rs  src/lang/cn.rs
          cp -f patches/en.rs src/lang/en.rs

          VER="${{ env.VERSION }}"
          echo "Building version: $VER"
          cp -f patches/desktop_home_page_new.dart flutter/lib/desktop/pages/desktop_home_page.dart


      - name: Enable copy ID & password button
        if: fromJson(inputs.extras).addcopy == 'true' && inputs.ui_mode == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # buildCopyIdPasswordButton 鍩哄噯鏂囦欢閲岄粯璁よ鎻愬墠 return 鍏抽棴锛?
          #   // COPY_BUTTON_CONTROL
          #   return const SizedBox.shrink();
          # 鍒犻櫎璇ユ彁鍓?return 浣挎寜閽€昏緫鐢熸晥锛涘悓鏃剁Щ闄?isIncomingOnly 鏄剧ず闂ㄦ锛?
          # 璁╅潪 incoming-only 鐨?portable-quick 鍗曢潰鏉夸篃鑳芥樉绀哄鍒舵寜閽€?
          PAGE=flutter/lib/desktop/pages/desktop_home_page.dart
          python3 - "$PAGE" <<'EOF'
          import sys, re
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read().replace("\r\n", "\n")
          m = re.search(r"[ \t]*// COPY_BUTTON_CONTROL[ \t]*\n[ \t]*return const SizedBox\.shrink\(\);[ \t]*\n", t)
          if not m:
              print("[FAIL] 鏈壘鍒?COPY_BUTTON_CONTROL 鎻愬墠 return")
              sys.exit(3)
          t = t[:m.start()] + t[m.end():]
          t2, n = re.subn(
              r"if \(!bind\.isIncomingOnly\(\) \|\|\n(\s+)model\.serverId",
              "if (\n\\g<1>model.serverId",
              t, count=1)
          if n != 1:
              print("[FAIL] 鏈壘鍒板鍒舵寜閽?isIncomingOnly 闂ㄦ")
              sys.exit(3)
          open(p, "w", encoding="utf-8").write(t2)
          print("[OK] 澶嶅埗鎸夐挳宸插惎鐢紙绉婚櫎 COPY_BUTTON_CONTROL 鎻愬墠 return + isIncomingOnly 闂ㄦ锛?)
          EOF
          # [LnDesk v167] 鏂█閿氬畾銆岀嫭鍗犱竴琛岀殑鏍囪琛屻€嶏細鏂囦欢璇存槑娉ㄩ噴閲屼篃鍚悓鍚?
          # 鏍囪璇嶏紙SHARE 娈佃惤鍐欑潃 "// step (mirrors COPY_BUTTON_CONTROL) ..."锛夛紝
          # 鏃х殑 ! grep -q "COPY_BUTTON_CONTROL" 鍏ㄦ枃浠舵悳绱㈠繀鐒惰鍒や负鏈竻鐞嗗共鍑€銆?
          ! grep -q "^[[:space:]]*//[[:space:]]*COPY_BUTTON_CONTROL[[:space:]]*$" "$PAGE" || { echo "[FAIL] 鎻愬墠 return 鏈Щ闄ゅ共鍑€锛堟爣璁拌浠嶅湪锛?; exit 1; }
          grep -q "buildCopyIdPasswordButton" "$PAGE" || { echo "[FAIL] 缂哄皯 buildCopyIdPasswordButton"; exit 1; }
          echo "[OK] 澶嶅埗鎸夐挳鍚敤瀹屾垚"

      - name: Enable share button
        if: inputs.ui_mode == 'true' && fromJson(inputs.extras).addshare == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v151] 鍒嗕韩鎸夐挳涓庡鍒舵寜閽悓鏋佹€э紙鍩哄噯鏂囦欢榛樿琚彁鍓?return 鍏抽棴锛夛細
          #   // SHARE_BUTTON_CONTROL
          #   return const SizedBox.shrink();
          # 鍒犻櫎璇ユ彁鍓?return 浣垮垎浜寜閽€昏緫鐢熸晥銆傚垎浜笌銆岄€€鍑烘寜閽€嶅叡鐢ㄥ悓涓€涓?
          # 妲戒綅銆佷簩鑰呬簰鏂ワ紝鏁呭悓姝ラ鍐呰В寮€ QUIT 鎻愬墠 return 鎶婇€€鍑烘寜閽殣钘?
          # 锛坅ddshare 鎭掕暣鍚?hideQuit锛屽墠绔仈鍔?+ 鍚庣瀹堝崼鍧囧凡淇濊瘉锛夈€?
          PAGE=flutter/lib/desktop/pages/desktop_home_page.dart
          python3 - "$PAGE" <<'EOF'
          import sys, re
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read().replace("\r\n", "\n")
          m = re.search(r"[ \t]*// SHARE_BUTTON_CONTROL[ \t]*\n[ \t]*return const SizedBox\.shrink\(\);[ \t]*\n", t)
          if not m:
              print("[FAIL] 鏈壘鍒?SHARE_BUTTON_CONTROL 鎻愬墠 return")
              sys.exit(3)
          t = t[:m.start()] + t[m.end():]
          t, n = re.subn(r"// QUIT:(return const SizedBox\.shrink\(\);)", r"\1", t)
          if n != 1:
              print("[FAIL] 鏈壘鍒?QUIT 鎻愬墠 return")
              sys.exit(3)
          open(p, "w", encoding="utf-8").write(t)
          print("[OK] 鍒嗕韩鎸夐挳宸插惎鐢紙绉婚櫎 SHARE_BUTTON_CONTROL 鎻愬墠 return + 闅愯棌閫€鍑烘寜閽級")
          EOF
          # [LnDesk v167] 鍚?COPY锛氭柇瑷€閿氬畾鏍囪琛屾湰韬紝閬垮厤琚鏄庢敞閲婅浼ゃ€?
          ! grep -q "^[[:space:]]*//[[:space:]]*SHARE_BUTTON_CONTROL[[:space:]]*$" "$PAGE" || { echo "[FAIL] 鎻愬墠 return 鏈Щ闄ゅ共鍑€锛堟爣璁拌浠嶅湪锛?; exit 1; }
          grep -q "_buildShareButton" "$PAGE" || { echo "[FAIL] 缂哄皯 _buildShareButton"; exit 1; }
          ! grep -q "// QUIT:return" "$PAGE" || { echo "[FAIL] 閫€鍑烘寜閽湭闅愯棌锛堜笌鍒嗕韩鍚屾Ы锛?; exit 1; }
          echo "[OK] 鍒嗕韩鎸夐挳鍚敤瀹屾垚"

      - name: Enable invite button
        if: inputs.ui_mode == 'true' && fromJson(inputs.extras).addinvite == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v160] 閭€璇锋寜閽笌澶嶅埗/鍒嗕韩鍚屾瀬鎬э紙鍩哄噯鏂囦欢榛樿琚彁鍓?return 鍏抽棴锛夛細
          #   // INVITE_BUTTON_CONTROL
          #   return const SizedBox.shrink();
          # 鍒犻櫎璇ユ彁鍓?return 浣块個璇锋寜閽€昏緫鐢熸晥锛堝畾鍒?UI 涓嬬敱鏈楠ゆ寜澶嶉€夋鎻ず锛?
          # 涓婃父鐗堝垯鐢?patch_invite_button_uimode_false.py 娉ㄥ叆锛屼笉鍦ㄦ璺緞锛夈€?
          PAGE=flutter/lib/desktop/pages/desktop_home_page.dart
          python3 - "$PAGE" <<'EOF'
          import sys, re
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read().replace("\r\n", "\n")
          m = re.search(r"[ \t]*// INVITE_BUTTON_CONTROL[ \t]*\n[ \t]*return const SizedBox\.shrink\(\);[ \t]*\n", t)
          if not m:
              print("[FAIL] 鏈壘鍒?INVITE_BUTTON_CONTROL 鎻愬墠 return")
              sys.exit(3)
          t = t[:m.start()] + t[m.end():]
          open(p, "w", encoding="utf-8").write(t)
          print("[OK] 閭€璇锋寜閽凡鍚敤锛堢Щ闄?INVITE_BUTTON_CONTROL 鎻愬墠 return锛?)
          EOF
          # [LnDesk v167] 鍚?COPY锛氭柇瑷€閿氬畾鏍囪琛屾湰韬紝閬垮厤琚鏄庢敞閲婅浼ゃ€?
          ! grep -q "^[[:space:]]*//[[:space:]]*INVITE_BUTTON_CONTROL[[:space:]]*$" "$PAGE" || { echo "[FAIL] 鎻愬墠 return 鏈Щ闄ゅ共鍑€锛堟爣璁拌浠嶅湪锛?; exit 1; }
          grep -q "_buildInviteButton" "$PAGE" || { echo "[FAIL] 缂哄皯 _buildInviteButton"; exit 1; }
          echo "[OK] 閭€璇锋寜閽惎鐢ㄥ畬鎴?

      - name: Inject LAN IP direct access board
        if: fromJson(inputs.extras).ip_direct_board == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 鍐呯綉 IP 鐩磋繛鐪嬫澘锛堝乏闈㈡澘鏄剧ず 鏈満鍐呯綉IP:鐩磋繛绔彛 + 鐘舵€佺伅 + 澶嶅埗鎸夐挳锛?
          python3 patches/patch_direct_access.py . "${{ inputs.ui_mode }}"
          grep -q "buildDirectAccessBoard" flutter/lib/desktop/pages/desktop_home_page.dart || { echo "[FAIL] desktop_home_page.dart 缂哄皯 buildDirectAccessBoard"; exit 1; }
          echo "[OK] 鍐呯綉 IP 鐩磋繛鐪嬫澘娉ㄥ叆瀹屾垚"

      - name: Report local IPv6 to API server (v70)
        if: fromJson(inputs.extras).ip_direct_board == 'true' || fromJson(inputs.extras).ip_direct_udp == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # v70: 鎶婃湰鏈?lan-ipv6 涓婃姤鍒?API 鏈嶅姟鍣ㄥ績璺筹紝渚涜澶囪彍鍗?IPv6 鐩磋繛"浣跨敤銆?
          # 蹇呴』鍦?patch_direct_access.py 涔嬪悗杩愯锛堝畠鍐欏叆 lan-ipv6 閫夐」锛夈€?
          python3 patches/patch_ipv6_heartbeat.py .
          grep -q 'v\["ipv6"\]' src/hbbs_http/sync.rs || { echo "[FAIL] sync.rs 缂哄皯 ipv6 蹇冭烦涓婃姤"; exit 1; }

      - name: Inject direct connection E2EE (IPv4/IPv6)
        if: fromJson(inputs.extras).ip_direct_board == 'true' || fromJson(inputs.extras).ip_direct_e2ee == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # IP 鐩磋繛绔埌绔姞瀵嗭細澶辫触鍗虫柇寮€锛屼笉鍥為€€鏄庢枃銆?
          # 娉ㄦ剰锛氭湰宸ヤ綔娴併€愪笉璋冪敤銆憄atch_common_client_disable_e2ee.py锛屽叏灞€ e2ee 淇濇寔寮€鍚€?
          python3 patches/patch_direct_e2ee.py .
          grep -q "async fn secure_direct_connection" src/client.rs || { echo "[FAIL] client.rs 缂哄皯 secure_direct_connection"; exit 1; }
          grep -q "direct-e2ee: send long-term pk" src/rendezvous_mediator.rs || { echo "[FAIL] rendezvous_mediator.rs 缂哄皯 direct-e2ee 鏍囪 (send_long_term_pk)"; exit 1; }
          grep -q "send_long_term_pk" src/server.rs || { echo "[FAIL] server.rs 缂哄皯 direct-e2ee 鏍囪 (send_long_term_pk)"; exit 1; }

      - name: Patch direct access UDP transport
        if: fromJson(inputs.extras).ip_direct_udp == 'true'
        shell: bash
        run: |
          # IP 鐩磋繛 UDP(KCP) 浼犺緭锛氫富鎺х UDP 浼樺厛锛?s 瓒呮椂鑷姩鍥為€€ TCP锛夛紱
          # 琚帶绔?direct_server 鍚岀鍙?UDP 鐩戝惉锛圞cpStream::accept -> create_tcp_connection 鍚屼竴鍏ュ彛锛夈€?
          python3 patches/patch_direct_udp.py .
          grep -q "fn direct_udp_server" src/rendezvous_mediator.rs || { echo "[FAIL] rendezvous_mediator.rs 缂哄皯 direct_udp_server"; exit 1; }
          grep -q "via UDP(KCP)" src/client.rs || { echo "[FAIL] client.rs 缂哄皯 direct udp 鍒嗘敮"; exit 1; }

      - name: Patch online devices sync and IP direct menu
        if: fromJson(inputs.extras).api_device_sync == 'true' || fromJson(inputs.extras).ip_direct_menu == 'true'
        shell: bash
        run: |
          # 鍦ㄧ嚎璁惧鍚屾锛堝彲璁块棶鐨勮澶?tab锛変笌璁惧鑿滃崟"IP鐩磋繛"/"鍒犻櫎璁惧"
