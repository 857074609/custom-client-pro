      - name: invite watch (v150)
        shell: bash
        run: |
          python3 patches/patch_invite_watch.py .          # [LnDesk v150] brand name for the toast, injected from the
          # workflow input (RustDesk default for stock builds).
          APPNAME="${{ inputs.appname }}"
          if [ -z "$APPNAME" ] || [ "$APPNAME" = "rustdesk" ]; then APPNAME="RustDesk"; fi
          echo "// [LnDesk v150] brand name injected from the workflow input." > flutter/lib/common/brand.dart
          echo "const kBrandAppName = '$APPNAME';" >> flutter/lib/common/brand.dart
          # v150: the tray process owns the last-resort invitation poll and
          # wakes the connection manager; the main window must hide instead
          # of destroying its engine. Assert what must survive - a silent
          # skip leaves invitations dead while CI stays green.
          grep -q "pub mod invite_watch" ./src/lib.rs || { echo "[FAIL] v150: invite_watch module not declared"; exit 1; }
          test $(grep -c "start_invite_watch_blocking" ./src/tray.rs) -eq 2 || { echo "[FAIL] v150: tray watcher call sites != 2"; exit 1; }
          grep -q "get_option_from_file" ./src/invite_watch.rs || { echo "[FAIL] v150: fresh token read missing"; exit 1; }
          grep -q "/api/invitation/incoming" ./src/invite_watch.rs || { echo "[FAIL] v150: incoming poll missing"; exit 1; }
          grep -q "windowManager.hide()" ./flutter/lib/desktop/pages/server_page.dart || { echo "[FAIL] v150: main window must hide on close"; exit 1; }
          test $(grep -c "gFFI.close()" ./flutter/lib/desktop/pages/server_page.dart) -eq 1 || { echo "[FAIL] v150: engine teardown must remain macOS-only"; exit 1; }
          grep -q "_runWithInviteDialogWidth" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: invite dialog window widen helper missing"; exit 1; }
          grep -q "inviteDialogWindowLocked" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: invite dialog window lock missing"; exit 1; }
          grep -q "inviteDialogWindowLocked" ./patches/desktop_home_page_new.dart || { echo "[FAIL] v150: home page auto-size guard missing"; exit 1; }
          grep -q "setResizable(true)" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: resizable lift missing"; exit 1; }
          grep -q "_applyIrohPreference" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: invite iroh preference helper missing"; exit 1; }
          test $(grep -c "_applyIrohPreference" ./flutter/lib/common/invite.dart) -eq 2 || { echo "[FAIL] v150: iroh preference must be applied on the main-window accept path"; exit 1; }
          grep -q "showShareDialog" ./patches/connection_page_both.dart || { echo "[FAIL] v150: share button missing in both-mode connection page"; exit 1; }
          grep -q "ShareApi" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: device share api missing"; exit 1; }
          grep -q "kBrandAppName" ./flutter/lib/common/brand.dart || { echo "[FAIL] v150: brand.dart not injected"; exit 1; }
          grep -q "kBrandAppName" ./flutter/lib/common/invite.dart || { echo "[FAIL] v150: brand name not used by the toast"; exit 1; }
          grep -q "main_write_log" ./src/flutter_ffi.rs || { echo "[FAIL] v150: dart log bridge missing"; exit 1; }
          echo "[OK] v150: invite watch wired"
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Cache the Flutter SDK itself (~1GB download+unzip) keyed by version.
          cache: true

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          set -u
          if [[ "3.24.5" != "${{ env.FLUTTER_VERSION }}" ]]; then
            echo "flutter version is not 3.24.5, no SDK patch needed"
            exit 0
          fi
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          # The SDK may be restored from the actions cache with this patch
          # already applied, so never apply it blindly twice.
          if git apply --check --reverse flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            echo "flutter SDK already patched (restored from cache), skipping"
          elif git apply --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            echo "flutter SDK patched"
          else
            echo "::error::cannot determine flutter SDK patch state"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.75
          targets: ${{ matrix.job.target }}
          components: "rustfmt"
      - name: cargo fetch (resolve lockfile)
        shell: bash
        run: |
          cargo fetch

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Cache vcpkg installed tree + source downloads
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-

      - name: magick stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: pwsh
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        run: |
          $url = "${env:GENURL}/png/${env:UUID}/icon.png"
          Write-Host "Downloading icon from: $url"
          Invoke-WebRequest -Uri $url -OutFile ./res/icon.png -ErrorAction Stop

          magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
          Copy-Item ./res/icon.ico ./res/tray-icon.ico
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          magick ./res/128x128.png -resize 200% ./res/128x128@2x.png

      - name: ui.rs icon
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png missing after magick step"
            exit 1
          fi
          b64=$(base64 -w0 ./res/icon.png)
          perl -i.bak -pe '
            BEGIN { $b64 = shift @ARGV }
            s/iVBORw0KGgo[A-Za-z0-9+\/=]{100,}/$b64/g;
          ' "$b64" ./src/ui.rs

      - name: Cache Dart/Flutter pub cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: pub-${{ matrix.job.os }}-${{ hashFiles('flutter/pubspec.yaml') }}
          restore-keys: |
            pub-${{ matrix.job.os }}-

      - name: replace flutter icons
        if: ${{ inputs.iconlink != 'false' }}
        run: |
          cd ./flutter
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

      - name: Install vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Verify vcpkg deps (cache-hit path)
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -d "$VCPKG_ROOT/installed" || { echo "::error::vcpkg installed tree missing after cache restore"; exit 1; }
          echo "vcpkg deps restored from cache OK"

      - name: session-tab connection mode always visible (v94)
        shell: bash
        run: |
          # v94 (REQ-v94-001, design D): keep the secure/direct shield hover but
          # show only the fingerprint; insert an always-visible connection-mode
          # Text (msgConn) between the shield and the peerId label in
          # flutter/lib/desktop/pages/remote_tab_page.dart so the mode is no
          # longer hover-only (touch / quick-glance observability). Idempotent
          # via the 'prod-line v94 tab-conn-badge' marker.
          # [v170] add-to-ab auto rename + desktop toolbar toggles
          python3 patches/patch_add_to_ab_rename.py .
          python3 patches/patch_peer_card_alias.py .
          python3 patches/patch_desktop_toolbar_toggles.py .
          python3 patches/patch_remote_tab_iroh_badge.py .
      - name: Login timeout watchdog + stale saved-password self-heal (V105)
        shell: bash
        run: |
          # 1) A stale saved password used to hang the session at "Connecting..."
          #    forever (peer never answers, no prompt, no picture) - the exact
          #    "stuck at the password dialog / frozen picture" symptom reported on
          #    the portable-quick build. This patch (a) clears the persisted copy
          #    when the failed attempt carried exactly that saved password, so the
          #    next attempt prompts, and (b) arms a 20s watchdog that swaps the
          #    endless spinner for a visible login-error dialog when no first
          #    image ever arrives - turning every future silent hang into a
          #    diagnosable "connection vs render" verdict.
          # 2) The script auto-selects the no-iroh variant of the self-heal when
          #    src/iroh_transport.rs is absent (v121: iroh removed from quick,
          #    toolchain is 1.75).
          python3 patches/patch_login_timeout.py .
          grep -qF "stale-saved-password" src/client.rs || { echo "[FAIL] client.rs missing stale-password self-heal"; exit 1; }
          grep -qF "login-watchdog" flutter/lib/desktop/pages/remote_page.dart || { echo "[FAIL] remote_page.dart missing login watchdog"; exit 1; }
          echo "[OK] V105 login watchdog + stale-password self-heal"
      - name: Build rustdesk
        run: |
          # Windows: build RustDesk 鈥?瀵归綈瀹樻柟 build-for-windows 鍙傛暟锛?-portable --skip-portable-pack锛?
          # 鎭㈠ --hwcodec --vram锛歱ortable 榛戝睆鏍瑰洜鏄?notrace 涓?_hwcodec 钀界洏澶辫触锛屽凡鐢?
          # patch_portable_notrace.py 鐨?SHARED 渚嬪锛坧atches f68ce3c锛変慨澶嶏紝鏁?hwcodec 鍙仮澶嶃€?
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # v121: usbmmidd_v2 (privacy-mode virtual display) no longer bundled -
          # privacy mode is stripped from this build.

      - name: icon stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png not found"
            exit 1
          fi
          ASSET_DIR="./rustdesk/data/flutter_assets/assets"
          ICON_SVG="$ASSET_DIR/icon.svg"
          [ -f "$ICON_SVG" ] && mv "$ICON_SVG" "$ICON_SVG.bak"
          magick ./res/icon.png "$ICON_SVG"

      - name: Download logo.png
        if: ${{ inputs.logolink == 'true' }}
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        shell: pwsh
        run: |
          $outDir = "./rustdesk/data/flutter_assets/assets"
          if (!(Test-Path $outDir)) {
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          }
          $uri = "${env:GENURL}/png/${env:UUID}/logo.png"
          Invoke-WebRequest -Uri $uri -OutFile "$outDir/logo.png" -TimeoutSec 30

      - name: find Runner.res
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Create custom_.txt file
        shell: bash
        run: |
          echo -n "${{ inputs.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Build single-file portable-quick executable (appname-quick.exe)
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ inputs.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ inputs.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          PACKER=$(find ./target -name "rustdesk-portable-packer.exe" | head -1)
          if [ -z "$PACKER" ]; then echo "::error::rustdesk-portable-packer.exe not found"; exit 1; fi
          mv "$PACKER" "./SignOutput/${APP_TAG}-quick.exe"
          ls -l ./SignOutput

      - name: Sign Windows binary (EXE only)
        if: env.UPLOAD_ARTIFACT == 'true' && (success() || failure())
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PASS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "Skipping signing: CODE_SIGN_PFX_BASE64 secret is not set."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "Skipping signing: CODE_SIGN_PASS_PASSWORD secret is not set."
            exit 0
          }
          Write-Host "Creating certificate file from CODE_SIGN_PFX_BASE64"
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          $certBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("certificate\certificate.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.Directory.FullName -like "*x64*" } |
                      Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                      Select-Object -First 1

          if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                        Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                        Select-Object -First 1
          }

          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows SDK paths."
            exit 1
          }
          Write-Host "Using signtool: $($signtool.FullName)"

          $exePath = ".\SignOutput\${{ inputs.appname }}-quick.exe"

          if (Test-Path $exePath) {
            Write-Host "Signing EXE: $exePath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $exePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "EXE not found at $exePath, skipping."
          }

      - name: Extract first 4 chars of UUID + build filename
        id: tag
        shell: bash
        run: |
          RAW_UUID="${{ github.event.inputs.uuid }}"
          CLEAN_UUID=$(echo "$RAW_UUID" | tr -d '-')
          SHORT_UUID=${CLEAN_UUID:0:4}
          APP_TAG=$(echo "${{ inputs.appname }}" | tr ' ' '_' | tr -cd 'A-Za-z0-9._-')
          NAME="${APP_TAG}-quick"
          echo "tag=$SHORT_UUID" >> "$GITHUB_OUTPUT"
          echo "release_tag=portable-quick-${APP_TAG}-${SHORT_UUID}" >> "$GITHUB_OUTPUT"
          echo "BUILD_FILENAME=$NAME" >> "$GITHUB_ENV"
          echo "value=$NAME" >> "$GITHUB_OUTPUT"
          echo "鉁?Build filename set to: $NAME"

      - name: Create GitHub Release and Upload Assets
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          prerelease: true
          files: |
            ./SignOutput/${{ steps.tag.outputs.value }}.exe

      - name: Send to file server
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        shell: bash
        run: |
          EXE="./SignOutput/${BUILD_FILENAME}.exe"
          URL="${{ secrets.GENURL }}/save_custom_client"
          TOKEN="${{ fromJson(inputs.extras).token }}"
          UUID="${{ inputs.uuid }}"
          curl -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@$EXE" \
            -F "uuid=$UUID" \
            "$URL"

      - name: Report Status
        continue-on-error: true
        shell: bash
        timeout-minutes: 60
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Success"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: cancelled
        if: cancelled()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

  # [build-fallback v135] Never leave the builder page polling forever.
  # The terminal "Success" report lives in the last job of this graph, so when an
  # upstream job fails that job is skipped and NOTHING is reported - the waiting
  # page used to spin until the browser was closed. This job depends on the
  # reporting job with `always()` and files a failure only when that job did not
  # succeed (failure / cancelled / skipped).
  notify-final-status:
    name: Notify final status
    needs: [build-for-windows-flutter]
    if: ${{ always() && needs.build-for-windows-flutter.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "Failed" is the canonical terminal string the builder maps to its failure
      # page, so this also works against a builder that predates the v135 fix.
      - name: Report failed status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras || '{}').token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Failed"}' \
            "${{ secrets.GENURL }}/updategh" || echo "Report status ping failed (non-fatal)"
