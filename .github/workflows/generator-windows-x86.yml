name: Custom Windows Sciter (32-bit) Client Generator
run-name: Custom Windows Sciter (32-bit) Client Generator

on: 
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: string
      serverinfo:
        description: 'serverinfo'
        required: true
        type: string
      custom:
        description: "Custom JSON"
        required: true
        default: ''
        type: string
      uuid:
        description: "uuid of request"
        required: true
        default: ''
        type: string
      ui_mode:
        description: "Custom User Interface (ignored for Sciter build)"
        required: false
        type: string
      screen_wall:
        description: "Enable Screen Wall (multi-view window)"
        required: false
        default: 'false'
        type: string
      iconlink:
        description: "icon link"
        required: false
        default: 'false'
        type: string
      logolink:
        description: "logo link"
        required: false
        default: 'false'
        type: string
      appname:
        description: "app name"
        required: true
        default: 'rustdesk'
        type: string
      filename:
        description: "Filename"
        required: true
        default: 'rustdesk'
        type: string
      extras:
        description: "extra inputs in json"
        required: true
        default: '{}'
        type: string



# Drop a superseded run: dispatching the same generator again cancels the run
# that is already in flight instead of queueing behind it. Different generators
# use different groups, so parallel Windows/Linux/Android builds are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
env:
  SCITER_RUST_VERSION: "1.85.0" # sciter 在 1.78 因 i128 layout 变更失败
  RUST_VERSION: "1.85.0"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # vcpkg version: 2024.07.12
  VERSION: "${{ fromJson(inputs.extras || '{}').version || 'master' }}"
  RUSTDESK_BUILD_NUMBER: "${{ fromJson(inputs.extras || '{}').build_number || '0' }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  TAG_NAME: "${{ fromJson(inputs.extras || '{}').version || 'master' }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"
  GENURL: ${{ secrets.GENURL }}
  WS_PORT: "${{ fromJson(inputs.extras || '{}').ws_port || '' }}"
  # cargo 走 git CLI 拉 git 依赖, 避免 Windows schannel 代理下 SEC_E_UNTRUSTED_ROOT
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  # force cargo default target to i686 so the self-extracting packer is also built 32-bit (win7 target removed 2026-09-04).
  CARGO_BUILD_TARGET: "i686-pc-windows-msvc"
  # 不设 SODIUM_LIB_DIR: libsodium-sys 走自带预编译包; Build 步骤 4.5 按目标架构选 x64/Win32
  # rust-cache 独立 key (sciter32-<arch>) 防跨架构缓存污染 (LNK4272)


jobs:
  build-RustDeskSciter32:
    name: Build Windows Sciter (32-bit)
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
    steps:
     
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set gdpro value
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.VERSION == 'master' && 'master' || format('refs/tags/{0}', env.VERSION) }}
          submodules: recursive
          fetch-depth: 1
      

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout patches scripts
        uses: actions/checkout@v5
        with:
          repository: 857074609/patches
          path: patches 
          token: ${{ secrets.REPO }}
          ref: main

      - name: Apply activate_os no-right-click patch
        run: python3 patches/patch_activate_os_fix.py .
      - name: Apply clipboard session sync patch
        run: python3 patches/patch_clipboard_session_sync.py .
      - name: Apply audio playback refactor patch
        run: python3 patches/patch_audio_playback_refactor.py .
      
      - name: Report Status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u73af\u5883\u51c6\u5907\u5c31\u7eea\uff0c\u5f00\u59cb\u5356\u529b\u5de5\u4f5c"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      
      - name: Decrypt and mask secrets
        id: decrypt
        shell: bash
        env:
          SERVERINFO: ${{ github.event.inputs.serverinfo }}
          BUILD_SECRET_KEY: ${{ secrets.BUILD_SECRET_KEY }}
          EXTRAS_JSON: ${{ inputs.extras }}
        run: |
          set +x
          SI="${{ github.event.inputs.serverinfo }}"
          if [ -z "$SI" ] || [ "$SI" = "placeholder" ]; then
            echo "::warning::serverinfo empty/placeholder -> no custom server from serverinfo"
          else
            pip install cryptography
          fi
          python -c "
          import os, json, sys
          try:
              from cryptography.fernet import Fernet
          except Exception:
              Fernet = None
          import ipaddress
          def derive_dns_url(host):
              # [v216] A relay (3340) and its pkarr server (3341) on the same host
              # can speak different protocols. In this deployment every named host
              # serves 3341 over TLS with a provisioned certificate, while a bare
              # IP cannot present one, so it stays plaintext. Deriving from the
              # relay scheme got this wrong whenever 3340 is plain http but 3341
              # is https.
              try:
                  ipaddress.ip_address(host)
              except ValueError:
                  return 'https://' + host + ':3341/pkarr'
              return 'http://' + host + ':3341/pkarr'
          data = {}
          SI = os.environ.get('SERVERINFO','')
          if SI and SI != 'placeholder' and Fernet is not None:
              try:
                  key = os.environ['BUILD_SECRET_KEY'].encode()
                  data = json.loads(Fernet(key).decrypt(SI.encode()).decode())
              except Exception as e:
                  print('::warning::serverinfo decrypt failed ('+str(e)+') -> ignoring')
          # extras fallback (non-secret; never overrides real serverinfo values)
          ex_raw = os.environ.get('EXTRAS_JSON','')
          if ex_raw:
              try:
                  ex = json.loads(ex_raw)
                  for k in ('server','RS_PUB_KEY','apiServer'):
                      if ex.get(k) and not data.get(k):
                          data[k] = ex[k]
              except Exception:
                  pass
          for field in ['server','RS_PUB_KEY','apiServer','irohRelayUrl','irohRelayUrl2','irohRelayUrl3','irohDnsUrl','irohDnsUrl2','irohDnsUrl3','permanentPassword','unlockPin','urlLink','downloadLink','updateLink']:
              v = data.get(field)
              if v: print('::add-mask::' + v)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write(f\"CUSTOM_SERVER={data.get('server','')}\n\")
              e.write(f\"CUSTOM_KEY={data.get('RS_PUB_KEY','')}\n\")
              e.write(f\"CUSTOM_APISERVER={data.get('apiServer','')}\n\")
              _relay = data.get('irohRelayUrl','') or ''
              _host = _relay.split('//')[-1].split(':')[0] if _relay else ''
              # [v215] irohDnsUrl overrides the derived pkarr URL. Relay(3340) and
              # pkarr(3341) can speak different protocols on the same host -- e.g.
              # 3340 plain http while 3341 is https with a real certificate. Scheme
              # inheritance from the relay URL is then wrong, so an explicit
              # irohDnsUrl wins; leaving it empty keeps the old derivation.
              _dnsu = (data.get('irohDnsUrl','') or '').strip() if _relay else ''
              if _relay and not _dnsu:
                  _dnsu = derive_dns_url(_host)
              if _dnsu:
                  print('::add-mask::' + _dnsu)
              if _host:
                  print('::add-mask::' + _host)
              e.write(f\"IROH_RELAY_URL={_relay}\n\")
              e.write(f\"IROH_DNS_URL={_dnsu}\n\")
              _relay2 = data.get('irohRelayUrl2','') or ''
              _host2 = _relay2.split('//')[-1].split(':')[0] if _relay2 else ''
              _dnsu2 = (data.get('irohDnsUrl2','') or '').strip() if _relay2 else ''
              if _relay2 and not _dnsu2:
                  _dnsu2 = derive_dns_url(_host2)
              if _dnsu2:
                  print('::add-mask::' + _dnsu2)
              if _host2:
                  print('::add-mask::' + _host2)
              e.write(f\"IROH_RELAY_URL_2={_relay2}\n\")
              e.write(f\"IROH_DNS_URL_2={_dnsu2}\n\")
              _relay3 = data.get('irohRelayUrl3','') or ''
              _host3 = _relay3.split('//')[-1].split(':')[0] if _relay3 else ''
              _dnsu3 = (data.get('irohDnsUrl3','') or '').strip() if _relay3 else ''
              if _relay3 and not _dnsu3:
                  _dnsu3 = derive_dns_url(_host3)
              if _dnsu3:
                  print('::add-mask::' + _dnsu3)
              if _host3:
                  print('::add-mask::' + _host3)
              e.write(f\"IROH_RELAY_URL_3={_relay3}\n\")
              e.write(f\"IROH_DNS_URL_3={_dnsu3}\n\")
              e.write(f\"PERMANENT_PASSWORD={data.get('permanentPassword','')}\n\")
              e.write(f\"UNLOCK_PIN={data.get('unlockPin','')}\n\")
              e.write(f\"URL_LINK={data.get('urlLink','')}\n\")
              e.write(f\"DOWNLOAD_LINK={data.get('downloadLink','')}\n\")
              e.write(f\"UPDATE_LINK={data.get('updateLink','')}\n\")
          "

      - name: Display last
        shell: bash
        run: |
          echo "CUSTOM_SERVER suffix:  ${CUSTOM_SERVER: -5}"
          echo "CUSTOM_KEY suffix:  ${CUSTOM_KEY: -5}"
          echo "CUSTOM_APISERVER suffix:  ${CUSTOM_APISERVER: -5}"
          echo "UNLOCK_PIN suffix:  ${UNLOCK_PIN: -1}"
          echo "PERMANENT_PASSWORD suffix:  ${PERMANENT_PASSWORD: -2}"
          echo "IROH_RELAY_URL present:  ${IROH_RELAY_URL:+yes}"
          echo "IROH_DNS_URL present:  ${IROH_DNS_URL:+yes}"
                    echo "IROH_RELAY_URL_2 present:  ${IROH_RELAY_URL_2:+yes}"
                    echo "IROH_DNS_URL_2 present:  ${IROH_DNS_URL_2:+yes}"
                    echo "IROH_RELAY_URL_3 present:  ${IROH_RELAY_URL_3:+yes}"
                    echo "IROH_DNS_URL_3 present:  ${IROH_DNS_URL_3:+yes}"
      
      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      
      - name: change appname to custom
        if: inputs.appname != 'rustdesk'
        env:
          APP_NAME: ${{ inputs.appname }}
          FILE_NAME: ${{ inputs.filename }}
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|ProductName = \"RustDesk\"|ProductName = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"${APP_NAME}\"|" ./Cargo.toml
          sed -i -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"${APP_NAME}.exe\"|" ./Cargo.toml

          # ./libs/portable/Cargo.toml
          sed -i -e "s|description = \"RustDesk Remote Desktop\"|description = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|ProductName = \"RustDesk\"|ProductName = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|FileDescription = \"RustDesk Remote Desktop\"|FileDescription = \"${APP_NAME}\"|" ./libs/portable/Cargo.toml
          sed -i -e "s|OriginalFilename = \"rustdesk.exe\"|OriginalFilename = \"${APP_NAME}.exe\"|" ./libs/portable/Cargo.toml

          # ./flutter/windows/runner/Runner.rc (exists in repo; harmless no-op for Sciter build)
          sed -i -e "s|\"RustDesk Remote Desktop\"|\"${APP_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|VALUE \"InternalName\", \"rustdesk\" \"\\\\0\"|VALUE \"InternalName\", \"${APP_NAME}\" \"\\\\0\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"rustdesk.exe\"|\"${FILE_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e "s|\"RustDesk\"|\"${APP_NAME}\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e '/pub static ref APP_NAME/s/"RustDesk"/"'"${APP_NAME}"'"/' ./libs/hbb_common/src/config.rs

          # ./src/lang/en.rs
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ inputs.appname }}|' {} \;
          # ./src/client.rs: hardcode the peer display name to APP_NAME so the
          # connection shows the branded name instead of the builtin option.
          sed -i '/let mut display_name = get_builtin_option(keys::OPTION_DISPLAY_NAME);/,/\.join(" ");/c\        let display_name = "'"${APP_NAME}"'".to_string();' ./src/client.rs
          sed -i -e 's|RustDesk|${{ inputs.appname }}|' ./res/msi/Package/License.rtf
          

      - name: fix registry if appname has a space
        if: contains(inputs.appname, ' ')
        shell: bash
        run: |
          #./src/platform/windows.rs
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\\open\\\\command\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command /f|reg add \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\\shell\\\\open\\\\command\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|{subkey}|\\\"{subkey}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\.{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg delete HKEY_CLASSES_ROOT\\\\{ext} /f|reg delete \\\"HKEY_CLASSES_ROOT\\\\{ext}\\\" /f|' ./src/platform/windows.rs
          
      - name: change company name
        if: fromJson(inputs.extras).compname != 'Purslane Ltd'
        shell: bash
        run: |
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e "s|\"Copyright © 2025 Purslane Ltd. All rights reserved.\"|\"Copyright © 2025 ${{ fromJson(inputs.extras).compname }}. All rights reserved.\"|" ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/Package/License.rtf
     
      - name: change url to custom
        if: env.URL_LINK != 'https://rustdesk.com' 
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.URL_LINK }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.URL_LINK }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.URL_LINK }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.URL_LINK }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.URL_LINK }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.URL_LINK }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.URL_LINK }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|rustdesk.com|${{ env.URL_LINK }}|" ./res/msi/Package/License.rtf
      
      - name: change download link to custom
        if: env.DOWNLOAD_LINK != 'https://rustdesk.com/download'
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.DOWNLOAD_LINK }}|' ./src/ui/index.tis
          
      - name: change update link to custom
        if: env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest'
        shell: bash
        run: |
          sed -i -e 's|https://api.rustdesk.com/version/latest|${{ env.UPDATE_LINK }}|' ./libs/hbb_common/src/lib.rs     

      - name: change about text
        if: ${{ fromJson(inputs.extras).Slogan_tip != '' }}
        env:
          SLOGAN: ${{ fromJson(inputs.extras).Slogan_tip }}
        shell: bash
        run: |
          ESCAPED=$(printf '%s' "$SLOGAN" | sed "s/'/'\\\\''/g; s/[&/\]/\\&/g")
          sed -i "s|translate('Slogan_tip')|'${ESCAPED}'|g" flutter/lib/desktop/pages/desktop_setting_page.dart
      
      - name: Extract conn-type (client type) 
        id: conn
        shell: pwsh
        run: |
          $c = "${{ inputs.custom }}"
          $t = "default"
          if ([string]::IsNullOrEmpty($c) -or $c -eq "placeholder") {
              Write-Host "::warning::Input empty/placeholder, using default conn-type: $t"
          } else {
              try {
                $bytes = [System.Convert]::FromBase64String($c)
                  $jsonStr = [System.Text.Encoding]::UTF8.GetString($bytes)
                  $obj = $jsonStr | ConvertFrom-Json

                  if ($null -ne $obj.'conn-type' -and $obj.'conn-type' -ne "") {
                      $t = $obj.'conn-type'
                      Write-Host "Successfully extracted conn-type: $t"
                  } else {
                      Write-Host "::warning::'conn-type' field is missing or empty in input JSON"
                  }
              } catch {
                  Write-Host "::warning::Failed to parse custom input, using default. Error: $($_.Exception.Message)"
                  $t = "default"
              }
          }
          $sanitized = $t -replace '[^a-zA-Z0-9_.-]', '_'
          if ($sanitized -ne $t) {
              Write-Host " Sanitized conn-type from '$t' to '$sanitized'"
              $t = $sanitized
          }
          "conn=$t" >> $env:GITHUB_OUTPUT
          "CLIENT_TYPE=$t" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host " Final conn-type output: $t"

      - name: Apply patches for custom update
        if:  env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download'
        run: |
          python3 patches/enable_custom_client_update.py
          python3 patches/patch_handle_update_url_1.py
          python3 patches/patch_filename_based_update.py
          python3 patches/patch_handle_update_url_2.py
          python3 patches/patch_custom_client_update_check.py
          python3 patches/patch_enable_auto_update.py
          python3 patches/patch_inject_client_type.py
          python3 patches/fix_update_tip.py

      - name: Apply patch for auto silent update
        if: ${{ fromJson(inputs.extras).auto_silent_update == 'true' && (env.UPDATE_LINK != 'https://api.rustdesk.com/version/latest' || env.DOWNLOAD_LINK != 'https://rustdesk.com/download') }}
        run: |
          python3 patches/patch_auto_silent_update.py

      - name: Auto open main window after silent install (v222)
        if: fromJson(inputs.extras).auto_open_ui == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 安装包双击 = libs/portable 包装器以内层 --silent-install 安装
          # （patch_silent_install.py #0011），该路径装完默认不拉 UI。
          # 本补丁在 core_main.rs 的 --silent-install 分支安装成功后拉起
          # 安装目录主程序；交互式安装 / 静默更新(update_me) / 卸载均不经过
          # 此分支，行为不变。win10+ 与 win7 工作流均含本步骤。
          python3 patches/patch_auto_open_ui.py .
          grep -q "fn auto_open_main_window_after_install" src/core_main.rs || { echo "[FAIL] core_main.rs missing auto-open hook"; exit 1; }

      - name: Apply domestic STUN fallback (domestic-only)
        if: fromJson(inputs.extras || '{}').super_p2p_enforcement != 'observe'
        # [LnDesk v298-followup] 原先的"国内优先 + 国外兜底"已收敛为**纯国内**：
        # cloudflare / nextcloud / google 三个境外项在 2026-10-10 现场双端日志里
        # 每一项都 timeout，既拿不到映射又白占 select_ok 的探测名额。口径与
        # super_p2p 侧 V298 的 STUN_TARGETS 一致。
        shell: bash
        run: |
          python3 patches/hand_stun.py
          echo ">> assert domestic-only STUN (common.rs STUNS_V4 + webrtc.rs ICE)"
          # 每条 STUN 表体单独取出来检查：注释里会提到被删掉的主机名，
          # 整体 grep 会误报（与 V298 的 STUN_TARGETS 断言同一个坑）。
          grep -qF 'stun.miwifi.com' src/common.rs \
            || { echo "[FAIL] v298-followup: common.rs STUNS_V4 not injected"; exit 1; }
          ! sed -n '/^static STUNS_V4/,/^\];/p' src/common.rs | grep -qE 'cloudflare|nextcloud|google|twilio' \
            || { echo "[FAIL] v298-followup: foreign STUN still in STUNS_V4"; exit 1; }
          ! sed -n '/^static DEFAULT_ICE_SERVERS/,/^\];/p' libs/hbb_common/src/webrtc.rs | grep -qE 'cloudflare|nextcloud|google|twilio' \
            || { echo "[FAIL] v298-followup: foreign STUN still in DEFAULT_ICE_SERVERS"; exit 1; }
          echo "[OK] v298-followup: STUNS_V4 + DEFAULT_ICE_SERVERS are domestic-only"

      - name: Set server
        shell: bash
        run: |
          if [ -z "${CUSTOM_SERVER}" ]; then
            echo "::warning::CUSTOM_SERVER empty — skipping set_server.py, build with default server"
            exit 0
          fi
          python3 patches/set_server.py

      - name: Apply compile-time server lock (OVERWRITE_SETTINGS)
        # Compiles ID/key/api/relay servers into the OVERWRITE_SETTINGS static
        # (highest option priority): locked, overrides saved RustDesk2.toml,
        # no sidecar custom_.txt server fields. set_server.py above stays as
        # the DEFAULT-layer fallback.
        shell: bash
        run: |
          python3 patches/patch_server_lock_compiletime.py
          # [LnDesk v259] 1s IDR for live sessions: caps H264/H265 mouse-move smear
          python3 patches/patch_keyframe_interval.py
          grep -q "else { Some(15) };" src/server/video_service.rs || { echo "[FAIL] video_service.rs keyframe_interval not patched"; exit 1; }

      - name: Apply hwcodec zerolatency fork patch (v260)
        shell: bash
        run: |
          # [LnDesk v260] Root fix for the H264/H265 hardware-encoder mouse
          # smear (V259's 1s IDR only capped the ghost lifetime): reroute the
          # hwcodec git dependency to our fork, pinned to the audited fix
          # commit. The fork forces low-latency hardware encoding:
          # NVENC rc-lookahead=0 + zerolatency=1 + tune=ull, QSV look_ahead=0,
          # AMF no-op -- all verified against the ffmpeg 7.1 option tables
          # shipped by the 1.4.9 vcpkg port. The script rewrites the
          # Cargo.lock hwcodec source line byte-exactly (proven
          # `cargo build --locked`-compatible); any drift still self-heals at
          # the pre-build `cargo fetch`, and the v260 lock gate asserts it.
          python3 patches/patch_hwcodec_zerolatency.py .
          grep -qF '[patch."https://github.com/rustdesk-org/hwcodec"]' Cargo.toml || { echo "[FAIL] v260: hwcodec [patch] table missing from Cargo.toml"; exit 1; }
          grep -qF '21f43533dc4b125b76a9e0d3fe4e2dbbf2035075' Cargo.toml || { echo "[FAIL] v260: hwcodec fork rev not pinned in Cargo.toml"; exit 1; }
          grep -qF '857074609/hwcodec' Cargo.lock || { echo "[FAIL] v260: hwcodec fork source line missing from Cargo.lock"; exit 1; }
          echo "[OK] v260: hwcodec routed to the zerolatency fork (mouse-smear root fix)"


      - name: Apply privacy virtual-display cursor-embedded patch (v261)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v261] The virtual-display privacy mode composites the OS
          # cursor into the captured frames (IddCx has no hardware cursor,
          # DWM draws it into the swapchain), but SwitchDisplay.cursor_embedded
          # stayed false -> the controller painted its own cursor overlay on
          # top: two cursors one video-latency apart during fast moves, gone
          # with privacy mode off. Report embedded=true while a virtual-
          # display privacy session owns the capture so the controller
          # suppresses the overlay (remote_page.dart gates both the
          # CursorPaint overlay and the local pointer on cursorEmbedded).
          python3 patches/patch_privacy_vdisplay_cursor_embedded.py .
          grep -qF '[LnDesk v261 privacy-cursor-embedded]' src/server/display_service.rs || { echo "[FAIL] v261: cursor_embedded marker missing"; exit 1; }
          grep -q 'is_current_privacy_mode_impl' src/server/display_service.rs || { echo "[FAIL] v261: privacy impl query not wired"; exit 1; }
          echo "[OK] v261: virtual-display privacy reports cursor_embedded=true"

      - name: Apply privacy cursor-by-encoder patch (v263)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v263] v261 regression fix: the embedded-cursor flag
          # must follow the ACTIVE encoder. Only the VRAM texture path
          # carries the OS-composited cursor of the privacy virtual
          # display; software encoders (VP8/VP9/AV1/H264RAM) never do, so
          # v261's blanket embedded=true left them pointerless (overlay
          # suppressed + no in-video cursor). Encoder::new now refreshes a
          # VRAM-active flag, display_service ANDs it into the v261
          # condition, and the video service broadcasts a fresh
          # SwitchDisplay on every (re)start (codec switch restarts the
          # service) so the controller overlay stays in sync. Must run
          # AFTER the v261 step (its anchor is the v261 output).
          python3 patches/patch_privacy_cursor_by_encoder.py .
          grep -qF '[LnDesk v263 vram-cursor-flag]' libs/scrap/src/common/codec.rs || { echo "[FAIL] v263: codec.rs flag missing"; exit 1; }
          grep -qF 'scrap::codec::is_vram_encoder_active' src/server/display_service.rs || { echo "[FAIL] v263: display_service condition not wired"; exit 1; }
          grep -qF '[LnDesk v263 vram-cursor-flag]' src/server/video_service.rs || { echo "[FAIL] v263: switchdisplay rebroadcast missing"; exit 1; }
          echo "[OK] v263: cursor_embedded follows the active encoder"


      - name: Apply low-latency pipeline patch (v269)
        shell: bash
        env:
          EXTRAS: '${{ inputs.extras }}'
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v269] steeldesk-derived low-latency pipeline, ALL
          # THREE pieces shipped together (v264/v266 taught us they are
          # inseparable): 1) hw encoder fps follows the QoS target
          # (upstream hardcodes 30); 2) QoS fast-path (1s ratio interval,
          # step 10, no INIT_FPS cap, RTT after 5 samples); 3) controller
          # 3-frame latest-wins queue + auto-fps unthrottled + queue drops
          # NEVER refresh (breaks the refresh<->restart loop). Gated by
          # is_low_latency_mode(): option low-latency-mode Y/N explicit,
          # empty = baked default from extras.low_latency_mode.
          python3 patches/patch_low_latency_pipeline.py .
          grep -qF '[LnDesk v269 low-latency]' src/server/video_qos.rs || { echo "[FAIL] v269: video_qos helper missing"; exit 1; }
          grep -qF 'framerate: config.fps.unwrap_or(30)' libs/scrap/src/common/vram.rs || { echo "[FAIL] v269: vram fps missing"; exit 1; }
          grep -qF 'fps: Some(VIDEO_QOS.lock().unwrap().highest_fps())' src/server/video_service.rs || { echo "[FAIL] v269: video_service fps feed missing"; exit 1; }
          grep -qF '[LnDesk v269 low-latency]' src/client/io_loop.rs || { echo "[FAIL] v269: io_loop gates missing"; exit 1; }
          echo "[OK] v269: low-latency pipeline applied"

      - name: Apply QoS ratio asymmetry patch (v297)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v297] Asymmetric ratio recovery, low-latency mode only.
          # Sustained full-motion scenes (spin a window) pushed avg_delay past
          # 150ms; upstream's UP path is proportional AND gated on
          # dynamic_screen, so once motion stops the gate closes and the ratio
          # never climbs back -- the 150 kbps limiter then throttles what does
          # get through. Fix: fixed +0.5 up-step, no dynamic_screen gate,
          # +1000 kbps allowance; DOWN path untouched. Requires the v269
          # is_low_latency_mode() helper, so it MUST run after the step above.
          python3 patches/patch_qos_ratio_asymmetry.py .
          grep -qF '[LnDesk v297 qos-ratio-asymmetry]' src/server/video_qos.rs || { echo "[FAIL] v297: ratio asymmetry marker missing"; exit 1; }
          grep -qF 'current_ratio + 0.5' src/server/video_qos.rs || { echo "[FAIL] v297: fixed up-step missing"; exit 1; }
          grep -qF 'let up_kbps = if is_low_latency_mode() {' src/server/video_qos.rs || { echo "[FAIL] v297: limiter relaxation missing"; exit 1; }
          echo "[OK] v297: QoS ratio asymmetry (fixed up-step, gate removed, allowance raised)"

      - name: Apply cursor prediction patch (v269)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v269] client-side cursor prediction with snap/lerp
          # server reconciliation. Self-gating: active only in low-latency
          # mode AND while the cursor is not embedded in the video
          # (virtual-display privacy), tracked live via SwitchDisplay.
          # Coordinates normalized to raw mouse space (HiDPI-safe). The
          # bridge job regenerates the Dart binding for
          # main_get_cursor_prediction.
          python3 patches/patch_cursor_prediction.py .
          grep -qF '[LnDesk v269 cursor-prediction]' src/cursor_prediction.rs || { echo "[FAIL] v269: predictor module missing"; exit 1; }
          grep -qF 'main_get_cursor_prediction' src/flutter_ffi.rs || { echo "[FAIL] v269: ffi missing"; exit 1; }
          grep -qF '[LnDesk v269 cursor-prediction]' src/client/io_loop.rs || { echo "[FAIL] v269: io_loop hooks missing"; exit 1; }
          echo "[OK] v269: cursor prediction applied"
      - name: Apply fps240 patch (v270)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v270 fps240] raise fps ceiling 120->240 across the
          # full chain: UI slider (consts.dart kMaxFps), server QoS
          # (video_qos.rs MAX_FPS), controller validation (io_loop.rs),
          # and legacy peer-compat cap (client.rs).
          python3 patches/patch_fps240.py .
          grep -qF "kMaxFps = 240" flutter/lib/consts.dart || { echo "[FAIL] v270: kMaxFps not 240"; exit 1; }
          grep -qF "kDefaultFps = 60" flutter/lib/consts.dart || { echo "[FAIL] v289: kDefaultFps not 60"; exit 1; }
          grep -qF "get_num_string(key, 60.0, 5.0, 240.0)" libs/hbb_common/src/config.rs || { echo "[FAIL] v289: config.rs fps fallback not 60 (ceiling stays 240)"; exit 1; }
          grep -qF "MAX_FPS: u32 = 240" src/server/video_qos.rs || { echo "[FAIL] v270: MAX_FPS not 240"; exit 1; }
          grep -qF "FPS: u32 = 60" src/server/video_qos.rs || { echo "[FAIL] v289: FPS baseline not 60"; exit 1; }
          echo "[OK] v270+v289 fps: ceiling 240 kept, effective default 60 (kDefaultFps / config fallback / encoder baseline)"

      - name: Apply qmax guard patch (v289)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v289] Quality guardrail on top of the VBR rate control
          # introduced by v260/v274:
          #   - qmin/qmax flow through the hwcodec FFI (ram + vram) into the
          #     vendor SDKs: NVENC enableMinQP/enableMaxQP (qmin is a PAIRED
          #     requirement -- qmax alone is a silent no-op), QSV reads the
          #     GLOBAL avctx->qmin/qmax, AMF hevc/av1 set MAX_QP_I/_P.
          #     AMF H.264 has no max-qp property at all -> guard skipped (V289
          #     accepted that vendor gap explicitly).
          #   - QP ceilings: H.264 = 28, H.265 = 32 (qmin = 10 both).
          #   - IDR bitrate boost x1.25 (calc_bitrate choke point) so the
          #     now-4x-more-frequent IDRs (GOP 60 -> 15) are not starved
          #     against a fixed budget -- the V273 full-screen mosaic lesson.
          python3 patches/patch_qmax_guard.py .
          grep -qF "CodecFormat::H265 => (10, 32)," src/server/video_service.rs || { echo "[FAIL] v289: qmin/qmax policy table missing"; exit 1; }
          grep -qF "let ratio = ratio * 1.25;" libs/scrap/src/common/hwcodec.rs || { echo "[FAIL] v289: IDR bitrate boost missing"; exit 1; }
          echo "[OK] v289: qmax guard (H264=28 / H265=32) + IDR bitrate boost active"

      - name: Apply GOP continuity patch (v302)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # [LnDesk v302] 隐私模式切换后保持 GOP 连续 —— AV1 errcode=7 根因修复。
          #
          # 链条：V289 把 live IDR 间隔压到 15 帧（4 IDR/s），同一次改动只给
          # **硬件**路径加了 1.25x 码率补偿（patch_qmax_guard.py 注释写明
          # "Software VP8/VP9/AV1 encoders are untouched ... not the low-latency
          # main line"），但现场跑的是 **AV1（软件 libaom）**。
          #
          # 更关键的是 aom.rs 一直用 rc_end_usage = AOM_CBR：CBR 的每片码率
          # 上限只给一个 IDR 约 7.7% 的 GOP 预算，而一个干净 IDR + 其后 14 个
          # P 帧需要 22.2%（4/18）—— 结构性 ~2.9x 缺口，QP 被压到帧内预测自身
          # 崩坏，客户端拿到解不了的帧 -> AOM_CODEC_CORRUPT_FRAME (errcode=7)
          # -> 解码器 reset 循环。隐私模式切换会重建编码器，新编码器 gop_counter
          # 从 0 起算、立刻要一个 IDR，正好撞在 QOS 刚复位、预算最紧的时刻。
          #
          # 修复（三处协同 + 一次强制 IDR）：
          #   (a1) 软件 AV1 补上 1.25x 码率补偿（AomEncoder::bitrate）
          #   (a2) **rc_end_usage CBR -> CQ**（载荷性修复：CQ 允许把一个 GOP 的
          #        预算不均匀地花在 IDR 上，长期均值仍由 rc_target_bitrate 约束）
          #   (a3) [rc_max_rate peak cap dropped: CI libaom's aom_codec_enc_cfg lacks the field; the CBR->CQ switch (a2) is the load-bearing fix]
          #   (b)  重建后的第一帧强制 IDR
          python3 patches/patch_gop_continuity.py .
          test -f libs/scrap/src/common/aom.rs || { echo "[FAIL] v302: aom.rs not found"; exit 1; }
          grep -qF 'aom_rc_mode::AOM_CQ' libs/scrap/src/common/aom.rs \
            || { echo "[FAIL] v302: rc_end_usage not switched to CQ (the load-bearing fix)"; exit 1; }
          # [rc_max_rate assert dropped: field absent in CI libaom; covered by the CQ switch (a2)]
          grep -qF 'IDR_BITRATE_BOOST' libs/scrap/src/common/aom.rs \
            || { echo "[FAIL] v302: software AV1 IDR bitrate boost missing"; exit 1; }
          grep -qF 'AOM_EFLAG_FORCE_KF' libs/scrap/src/common/aom.rs \
            || { echo "[FAIL] v302: aom force-keyframe flag missing"; exit 1; }
          grep -qF 'pub fn request_keyframe_next()' libs/scrap/src/common/codec.rs \
            || { echo "[FAIL] v302: codec.rs one-shot keyframe request missing"; exit 1; }
          grep -qF 'crate::codec::request_keyframe_next();' src/server/video_service.rs \
            || { echo "[FAIL] v302: video_service.rs does not request an IDR after rebuild"; exit 1; }
          echo "[OK] v302: aom CBR->CQ + IDR boost + forced IDR on rebuild"

      - name: Patch hwcodec fork source (v302b force_i)
        # [LnDesk v302b] HWRAM (nvenc/qsv/amf/vaapi over the shared ffmpeg
        # channel) 的 force_i 贯通：v302 的强制 IDR 只有真正落到 FFI 才有
        # 意义，否则硬编路径只是记录了请求却没强制。
        #
        # hwcodec 是通过根 Cargo.toml 的 [patch.".../hwcodec"] 表从
        # 857074609/hwcodec@rev 解析的**源码依赖**，cargo 会解包到
        # ~/.cargo/git/checkouts/hwcodec-* 下 —— workspace 里没有 hwcodec/。
        # 找不到 checkout 就 [SKIP] 并显式告警（宁可漏改也不静默编到未改的 fork）。
        shell: bash
        run: |
          set -e
          # hwcodec 是 feature-gated 的 git 依赖：普通 cargo fetch（默认特性）不会
          # 检出它，导致下面 glob 找不到 checkout、补丁被静默跳过（E0061）。
          # 快路径：特性感知解析强制物化 checkout；若失败再用真实构建命令预拉取
          # （cargo 在编译前必先 checkout 该 git 依赖，即便因未打补丁而在 scrap 处
          #  E0061 失败也无妨，checkout 已落地），兜底保障补丁能打上。
          cargo metadata --features hwcodec,vram,flutter --format-version 1 >/dev/null \
            || echo "::warning::[v302b] cargo metadata 失败，将用 cargo build 预拉取"
          CO=""
          for d in "$HOME"/.cargo/git/checkouts/hwcodec-*/*; do
            [ -f "$d/cpp/ffmpeg_ram/ffmpeg_ram_ffi.h" ] && CO="$d" && break
          done
          if [ -z "$CO" ]; then
            echo "::warning::[v302b] checkout 未物化，尝试 cargo build 预拉取 hwcodec"
            cargo build --features hwcodec,vram,flutter 2>&1 | tail -5 || true
            CO=""
            for d in "$HOME"/.cargo/git/checkouts/hwcodec-*/*; do
              [ -f "$d/cpp/ffmpeg_ram/ffmpeg_ram_ffi.h" ] && CO="$d" && break
            done
          fi
          if [ -z "$CO" ]; then
            echo "::warning::[v302b] hwcodec fork checkout STILL not found under ~/.cargo/git/checkouts; forced-IDR will NOT reach the hardware paths on this run (software AV1 is still fixed by v302)"
            exit 0
          fi
          echo ">> patching hwcodec fork at $CO"
          python3 patches/patch_hwcodec_force_i.py "$CO"
          grep -qF 'force_i' "$CO/cpp/ffmpeg_ram/ffmpeg_ram_ffi.h" \
            || { echo "[FAIL] v302b: hwcodec ram FFI missing force_i"; exit 1; }
          grep -qF 'AV_PICTURE_TYPE_I' "$CO/cpp/ffmpeg_ram/ffmpeg_ram_encode.cpp" \
            || { echo "[FAIL] v302b: hwcodec ram encode does not force I-frame"; exit 1; }
          grep -qF 'force_i' "$CO/cpp/ffmpeg_vram/ffmpeg_vram_ffi.h" \
            || { echo "[FAIL] v302b: hwcodec vram FFI missing force_i"; exit 1; }
          echo "[OK] v302b: hwcodec force_i plumbed through ram + vram FFI"

