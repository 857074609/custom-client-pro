          ! grep -q "static IROH_CANCEL_NOTIFY:" ./src/iroh_transport.rs || { echo "[FAIL] old global IROH_CANCEL_NOTIFY must be gone (per-session regression)"; exit 1; }
          ! grep -q "__IROH_RELAY_URL_2__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_RELAY_URL_2 placeholder not substituted"; exit 1; }
          ! grep -q "__IROH_DNS_URL_2__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_DNS_URL_2 placeholder not substituted"; exit 1; }
          grep -q "CUSTOM_IROH_RELAY_URL_2" ./src/iroh_transport.rs || { echo "[FAIL] iroh backup relay constant missing"; exit 1; }
          grep -q "backup self-hosted pkarr publish+resolve" ./src/iroh_transport.rs || { echo "[FAIL] iroh backup pkarr discovery missing"; exit 1; }
          ! grep -q "__IROH_RELAY_URL_3__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_RELAY_URL_3 placeholder not substituted"; exit 1; }
          ! grep -q "__IROH_DNS_URL_3__" ./src/iroh_transport.rs || { echo "[FAIL] IROH_DNS_URL_3 placeholder not substituted"; exit 1; }
          grep -q "CUSTOM_IROH_RELAY_URL_3" ./src/iroh_transport.rs || { echo "[FAIL] iroh third backup relay constant missing"; exit 1; }
          # [LnDesk v290] pkarr publish size guard. Each published attribute
          # is its own DNS TXT record and pkarr hard-caps the compressed
          # packet at 1000 bytes; a multi-homed host used to overflow it
          # ("expected max 1000 bytes but got: 1083") so EVERY self-hosted
          # pkarr publish failed and auto-iroh burned its full 10s direct
          # dial timeout. Guarded by: addr prune+cap and a relay-only retry.
          grep -q "PKARR_MAX_DIRECT_ADDRS: usize = 12" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr direct-addr cap missing"; exit 1; }
          grep -q "fn pkarr_select_direct_addrs" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr addr prune helper missing"; exit 1; }
          grep -q "retrying relay-only" ./src/iroh_transport.rs || { echo "[FAIL] v290: pkarr relay-only overflow fallback missing"; exit 1; }

      - name: iroh direct prewarm (v215)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          # [v215] After a long idle (>6.5s) iroh stops trusting the peer's
          # validated direct address (TRUST_UDP_ADDR_DURATION, best_addr.rs:10),
          # so the first dial degrades to MIXED and the relay usually wins the
          # race. This resolves the peer through the configured discovery
          # services and injects the direct addresses BEFORE the dial, widening
          # the candidate set. Non-blocking: the dial starts immediately, so
          # this can only add candidates, never delay the connection.
          python3 patches/iroh/iroh_direct_prewarm.py .
          grep -q "v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v215 prewarm helper missing"; exit 1; }
          grep -q 'futures-util' ./Cargo.toml || { echo "[FAIL] v215 needs futures-util for StreamExt"; exit 1; }
          # ------------------------------------------------------------------
          # v221: two-phase pre-warm (awaited head + detached tail)
          # ------------------------------------------------------------------
          # The pre-warm is only useful if it runs BEFORE the first QUIC flight.
          # `add_node_addr` fills the candidate pool but never sets `best_addr`
          # (iroh node_state.rs:663), and only a returned DISCO pong promotes one
          # (node_state.rs:976) -- while `best_addr == Empty` makes send_addr()
          # return Unconfirmed -> Mixed, i.e. direct merely RACES the relay
          # (udp_paths.rs:105). A detached pre-warm therefore cannot produce a
          # pure-direct dial. Hence the call must be AWAITED.
          grep -q "pub async fn v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v221 v215_prewarm_direct must be async (detached pre-warm is a known regression)"; exit 1; }
          ! grep -q "pub fn v215_prewarm_direct" ./src/iroh_transport.rs || { echo "[FAIL] v221 old non-async v215_prewarm_direct still present"; exit 1; }
          grep -qF "v215_prewarm_direct(ep.endpoint.clone(), node_id, peer_node_id).await;" ./src/iroh_transport.rs || { echo "[FAIL] v221 prewarm call site is not awaited"; exit 1; }
          grep -q "const V221_PREWARM_HEAD_MS" ./src/iroh_transport.rs || { echo "[FAIL] v221 blocking head window missing"; exit 1; }
          grep -q "fn v215_inject_item" ./src/iroh_transport.rs || { echo "[FAIL] v221 shared injection helper missing"; exit 1; }
          grep -q "fn v215_prewarm_tail" ./src/iroh_transport.rs || { echo "[FAIL] v221 detached tail consumer missing"; exit 1; }
          # v221: path-type observability. Without these the log never says
          # whether a session was direct / mixed / relay, so the direct rate is
          # unmeasurable and every future tuning decision is guesswork.
          grep -q "connected to {} via {}" ./src/iroh_transport.rs || { echo "[FAIL] v221 connect-time conn_type log missing"; exit 1; }
          grep -q "v221] idle-gap" ./src/iroh_transport.rs || { echo "[FAIL] v221 idle-gap diagnosis missing"; exit 1; }

      - name: iroh heartbeat (v88)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          python3 patches/iroh/iroh_heartbeat.py .
          grep -q 'v\["iroh_id"\]' ./src/hbbs_http/sync.rs || { echo "[FAIL] sync.rs missing iroh_id report"; exit 1; }

      - name: iroh menu (v88)
        if: fromJson(inputs.extras).enable_iroh_direct == 'true'
        shell: bash
        run: |
          python3 patches/iroh/iroh_menu.py .
          if grep -q 'String? ipv6;' ./flutter/lib/common/hbbs/hbbs.dart; then
            grep -q "_irohDirectAction" ./flutter/lib/common/widgets/peer_card.dart || { echo "[FAIL] peer_card missing iroh menu"; exit 1; }
          fi
          # ----------------------------------------------------------------------
          # [LnDesk v301] mixed-ok: auto-iroh 的 8 秒白等
          # ----------------------------------------------------------------------
          # [v223] "Direct-first hold" 把 `mixed(udp+relay)` 也当作"还没直连"，
          # 于是握手成功（249ms）后仍钻进 10s 迁移等待，吃掉 client.rs 的
          # 8000ms auto-iroh 预算，白等 8 秒才回落。v301 把等待条件收紧为
          # 「纯 Relay」，mixed 直接放行；等待上限 10s -> 3s。
          python3 patches/patch_iroh_mixed_ok.py .
          grep -qF 'HOLD_MS_DIRECT_FIRST: u64 = 3_000' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: iroh hold not bounded to 3s"; exit 1; }
          grep -qF 'ConnectionType::Relay { .. }' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: iroh mixed-ok gate missing (mixed must not wait)"; exit 1; }
          ! grep -qF 'Some(iroh::endpoint::ConnectionType::Direct { .. })' ./src/iroh_transport.rs \
            || { echo "[FAIL] v301: v223 Direct-only hold condition still present"; exit 1; }
          echo "[OK] v301: auto-iroh treats mixed(udp+relay) as usable (hold only for relay-only, 3s)"

      - name: fix connection delay  
        if: ${{ fromJson(inputs.extras).delayFix == 'true' }}
        shell: bash
        run: |
          python3 patches/patch_delay_fix.py .
          grep -qF '// [LnDesk v162] delayFix' ./src/client.rs || { echo "[FAIL] delayFix patch not applied"; exit 1; }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"
      - name: pin iroh lock closure to MSRV-safe versions (v88)
        shell: bash
        run: |
          # iroh 0.35 pulls url 2.5.4 (via iroh-relay) -> idna 1.1 -> idna_adapter.
          # idna_adapter is pinned to =1.2.0 in Cargo.toml (via patch_iroh_transport.py),
          # which drags the whole icu subtree to the 1.x line (MSRV 1.67) so the pinned
          # 1.85.0 toolchain can build the iroh closure. 1.2.0 is the only 1.2.x build
          # that depends on icu 1.x; 1.2.1/1.2.2 pull icu 2.x (rust-version 1.82/1.86)
          # which the toolchain cannot compile. The pin lives in Cargo.toml (not a
          # post-hoc `cargo update`), so the first lock resolution already selects it.
          # Guarded so builds without iroh (e.g. quick) skip the pin cleanly.
          if grep -q '^iroh' ./Cargo.toml; then
            cargo fetch
            if ! grep -A1 'name = "idna_adapter"' ./Cargo.lock | grep -q '1\.2\.0'; then
              echo "[FAIL] idna_adapter is not 1.2.0"; exit 1
            fi
            if grep -A1 'name = "icu_' ./Cargo.lock | grep -qE 'version = "2\.'; then
              echo "[FAIL] icu >= 2.0 (rust-version >= 1.86) still in lock"; exit 1
            fi
            echo "[OK] MSRV-1.85 lock: idna_adapter $(grep -A1 'name = "idna_adapter"' ./Cargo.lock | tail -1)"
          else
            echo "[SKIP] iroh not in Cargo.toml, no icu pin needed"
            cargo fetch
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}
          # 独立 key 隔离: 与 64 位共用默认 prefix 会复用 x64 libsodium rlib → LNK4272
          key: sciter32-${{ matrix.job.arch }}
       
      - name: Setup vcpkg (manual, retry-safe — replaces lukka/run-vcpkg flaky downloader)
        shell: bash
        env:
          VCPKG_COMMIT_ID: ${{ env.VCPKG_COMMIT_ID }}
        run: |
          set -u
          VCPKG_ROOT="C:/vcpkg"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_ROOT"
          # 清掉复用 runner 可能残留的坏 vcpkg.exe, 杜绝"假绿"带着损坏二进制进 install 步
          rm -f "$VCPKG_ROOT/vcpkg.exe"

          # 1) clone vcpkg repo at pinned commit (retry on flaky network)
          if [ ! -f "$VCPKG_ROOT/.git/config" ]; then
            rm -rf "$VCPKG_ROOT/.git" 2>/dev/null || true
            for i in 1 2 3 4 5; do
              echo "::group::git clone vcpkg attempt $i"
              if git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"; then
                echo "::endgroup::"; break
              fi
              echo "::endgroup::"; echo "clone flaky, retry $i"; sleep 15
            done
          fi
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT_ID" 2>/dev/null || true
          git -C "$VCPKG_ROOT" checkout -f "$VCPKG_COMMIT_ID" 2>/dev/null || \
            git -C "$VCPKG_ROOT" reset --hard "$VCPKG_COMMIT_ID" 2>/dev/null || true

          # 2) 下载预编译 vcpkg.exe —— 版本号取自本 commit 的 scripts/vcpkg-tool-metadata.txt
          #    (VCPKG_TOOL_RELEASE_TAG=2025-07-21)，与该 commit 完全配对，绝不会出现版本错配。
          #    下载抖动(ERROR_INTERNET_INVALID_SERVER_RESPONSE / 503)用激进重试兜住;
          #    校验改为真正执行 `vcpkg.exe version`(能跑才收)，跑不起来即删重试，
          #    绝不把坏文件流向下游 install 步。
          URL="https://github.com/microsoft/vcpkg-tool/releases/download/2025-07-21/vcpkg.exe"
          for i in $(seq 1 20); do
            echo "::group::download vcpkg.exe attempt $i"
            curl --proto '=https' --tlsv1.2 \
              --retry 20 --retry-all-errors --retry-connrefused --retry-delay 10 --retry-max-time 2400 \
              --connect-timeout 30 --max-time 900 -L --fail \
              -o "$VCPKG_ROOT/vcpkg.exe" "$URL"
            rc=$?
            echo "curl rc=$rc"
            ok=0
            if [ -f "$VCPKG_ROOT/vcpkg.exe" ]; then
              # 快速预检: MZ 头 + 合理体积
              sz=$(stat -c%s "$VCPKG_ROOT/vcpkg.exe" 2>/dev/null || echo 0)
              magic=$(head -c 2 "$VCPKG_ROOT/vcpkg.exe" 2>/dev/null || true)
              if [ "$rc" -eq 0 ] && [ "${sz:-0}" -gt 5000000 ] && [ "$magic" = "MZ" ]; then
                # 决定性校验: 二进制必须真的能跑出 version，否则视为损坏
                if "$VCPKG_ROOT/vcpkg.exe" version >/dev/null 2>&1; then
                  ok=1
                else
                  echo "vcpkg.exe 存在但执行 version 失败 — 损坏下载，丢弃重试"
                fi
              fi
            fi
            echo "::endgroup::"
            if [ "$ok" -eq 1 ]; then
              echo "vcpkg.exe verified OK (runs 'version')"; break
            fi
            echo "attempt $i 产出无效文件，删除并重试"
            rm -f "$VCPKG_ROOT/vcpkg.exe"
            sleep 10
          done

          if [ ! -f "$VCPKG_ROOT/vcpkg.exe" ]; then
            echo "::error::vcpkg.exe download failed after retries"
            exit 1
          fi
          ls -l "$VCPKG_ROOT/vcpkg.exe"
          "$VCPKG_ROOT/vcpkg.exe" version

      - name: Cache vcpkg installed tree + source downloads
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/downloads
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}-

      # The x86 triplet has no warm binary cache upstream, so every port
      # (aom/ffmpeg/libvpx/opus/...) was compiled from source on each run.
      # Exact cache hit -> installed tree already matches this manifest +
      # overlay ports + triplet, so vcpkg install is a no-op; skip it (~0s).
      # Partial hit (restore-keys) -> run install; vcpkg resumes the delta
      # from the restored downloads/installed instead of rebuilding all.
      - name: Install vcpkg dependencies (32-bit)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        shell: bash
        run: |
          # 1) 安装 rustdesk manifest 依赖（manifest 模式，不能带单个包名参数）
          #    x86 triplet 无暖二进制缓存，需从源码构建；libjpeg-turbo 等 tarball 偶发
          #    WinHttp 12152（无效服务器响应）下载抖动，故加重试循环，命中即停。
          ok=0
          for i in 1 2 3 4 5; do
            echo "::group::vcpkg install attempt $i"
            if $VCPKG_ROOT/vcpkg \
              install \
              --triplet ${{ matrix.job.vcpkg-triplet }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "attempt $i failed, retrying in 30s (vcpkg 会跳过已装包、重试失败包)"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          # 2) 不装 libsodium: libsodium-sys 自带预编译包按目标自动选取
       
      - name: Verify vcpkg deps (cache-hit path)
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -d "$VCPKG_ROOT/installed" || { echo "::error::vcpkg installed tree missing after cache restore"; exit 1; }
          echo "vcpkg deps restored from cache OK"

      - name: magick stuff
        if: ${{ inputs.iconlink == 'true' }}
        shell: pwsh
        env:
          GENURL: ${{ secrets.GENURL }}
          UUID: ${{ inputs.uuid }}
        run: |
          $url = "${env:GENURL}/png/${env:UUID}/icon.png"
          Write-Host "Downloading icon from: $url"
          Invoke-WebRequest -Uri $url -OutFile ./res/icon.png -ErrorAction Stop
          
          magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
          Copy-Item ./res/icon.ico ./res/tray-icon.ico
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          magick ./res/128x128.png -resize 200% ./res/128x128@2x.png

      - name: ui.rs icon
        if: ${{ inputs.iconlink == 'true' }}
        shell: bash
        run: |
          if [ ! -f "./res/icon.png" ]; then
            echo "::error::icon.png missing after magick step"
            exit 1
          fi
          b64=$(base64 -w0 ./res/icon.png)
          perl -i.bak -pe '
            BEGIN { $b64 = shift @ARGV }
            s/iVBORw0KGgo[A-Za-z0-9+\/=]{100,}/$b64/g;
          ' "$b64" ./src/ui.rs


      # === Sciter 32-bit build ===
      - name: Allow git submodule fetch through TLS-intercepting proxy
        # 代理/自托管环境根 CA 不受信任时关 schannel 校验, 以拉取 git 子模块
        shell: pwsh
        run: |
          git config --global http.sslVerify false
          git config --global http.schannelCheckRevoke false

      - name: session-tab connection mode always visible (v94)
        shell: bash
        run: |
          # v94 (REQ-v94-001, design D): keep the secure/direct shield hover but
          # show only the fingerprint; insert an always-visible connection-mode
          # Text (msgConn) between the shield and the peerId label in
          # flutter/lib/desktop/pages/remote_tab_page.dart so the mode is no
          # longer hover-only (touch / quick-glance observability). Idempotent
          # via the 'prod-line v94 tab-conn-badge' marker.
          # [v170] add-to-ab auto rename + desktop toolbar toggles
          python3 patches/patch_add_to_ab_rename.py .
          python3 patches/patch_peer_card_alias.py .
          python3 patches/patch_desktop_toolbar_toggles.py .
          python3 patches/patch_add_address_book.py .
          python3 patches/iroh/iroh_badge.py .
      - name: Build rustdesk (Sciter, 32-bit)
        shell: bash
        run: |
          # 0) 清 libsodium 缓存, 确保稍后从打补丁的 build.rs 重新编译
          cargo clean -p libsodium-sys -p sodiumoxide 2>/dev/null || true

          # 1) 内联 Sciter UI
          python3 res/inline-sciter.py

          # 2) 32 位必须用 sciter-rs 的 dyn_x86 分支
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml

          # 3) 先拉依赖 (含 dyn_x86 分支), 便于打补丁后再编
          cargo fetch

          # 4) 移除 sciter-rs dyn_x86 分支残留的 #![feature(abi_thiscall)] (stable 上非法)
          find "$HOME/.cargo/git/checkouts" -path '*rust-sciter*/src/lib.rs' \
            -exec sed -i 's|^#!\[feature(abi_thiscall)\]$||' {} + || true

          # 4.5) libsodium-sys 0.2.7 build.rs 用 cfg!(target_pointer_width) 选包, 但该值恒为 HOST(x64);
          #      改为读 CARGO_CFG_TARGET_POINTER_WIDTH (host=64 / i686=32) 选 msvc/x64|Win32
          f=$(find "$HOME/.cargo/registry/src" -path '*libsodium-sys-0.2.7/build.rs' | head -1)
          if [ -z "$f" ]; then echo "::error::libsodium-sys-0.2.7/build.rs not found"; exit 1; fi
          perl -i -pe 's#\Qget_crate_dir().join("msvc/x64/Release/v142/")\E#get_crate_dir().join(if env::var("CARGO_CFG_TARGET_POINTER_WIDTH").map(|v| v == "32").unwrap_or(false) { "msvc/Win32/Release/v142/" } else { "msvc/x64/Release/v142/" })#g' "$f"
          perl -i -pe 's#\Qget_crate_dir().join("msvc/x64/Debug/v142/")\E#get_crate_dir().join(if env::var("CARGO_CFG_TARGET_POINTER_WIDTH").map(|v| v == "32").unwrap_or(false) { "msvc/Win32/Debug/v142/" } else { "msvc/x64/Debug/v142/" })#g' "$f"
          echo "libsodium-sys build.rs patched (CARGO_CFG_TARGET_POINTER_WIDTH occurrences: $(grep -c CARGO_CFG_TARGET_POINTER_WIDTH "$f"))"

          # 4.6) 补丁后清缓存, 强制从打补丁的 build.rs 重生 libsodium
          cargo clean -p libsodium-sys -p sodiumoxide 2>/dev/null || true

          # 5) 编译 32 位 Sciter (不传 --flutter); 不能用 --locked (本流程改 Cargo.toml 致锁文件不一致)
          cargo build --release --features inline,vram,hwcodec --target i686-pc-windows-msvc --bins

          # 收集产物并下载 32 位 sciter.dll (必须 x32, 否则无法启动)
          mkdir -p ./rustdesk
          cp ./target/i686-pc-windows-msvc/release/rustdesk.exe ./rustdesk/ || exit 1
          cp ./target/i686-pc-windows-msvc/release/*.dll ./rustdesk/ 2>/dev/null || true
          curl -LJ -o ./rustdesk/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          echo "sciter.dll size: $(stat -c%s ./rustdesk/sciter.dll 2>/dev/null || echo unknown)"


      - name: Create custom_.txt file
        shell: bash
        run: |
          echo -n "${{ inputs.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Stage code-signing public cert into package
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          cp -f patches/CodeSignCert_Public.cer ./rustdesk/CodeSignCert_Public.cer
          echo "✅ public cert staged into ./rustdesk/ (imported at install time)"
      
      - name: Build self-extracted executable (32-bit packer)
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ inputs.appname }}.exe" || echo "rustdesk.exe"
          # CARGO_BUILD_TARGET=i686 已设, packer 也编成 32 位
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ inputs.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          # libs/portable 是根 workspace member, target 在仓库根 ./target (非 libs/portable/target)
          PACKER=$(find ./target -name "rustdesk-portable-packer.exe" | head -1)
          if [ -z "$PACKER" ]; then
            echo "::error::rustdesk-portable-packer.exe not found"
            exit 1
          fi
          mv "$PACKER" "./SignOutput/rustdesk.exe"
          echo "✅ packer built at: $PACKER"

      - name: Sign Windows binaries (EXE)
        if: env.UPLOAD_ARTIFACT == 'true' && (success() || failure())
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PASS_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "Skipping signing: CODE_SIGN_PFX_BASE64 secret is not set."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            Write-Host "Skipping signing: CODE_SIGN_PASS_PASSWORD secret is not set."
            exit 0
          }
          Write-Host "Creating certificate file from CODE_SIGN_PFX_BASE64"
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          $certBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [System.IO.File]::WriteAllBytes("certificate\certificate.pfx", $certBytes)
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.Directory.FullName -like "*x64*" } |
                      Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                      Select-Object -First 1
      
          if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" -ErrorAction SilentlyContinue |
                        Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
                        Select-Object -First 1
          }
      
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows SDK paths."
            exit 1
          }
          Write-Host "Using signtool: $($signtool.FullName)"
      
          $exePath = ".\SignOutput\rustdesk.exe"
          if (Test-Path $exePath) {
            Write-Host "Signing EXE: $exePath"
            & $signtool.FullName sign /fd SHA256 /tr http://ts.ssl.com /td SHA256 /f certificate\certificate.pfx /p $env:PFX_PASSWORD $exePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "EXE not found at $exePath, skipping."
          }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Include "signtool.exe" | ForEach-Object { Write-Host "Found: $($_.FullName)" }

      - name: Extract first 4 chars of UUID
        id: tag
        shell: bash
        run: |
          RAW_UUID="${{ github.event.inputs.uuid }}"
          CLEAN_UUID=$(echo "$RAW_UUID" | tr -d '-')
          SHORT_UUID=${CLEAN_UUID:0:4}
          echo "tag=$SHORT_UUID" >> "$GITHUB_OUTPUT"
          
      - name: Set build filename
        id: build_name
        shell: bash
        run: |
          VER="${{ env.VERSION }}"
          W="${{ env.RUSTDESK_BUILD_NUMBER }}"
          # 始终带第4段构建号（W，即使 0 -> .0）：保证构建文件名与下载链接一致，且始终显示4段版本号
          VER_SUFFIX=".${W:-0}"
          NAME="${{ inputs.filename }}-${VER}${VER_SUFFIX}-win-${{ steps.conn.outputs.conn }}-i686-${{ steps.tag.outputs.tag }}"
          echo "BUILD_FILENAME=$NAME" >> "$GITHUB_ENV"
          echo "value=$NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Build filename set to: $NAME"
      
      - name: Rename EXE
        shell: bash
        run: |
          mv "./SignOutput/rustdesk.exe" "./SignOutput/${BUILD_FILENAME}-X86-install.exe"
          echo "✅ EXE renamed to ${BUILD_FILENAME}-X86-install.exe"
      
      - name: Rename MSI (optional, skipped for Sciter build)
        shell: bash
        run: |
          test -f "./SignOutput/rustdesk.msi" && \
            mv "./SignOutput/rustdesk.msi" "./SignOutput/${BUILD_FILENAME}.msi" && \
            echo "✅ MSI renamed to ${BUILD_FILENAME}.msi" || \
            echo "⚠️ No MSI for Sciter build, skipping rename."
      
      - name: Create GitHub Release and Upload Assets
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_name.outputs.value }}
          name: Release ${{ steps.build_name.outputs.value }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            ./SignOutput/${{ steps.build_name.outputs.value }}-X86-install.exe
      
      - name: Send to file server
        if: ${{ fromJson(inputs.extras).gdpro == 'true' }}
        shell: bash
        run: |
          EXE="./SignOutput/${BUILD_FILENAME}-X86-install.exe"
          URL="${{ secrets.GENURL }}/save_custom_client"
          TOKEN="${{ fromJson(inputs.extras).token }}"
          UUID="${{ inputs.uuid }}"
          curl -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@$EXE" \
            -F "uuid=$UUID" \
            "$URL"
           
      - name: Report Status
        continue-on-error: true
        shell: bash
        timeout-minutes: 60
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Success"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"
      - name: failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

      - name: failed
        if: cancelled()
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras).token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "\u65e0\u826f\u8001\u677f\u628a\u725b\u9a6c\u7d2f\u574f\u4e86\uff0c\u5df2\u7ecf\u5ba3\u5e03\u7f62\u5de5"}' \
            "${{ env.STATUS_URL }}" || echo "Report status ping failed (non-fatal)"

  # [build-fallback v135] Never leave the builder page polling forever.
  # The terminal "Success" report lives in the last job of this graph, so when an
  # upstream job fails that job is skipped and NOTHING is reported - the waiting
  # page used to spin until the browser was closed. This job depends on the
  # reporting job with `always()` and files a failure only when that job did not
  # succeed (failure / cancelled / skipped).
  notify-final-status:
    name: Notify final status
    needs: [build-RustDeskSciter32]
    if: ${{ always() && needs.build-RustDeskSciter32.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "Failed" is the canonical terminal string the builder maps to its failure
      # page, so this also works against a builder that predates the v135 fix.
      - name: Report failed status
        continue-on-error: true
        shell: bash
        run: |
          echo "::add-mask::${{ fromJson(inputs.extras || '{}').token }}"
          curl -fsS --max-time 30 -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: Bearer ${{ fromJson(inputs.extras || '{}').token }}" \
            -d '{"uuid": "${{ inputs.uuid }}", "status": "Failed"}' \
            "${{ secrets.GENURL }}/updategh" || echo "Report status ping failed (non-fatal)"
